        snippet: "IL-22 is required for the direct induction of the Reg family of antimicrobial proteins, including RegIIIbeta and RegIIIgamma, in colonic epithelial cells."
        explanation: >-
          The defining paper's mechanism: IL-22 protects by inducing epithelial
          antimicrobial proteins.
    curator_note: >-
      9/196, p ~6e-10 (Ccl5, Ccl8, Cxcl5, Pf4, Reg3a, S100a9, Slpi, Tac1, Trf, all via
      closure). Mechanistic: a cytokine perturbation resolves to epithelial
      antimicrobial secretion, the effector arm of IL-22 protection. The paper's
      key Reg3b and Reg3g are absent from this set, so the recovered signal comes
      from other antimicrobials.
