  id: NCBITaxon:10090
  label: Mus musculus
direction: UP
description: >-
  MSigDB mouse M2:CGP set (M1800) of 65 genes induced by IL-22 signalling in the mouse
  colon during Citrobacter rodentium infection (Zheng et al. 2008, PMID:18264109,
  Table 1S). IL-22, made by innate and T cells, acts on epithelial cells through STAT3.
  GO enrichment recovers an epithelial host-defence programme. Antimicrobial
  effectors: Reg3a, S100a8, S100a9, Slpi, Trf. Neutrophil-recruiting chemokines:
  Cxcl5, Ccl5, Ccl8, Pf4. Acute-phase/iron-sequestering proteins: Hp, Trf, Lrg1,
  Heph. Barrier genes: Tgm1, Cldn1, Dsc2. The paper's central mechanism is induction
  of RegIIIbeta and RegIIIgamma (Reg3b, Reg3g), but those two are not in this MSigDB
  set; only Reg3a is.
