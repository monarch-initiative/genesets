    aspect: biological_process
    category: supporting_process
    confidence: medium
    specificity: lineage_shared
    seed_source: curator_added
    recovery_status: annotation_gap
    insight: mechanistic
    curator_note: >-
      Hp, Trf and Lrg1 are acute-phase proteins induced by IL-22/STAT3, and Hp and Trf
      also sequester haem and iron from bacteria. None of them is annotated to
      acute-phase response in MGI GOA (0/65 of a term with 18 annotated mouse genes).
      This is the same mouse annotation gap recorded for CADWELL_ATG16L1_TARGETS_UP
      (Saa1, Saa2, Hp), so it looks systematic rather than incidental.
  - term:
      id: GO:0050829
      label: defense response to Gram-negative bacterium
    aspect: biological_process
    category: core_process
    confidence: medium
    specificity: lineage_shared
    seed_source: curator_added
    recovery_status: membership_gap
    insight: confirmatory
    curator_note: >-
      Citrobacter rodentium is Gram-negative, and Reg3b, one of the two Reg proteins
      the paper shows IL-22 induces, is the classic effector against Gram-negative
      bacteria. Reg3b and Reg3g are absent from this set, and only Tac1 is annotated
      here (1/65). The defining biology is present in the paper but missing from
      the captured membership: a membership gap.
