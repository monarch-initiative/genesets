        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In CKO limbs, expression of genes throughout the whole cholesterol biosynthetic pathway was upregulated, and cholesterol deficiency can explain most aspects of the phenotype."
        explanation: >-
          The defining paper reports the same pathway-wide induction this set
          captures and attributes the limb phenotype to cholesterol deficiency.
    curator_note: >-
      The dominant and mechanistically decisive term. 16 of 28 members are directly
      annotated to cholesterol biosynthesis in MGI GOA (Hmgcs1, Mvk, Mvd, Fdps,
      Idi1, Fdft1, Sqle, Lss, Cyp51, Msmo1, Nsdhl, Tm7sf2, Sc5d, Dhcr7, Acat2,
      Insig1); 16/35 of the term's annotated genes, p ~1e-41 in a GOA-mouse run.
      Marked mechanistic: the set is defined by deleting a generic P450 reductase,
      not by any sterol gene, so the convergence on sterol synthesis (out of all
      POR-dependent pathways) is the non-obvious finding that identifies cholesterol
      deficiency as the operative mechanism.
  - term:
      id: GO:0042632
      label: cholesterol homeostasis
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: broadly_expressed
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      The induction is a homeostatic feedback response: Srebf2 itself, its retention
      partner Insig1 (an SREBP target), the LDL receptor Ldlr and the sterol
      transporter Stard4 are all present, i.e. the SREBP-2 sterol-sensing loop
      responding to low ER cholesterol. Insig1, Ldlr, Scd1, Soat2 and Srebf2 are
      directly annotated to cholesterol homeostasis in MGI GOA (5/28 of a 117-gene
      term; p ~1e-7), so the term is recovered, though far less strongly than the
      biosynthesis term. It carries the regulatory mechanism.
