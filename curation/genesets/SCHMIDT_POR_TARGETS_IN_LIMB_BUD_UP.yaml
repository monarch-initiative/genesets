gene_set_id: MSIGDB:SCHMIDT_POR_TARGETS_IN_LIMB_BUD_UP
gene_set_name: SCHMIDT_POR_TARGETS_IN_LIMB_BUD_UP
collection: M2:CGP
msigdb_release: v2025.1.Mm
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
direction: UP
description: >-
  MSigDB mouse M2:CGP set (M2383) of 28 genes up-regulated in E12.5 forelimb buds
  of mice with a limb-mesenchyme conditional deletion of Por, the obligate electron
  donor for all microsomal cytochrome P450 enzymes (Schmidt et al. 2009,
  PMID:19273610, Fig. 7C). The set is native mouse (MOUSE_GENE_SYMBOL). It is a
  model case of GO enrichment revealing mechanism: the perturbation is a single
  oxidoreductase with dozens of P450 clients (retinoic acid, arachidonic acid,
  sterol and xenobiotic metabolism), yet the response is almost entirely the
  sterol/isoprenoid pathway (Hmgcs1, Mvk, Mvd, Fdps, Idi1, Fdft1, Sqle, Lss, Cyp51,
  Msmo1, Nsdhl, Tm7sf2, Sc5d, Dhcr7) together with the SREBP-2 feedback machinery
  (Srebf2, Insig1, Ldlr, Stard4). This pinpoints the POR-dependent sterol enzymes
  (CYP51 lanosterol demethylase, and squalene epoxidase, which also takes electrons
  from POR) as the limiting step: loss of POR starves the cell of cholesterol and
  SREBP-2 up-regulates the whole pathway, the mechanism the authors propose for the
  Antley-Bixler-like limb phenotype. A small SREBP-1 lipogenic arm (Acly, Elovl6,
  Scd1) and the retinoic-acid-inducible Cyp26a1 (retinoic acid excess was measured)
  are also present.
