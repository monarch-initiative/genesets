description: 'Genome-wide CRISPR knockout ranking of human host factors for West Nile
  virus-induced death from Zhang et al. 2016 (GeCKOv2 in HEK293FT cells; PMID:27383988),
  scored by MAGeCK positive selection. The ranked counterpart of the Zhang half of
  LIT:FLAVIVIRUS_HOST_FACTORS. The signal is a few genes at the very top (STT3A, SEC63,
  OSTC, SPCS1, EMC6, SEC61B; SEL1L 9th), so only the weighted KS finds terms (six
  at q < 0.05), and the complexes the paper is about are too small for the default
  15-gene minimum: they were scored with --min-size 5 and stay nominal. The interpretation
  is ER translocation and signal-peptide processing of the viral polyprotein, with
  OST and EMC alongside.'
