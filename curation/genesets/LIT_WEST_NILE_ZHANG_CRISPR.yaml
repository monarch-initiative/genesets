  evidence:
  - reference: PMID:27383988
    reference_title: A CRISPR screen defines a signal peptide processing pathway required
      by flaviviruses.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a subset of endoplasmic reticulum-associated signal peptidase complex
      (SPCS) proteins was necessary for proper cleavage of the flavivirus structural
      proteins (prM and E) and secretion of viral particles.
    explanation: 'The Zhang et al. screen converges on the ER signal peptidase complex:
      SPCS1 and SPCS3 (two of the five SPCS components) were validated as required
      host factors, and loss of SPCS1 markedly reduced the yield of every Flaviviridae
      member tested (WNV, DENV, Zika, yellow fever, Japanese encephalitis, hepatitis
      C) while sparing al/bunya/rhabdoviruses. SPCS1 and SPCS3 are members of the
      set and carry the signal peptidase complex annotation (annotation_supported).
      Scored mechanistic because a virus-specific dependence on host signal-peptide
      cleavage of its structural proteins (prM/E) is a non-obvious processing requirement,
      not an expected consequence of "infection". Note SEC11A/SEC11C — the other SPCS
      components — were tested but had minimal effect, so they are deliberately not
      members.'
  curator_note: 'SEC63, SPCS1, SEC61B, SPCS3, SSR2, SSR3, SEC61G: translocon and signal
    peptidase, the route of the flavivirus polyprotein into the ER.'
