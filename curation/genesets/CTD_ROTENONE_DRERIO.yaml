description: >-
  The 213 zebrafish genes with CTD-curated interactions with rotenone (MeSH D012402;
  mygeneset.info D012402_7955; membership snapshot in
  curation/genesets/model_organism_members.gmt). Rotenone is a mitochondrial
  complex I inhibitor used to model Parkinson's disease. Much of the membership looks
  like protein-level changes from several profiled zebrafish tissues (judging by
  which genes are present; CTD does not label the assays), so it mixes mechanism
  with tissue abundance. The mechanistic core is complex I itself: ndufa2,
  ndufa6, ndufa9a, ndufa10, ndufa12, ndufa13, ndufb10, ndufs1, ndufv1, ndufv2, plus
  other respiratory and TCA enzymes (uqcrfs1, uqcrh, cox4i1, dlat, dlst, sucla2). The
  Parkinson's-relevant layer includes th (tyrosine hydroxylase), pink1, uchl1 and
  neurofilaments (nefla, neflb, nefma). The abundant tissue proteins come from eye
  lens (cryaa, crybb1l1, crygm2a/2b/4/6/7), ovary (zona pellucida zp2/zp3 genes,
  vitellogenins vtg3/4/7) and muscle (myoz, mybpc, tnnc), and are treated as
  nonspecific.
