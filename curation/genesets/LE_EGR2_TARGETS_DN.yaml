  - term:
      id: GO:0006695
      label: cholesterol biosynthetic process
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: broadly_expressed
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      The top enrichment of this set (zymosterol/cholesterol biosynthesis, 10/35;
      p ~2e-16 for cholesterol and ~2e-20 for zymosterol biosynthesis): Hmgcr, Hmgcs1, Mvd, Idi1, Fdps, Fdft1, Lss, Cyp51, Msmo1
      and Nsdhl are all directly annotated. Marked mechanistic because it is not
      entailed by "myelin gene" construction: it reveals that Egr2-dependent
      myelination runs through Schwann-cell cholesterol synthesis (myelin
      membrane is cholesterol-rich, and blood cholesterol cannot cross the
      blood-nerve barrier in sufficient quantity), i.e. the transcriptional
      mechanism linking the transcription factor to the membrane it builds.
  - term:
      id: GO:0006633
      label: fatty acid biosynthetic process
    aspect: biological_process
    category: supporting_process
    confidence: medium
    specificity: broadly_expressed
    seed_source: curator_added
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      The fatty-acid arm of the myelin lipid programme: Scd1, Elovl6, Fads1, Lpl,
      Sirt2 annotated (6/121 incl. Ptgds via closure). Further lipogenic genes in
      the set (Me1, Thrsp, Slc25a1 citrate carrier) supply NADPH/acetyl-CoA but are
      annotated to other terms. Below significance alone; it rides on the broader
      lipid biosynthetic process hit (24/547, p ~6e-18).
  - term:
      id: GO:0006682
      label: galactosylceramide biosynthetic process
    aspect: biological_process
    category: supporting_process
    confidence: high
    specificity: cell_type_specific
    seed_source: curator_added
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      Galactocerebroside and sulfatide are the signature myelin glycolipids. Ugt8a
      (ceramide galactosyltransferase) and Fa2h (fatty-acid 2-hydroxylase, which
      makes the 2-hydroxy ceramides preferred for myelin galactolipids) are both in
      the set and directly annotated; Cers2 (very-long-chain ceramide synthase) is
      also present. Only 2 annotated carriers in a 6-gene term, so it will rarely
      pass multiple-testing correction, but it is a specific mechanistic link from
      Egr2 to myelin lipid composition.
