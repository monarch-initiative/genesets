  label: Mus musculus
direction: DN
description: >-
  MSigDB mouse M2:CGP set (M15148) of 121 genes down-regulated in sciatic nerves
  of hypomorphic Egr2 (Krox20) Egr2Lo/Lo mice, a model of congenital hypomyelinating
  neuropathy (Le et al. 2005, PMID:15695336, Table 2S). Egr2 is the master
  transcription factor of peripheral myelination, so loss of the myelin structural
  genes (Mpz, Pmp22, Mbp, Prx, Mal, Gjb1, Ndrg1) is expected. The informative
  enrichment is the second, larger arm: the cholesterol/sterol biosynthetic pathway
  (Hmgcr, Hmgcs1, Mvd, Idi1, Fdps, Fdft1, Lss, Cyp51, Msmo1, Nsdhl) plus
  fatty-acid and galactolipid synthesis (Scd1, Elovl6, Fads1, Me1, Thrsp, Slc25a1;
  Ugt8a, Fa2h, Cers2). GO enrichment thus exposes the mechanism by which Egr2
  drives myelination: it is required for the lipid biosynthetic programme that
  builds the myelin membrane, which is ~70-80% lipid and cholesterol-rich. The set
  also carries Schwann-cell markers (S100b) and some stromal/endoneurial genes.
