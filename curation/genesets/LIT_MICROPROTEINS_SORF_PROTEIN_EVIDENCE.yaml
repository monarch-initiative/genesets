description: >-
  Human microproteins encoded by small open reading frames (sORFs) that UniProt
  supports at the protein level. Membership comes from the ai-gene-review
  MICROPROTEINS census (projects/MICROPROTEINS/data/human_microproteins.tsv,
  ai4curation/ai-gene-review, census of 2026-09-30, produced by
  projects/MICROPROTEINS/scripts/microprotein_census.py from UniProt REST). It is
  the census class "sORF-class microprotein, protein-level evidence": Swiss-Prot
  human entries of 100 aa or less, protein existence level 1, that a rule-based
  classifier assigned to the sORF class (peptides from lncRNAs, upstream ORFs,
  alternative frames and short uncharacterized ORFs such as the SMIM series),
  as opposed to long-known short proteins (OXPHOS subunits, ribosomal proteins,
  hormones, metallothioneins, keratin-associated proteins). The class has 69
  entries. Five were dropped from this gene-symbol set. SHMOOSE (C0HM83) has no
  gene symbol. Four alternative-ORF peptides are filed by UniProt and GOA under
  their host gene's symbol: DDIT3 (P0DPQ6), MIEF1 (L0R8F8, AltMIEF1), PRKCH
  (C0HM02) and ZNF689 (C0HLU2). In a symbol-keyed analysis they would
  bring in the host protein's annotations, which have nothing to do with the
  peptide. 47 of the 64 symbols carry at least one GOA annotation on a UniProtKB
  protein; the other 17 have none. This is a gene CLASS defined by how the genes were found
  (short ORFs that genome annotation missed), not by a shared biology, so it is
  a test of whether GO enrichment finds convergence in a heterogeneous set and
  of how far GO coverage of these proteins lags the literature. The literature
  shows recurring themes rather than one program. The best-studied theme is the
  regulins, single-pass transmembrane micropeptides that bind the SERCA calcium
  pump and change its activity (myoregulin MRLN, endoregulin ERLN, DWORF
  STRIT1, TUNAR). A second is mitochondrial membrane proteins and assembly
  factors (MTLN, PIGBOS1, SMIM26, MICOS10, MLDHR, CEBPZOS). Others act in
  myoblast fusion (MYMX), mRNA decapping (NBDY) or lysosomal mTORC1 signalling
  (SPAAR). Most of the set is membrane-embedded, and many members carry only an
  IEA membrane term from a predicted helix. Enrichment of the full membership
  against human GOA (UniProtKB background, 2026-07-26 GO release, GOA current
  on 2026-11-26) finds no term significant after Bonferroni correction under the
  all, IBA-only or IBA+IEA variants. The strongest nominal hit is regulation of
  calcium ion import into sarcoplasmic reticulum (MRLN, STRIT1; p = 5.7e-5).
  So the core biology here is curator-asserted and mostly NOT recovered.
  The SERCA-regulation term is an annotation gap: of the four regulins only STRIT1 carries it in GOA,
  although MRLN, ERLN and TUNAR have direct evidence. A caveat on membership:
  protein-level evidence in UniProt is not proof of a functional gene. Ribo-seq
  and peptide evidence for sORFs that overlap a host gene can come from
  alternative isoforms of the host (Ji and Salzberg, PMID:39565752), although
  the members here are mostly lncRNA-derived or stand-alone loci with HGNC
  symbols. The putative pole of the series is LIT:MICROPROTEINS_SORF_PUTATIVE.
