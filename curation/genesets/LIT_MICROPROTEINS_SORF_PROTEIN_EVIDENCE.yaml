  evidence:
  - reference: PMID:27923914
    reference_title: Widespread control of calcium signaling by a family of SERCA-inhibiting
      micropeptides.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: function as direct inhibitors of SERCA pump activity
    explanation: >-
      Endoregulin (ERLN) and another-regulin are shown to inhibit SERCA directly,
      extending the muscle regulins (myoregulin, phospholamban, sarcolipin) to
      non-muscle cells.
  curator_note: >-
    The regulin theme: MRLN, ERLN, STRIT1 and TUNAR are all members, and each
    binds SERCA and changes its pumping (MRLN and ERLN inhibit, STRIT1/DWORF
    activates by displacing the inhibitors, TUNAR's sign depends on cell type).
    Four of 64 is a theme, not the set's identity, so confidence is medium. In
    current GOA only STRIT1 is annotated to this term or a descendant; MRLN
    carries the narrower SR-import term GO:1902080 instead, and ERLN and TUNAR
    have no SERCA-regulation term at all. The ai-gene-review reviews of these
    genes propose the missing rows (ERLN: negative regulation of
    ATPase-coupled calcium transmembrane transporter activity, GO:1901895), so
    a review-informed annotation variant should recover this term where GOA
    does not. Insight is confirmatory because the regulins are the textbook
    exemplars of sORF microproteins.
