gene_set_name: YEAST_CADMIUM_SENSITIVE_RUOTOLO
collection: LIT:GENETIC
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
direction: DN
description: >-
  The 303 Saccharomyces cerevisiae deletion strains with decreased cadmium tolerance
  (40 uM Cd2+) in the genome-wide metal phenotyping study of Ruotolo et al. (2008,
  PMID:18394190). Membership is the set of null mutants SGD curated from this paper
  as "metal resistance: decreased" with cadmium(2+) (snapshot in
  curation/genesets/model_organism_members.gmt). GO enrichment recovers the
  detoxification route. Cadmium is chelated by glutathione (GSH1, GSH2, induced via
  YAP1) and pumped into the vacuole as a glutathione conjugate by the ABC
  transporter YCF1. Sequestration needs an acidified vacuole, and the set contains
  12 of the V-ATPase subunits plus VPH2, VMA22 and NHX1. A second, larger block is
  ESCRT and retromer, which the authors show affects metal tolerance through
  transporter downregulation and protein traffic. These same deletions make cells
  cadmium-sensitive but nickel-resistant (see YEAST_NICKEL_RESISTANT_RUOTOLO).
