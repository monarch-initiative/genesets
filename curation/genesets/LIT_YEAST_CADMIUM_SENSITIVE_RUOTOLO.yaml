    curator_note: >-
      YCF1 (yeast cadmium factor), the vacuolar ABC transporter that imports
      bis(glutathionato)cadmium, directly annotated (1/2). Also reaches cadmium ion
      transport via closure. The single most cadmium-specific gene in the set,
