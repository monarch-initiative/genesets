        snippet: "Although the vacuole emerged as a major hot spot for metal detoxification"
        explanation: >-
          The authors identify the vacuole as the main detoxification compartment.
    curator_note: >-
      19/30, p ~2e-19: 12 V-ATPase subunits (VMA1-VMA11, VMA13) plus VPH2, VMA22,
      NHX1, PFK2, DBF2, VPS3, VPS45, all directly annotated. Vacuolar acidification
      drives sequestration of Cd-glutathione conjugates, so it is core here.
      Confirmatory rather than mechanistic: V-ATPase mutants are also
      hypersensitive to many unrelated drugs (see the DTT set), so this hit alone
      does not distinguish cadmium.
  - term:
      id: GO:0006750
      label: glutathione biosynthetic process
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: ubiquitous
    seed_source: curator_added
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      GSH1 (gamma-glutamylcysteine synthetase) and GSH2 (glutathione synthetase), the
      entire biosynthetic pathway, are in the set and directly annotated (2/3).
      Together with YCF1 and the transcription factor YAP1, also present, they
      form the cadmium-specific detoxification route: chelation by glutathione,
      then vacuolar import. Two genes cannot survive genome-wide correction, so the
      cadmium-specific mechanism is invisible to set enrichment.
