  score_description: '-log10 of the MAGMA gene-based p-value (snp-wise mean model,
    1 kb windows, protein-coding genes; one-sided). Built by `curate build-ranking`
    from rankings/IBD_GWAS_MAGMA.recipe.yaml: of 19,094 atlas rows, 257 mapped by
    their approved symbol after their Ensembl v92 id failed, 876 have no approved
    HGNC symbol, and 65 duplicate symbols kept the stronger score; 18,153 genes ranked.
    Scored on -log10 p rather than ZSTAT because the KS running sum weights by |score|,
    which would treat strongly negative Z as signal.'
description: 'Genome-wide MAGMA gene ranking for inflammatory bowel disease from the
  de Lange et al. 2017 European-ancestry GWAS meta-analysis (25,042 cases, 34,915
  controls; PMID:28067908), as computed by the GWAS ATLAS. The scored counterpart
  of LIT:IBD_RISK_GENES (anchored on Jostins et al. 2012). The ranking is led by IL23R,
  NOD2 and CARD9, and is polygenic enough that both statistics find many terms (KS
  30, Wilcoxon 332 at q < 0.05): the IL-23/Th17 axis, NOD2-CARD9 innate sensing, MHC
  class II, and broad leukocyte activation and adhesion. Two results sit below FDR
  significance and are kept as curator-added CORE terms. Autophagy is flat as a term
  (Wilcoxon q = 0.82) although ATG16L1 ranks 7th and IRGM 106th: the 242-gene term
  dilutes them. The integrin signalling that de Lange et al. highlight has ITGAL,
  ITGA4 and ITGB8 at the head of its leading edge but q = 0.15. MAGMA gene p-values
  of neighbouring genes share SNPs and LD, and the gene-set tests here do not model
  that correlation, so a term carried by one locus is one finding, not many.'
