    aspect: molecular_function
    category: supporting_process
    confidence: medium
    specificity: broadly_expressed
    seed_source: curator_added
    recovery_status: annotation_gap
    insight: mechanistic
    curator_note: >-
      The regulatory mechanism behind the induction. Hr96 (PXR/CAR orthologue,
      directly annotated here, 1/23) mediates phenobarbital-responsive transcription,
      and the CncC (cnc)/Keap1 module, the fly Nrf2/Keap1 system, controls
      inducible detoxification genes. cnc and Keap1 are not annotated to any
      xenobiotic-response process, so the regulatory layer cannot be recovered. A
      gap for the regulators rather than this term, which is correctly annotated
      for Hr96. Medium confidence because CTD does not say which regulators were
      tested with phenobarbital directly.
