description: >-
  The 25 Drosophila melanogaster genes with CTD-curated interactions with
  phenobarbital (MeSH D010634; mygeneset.info D010634_7227; membership snapshot in
  curation/genesets/model_organism_members.gmt). Phenobarbital is the classic inducer
  of xenobiotic-metabolising enzymes. In flies it induces cytochrome P450s, glutathione
  S-transferases and UDP-glycosyltransferases, and this literature also mapped how
  that induction is controlled. The set contains both outputs and regulators.
  Outputs: Cyp6a2, Cyp6a8, Cyp6d5, Cyp6w1, Cyp12d1-d, Cyp4d14, eleven Gst genes
  (GstD1/2/4/6/7/9, GstE3/6/7/9, GstS1), Ugt35C1, Jheh1/2. Regulators: cnc (CncC, the
  Nrf2 orthologue), its repressor Keap1, and Hr96, the nuclear receptor orthologous to
  PXR/CAR. GO enrichment recovers the GST arm strongly. The P450 arm and the
  CncC/Keap1/Hr96 regulators are largely missing from xenobiotic-response
  annotation.
