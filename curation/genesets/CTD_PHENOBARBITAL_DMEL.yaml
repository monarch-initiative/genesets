    curator_note: >-
      The set's defining process. Only Cyp6a8 and Cyp6w1 reach it, via closure (2/21).
      Cyp6a2, Cyp6d5, Cyp12d1-d and Cyp4d14, the phenobarbital-inducible P450s, are
      in the set but not annotated to xenobiotic response or metabolism in FlyBase
