  evidence:
  - reference: PMID:33147444
    reference_title: Genome-wide CRISPR Screens Reveal Host Factors Critical for SARS-CoV-2
      Infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We additionally discovered pro-viral genes and pathways, including HMGB1
      and the SWI/SNF chromatin remodeling complex, that are SARS lineage and pan-coronavirus
      specific, respectively.
    explanation: The companion Wei et al. screen identified the SWI/SNF (BAF) chromatin-remodeling
      complex (e.g. SMARCA4, ARID1A, SMARCB1) as pro-viral host factors required for
      infection; the paper attributes this to SWI/SNF being needed to maintain expression
      of the ACE2 receptor. The SWI/SNF subunit genes are members of the set and carry
      the chromatin-remodeling annotation (annotation_supported). A nuclear epigenetic-remodeling
      dependency is highly non-obvious for a cytoplasmic RNA virus, so it is scored
      mechanistic; supporting rather than core because it acts upstream, by gating
      receptor expression, rather than in the entry/trafficking machinery itself.
  curator_note: 'SMARCA4, DPF2, ARID1A, SMARCE1, SMARCB1, SMARCC1, BRD9: the BAF complex
    across its core and accessory subunits (q = 6e-8).'
