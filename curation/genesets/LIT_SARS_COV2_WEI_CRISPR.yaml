    genes ranked.'
description: 'Genome-wide CRISPR knockout ranking of host factors for SARS-CoV-2 from
  Wei et al. 2021 (African green monkey Vero-E6 cells; PMID:33147444), as signed gene
  z-scores. The ranked counterpart of the Wei half of LIT:SARS_COV2_HOST_FACTORS.
  ACE2, SMARCA4, DYRK1A and KDM6A head the ranking, and the interpretation is the
  paper''s: a proviral SWI/SNF chromatin-remodelling program. HMGB1, the paper''s
  other headline factor, is absent from this genome-wide table (it came from the secondary
  screen). The negative pole is cell fitness. Survival and proliferation screens carry
  a generic fitness signal: knockouts of essential genes drop out whatever the selection,
  and knockouts of growth suppressors gain. Genes not expressed in the screened cells
  escape that fitness cost, so whole-term tests over the full ranking shift tissue-restricted
  gene families (olfactory receptors, circulatory genes) without any biology of the
  selection. Both show here, and are recorded as nonspecific or false associations.'
