  evidence:
  - reference: PMID:27383987
    reference_title: Genetic dissection of Flaviviridae host factors through genome-scale
      CRISPR screens.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Strikingly, in both the haploid and CRISPR screens, the most significantly
      enriched genes were subunits of the OST complex, an enzyme essential for N-linked
      glycosylation
    explanation: 'The oligosaccharyltransferase (OST) complex is the single most significantly
      enriched cluster of host-dependency hits in both the haploid and CRISPR DENV
      screens. Its subunits — STT3A, STT3B, MAGT1 (the highest-scoring CRISPR hit),
      RPN1, RPN2 and OSTC — are members of the set and carry the OST complex annotation
      directly, so enrichment recovers it (annotation_supported). It is scored mechanistic,
      not confirmatory: a flavivirus depending on the ER N-glycosylation enzyme complex
      is non-obvious, and Marceau et al. further show the dependence is on a non-canonical,
      catalysis-independent role of OST at the viral RNA-replication complex (NS proteins
      bind OST), not on glycosylation per se — a genuine mechanistic discovery rather
      than anything entailed by the set''s "infection" framing.'
  curator_note: 9 of 13 subunits in the leading edge (MAGT1, STT3B, RPN2, STT3A, OSTC,
    OST4, DDOST); q < 0.001 with --min-size 5.
