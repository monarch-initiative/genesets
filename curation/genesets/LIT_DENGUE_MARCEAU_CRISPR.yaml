    symbol win over previous or alias names); 20,483 genes ranked.'
description: 'Genome-wide CRISPR knockout ranking of human host factors for dengue
  virus from Marceau et al. 2016 (Huh7.5.1 cells, three replicates, RIGER; PMID:27383987).
  The ranked counterpart of the Marceau half of LIT:FLAVIVIRUS_HOST_FACTORS. MAGT1,
  STT3B, SSR2, RPN2 and STT3A head the ranking: the oligosaccharyltransferase, with
  the ER membrane complex and translocon close behind, all significant once small
  complexes are scored (--min-size 5). The signal peptidase, required for West Nile
  virus in Zhang et al., is flat here (SPCS1 ranks about 1,800th), the published contrast
  between the two screens. Wilcoxon over the whole ranking is led by two artefacts,
  recorded as false associations. Clustered genes that share exons (PCDHA, UGT1A)
  are hit by the same guides and score together. And genes not expressed in the screened
  cells escape that fitness cost, so whole-term tests over the full ranking shift
  tissue-restricted gene families (olfactory receptors, circulatory genes) without
  any biology of the selection.'
