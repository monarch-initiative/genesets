description: >-
  Literature-defined evolutionary-convergence panel: the embryonic-side genes
  the authors highlight in Fig. 6D of Safian, Kraunsoe et al. (bioRxiv 2026,
  doi:10.64898/2026.11.11.765921; no PMID yet) as carrying two or more kinds of
  placentation-associated molecular change in the yolk sac cell: differential
  expression, positive selection, placental-specific parallel substitution, or
  marker status across P. bifurca, P. prolifica, P. turneri and H. formosa. A
  single yolk sac cell type forms the embryonic side of the placenta in all five
  independent poeciliid placenta origins. Unlike the maternal LFC, it changed
  little in expression (58-85 DEGs per species) but is enriched for recently
  duplicated, poeciliid-specific genes, which the 1:1-ortholog analyses behind
  this panel cannot see. MEMBERSHIP CAPTURE: 21 labels transcribed from the
  figure, grouped there as immune regulation, cytoskeleton organization,
  metabolic regulation, vesicle, transcription regulation and signalling, and
  transporters/channels. "slc29a" is read as slc29a1a, as on the maternal side.
  Mapping to human by scripts/capture_poeciliid_placenta_sets.py: 14 by ZFIN
  orthology and 5 by upper-cased zebrafish symbol, giving 19 HGNC symbols.
  irfg3 (no ZFIN human ortholog) and g1066 (unnamed) are dropped. Eleven of the 19
  are shared with the maternal panel (LIT:POECILIID_PLACENTATION_LFC_GENES): the
  transporters SLC29A1, SLC1A3, PIEZO2, SLC26A6 and XKRX, the tetraspanins CD63
  and CD9, and RHOC, FUT9, TNFRSF9 and VRK2. The paper's point is that both
  halves of the placenta changed the same kinds of genes. The two poles of this
  series therefore contrast mainly in what each lacks: the maternal panel's
  steroid-receptor, lipid-enzyme and basolateral arm is absent here, and this
  panel adds the amino-acid exchanger SLC3A2, SLC24A1, NOS1, HSD11B2, ESYT2,
  TBX3, MACROD2 and ALCAM.
  SEED_SOURCE SEMANTICS: `enrichment_recovered` means genesets-rs (Fisher,
  Bonferroni < 0.05, GOA background) recovered the term for this membership;
  `curator_added` means it did not.
