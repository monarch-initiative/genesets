associations:
  - term:
      id: GO:0055085
      label: transmembrane transport
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: lineage_shared
    seed_source: curator_added
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      The defining function of an absorptive yolk sac taking up maternally
      supplied nutrients, and the panel's largest group: SLC29A1 (nucleosides),
      SLC3A2 and SLC1A3 (amino acids), SLC24A1 and SLC26A6 (ions), PIEZO2 and
      XKRX. Six of 19 carry the annotation (raw p 4e-5). With 19 genes and
      several thousand GO tests this misses Bonferroni, hence curator_added
      with annotation_supported: carriers present and annotated, power lacking.
      Confirmatory: transport is what a nutrient-uptake epithelium is expected
      to do.
  - term:
      id: GO:0005886
      label: plasma membrane
    aspect: cellular_component
    category: core_component
    confidence: high
    specificity: broadly_expressed
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      14 of 19 members (Bonferroni 3e-3): ALCAM, CD63, CD9, ESYT2, NOS1, PIEZO2,
      RHOC, SLC1A3, SLC24A1, SLC26A6, SLC29A1, SLC3A2, TNFRSF9 and XKRX. Broad,
      but it is the panel's correct component: an epithelial surface panel.
      Confirmatory.
  - term:
      id: GO:0006865
      label: amino acid transport
    aspect: biological_process
    category: supporting_process
    confidence: medium
    specificity: lineage_shared
    seed_source: curator_added
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      SLC3A2 (the heavy chain of the LAT1/LAT2 system L exchangers) and SLC1A3
      (an excitatory amino-acid transporter) carry it (raw p 2e-3). SLC3A2 is
      present only on this, embryonic, side of Fig. 6D and is the classic
      mammalian placental amino-acid transporter subunit. Its recurrence in fish
      placentas is the kind of specific, non-entailed convergence the series is
      meant to test. Mechanistic, supporting, medium confidence (two genes).
  - term:
      id: GO:0003013
      label: circulatory system process
    aspect: biological_process
    category: marker_driven_plausible
    confidence: low
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    curator_note: >-
      The only process term recovered (6 of 19, Bonferroni 6e-3): HSD11B2, NOS1,
      PIEZO2, SLC1A3, SLC29A1 and SLC3A2. Plausible in that the yolk sac
      membrane is densely vascularized (Fig. 1D), but the carriers are
      annotated through mammalian vascular-tone and renal physiology (NOS1,
      HSD11B2 and PIEZO2 baroreception), not through yolk sac circulation. The
      term is driven by a few multi-annotated markers rather than describing
      the set.
