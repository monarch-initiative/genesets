  label: Saccharomyces cerevisiae S288C
direction: UP
description: >-
  The 71 Saccharomyces cerevisiae deletion strains with increased nickel tolerance
  (3.5 mM Ni2+) in the genome-wide metal phenotyping study of Ruotolo et al. (2008,
  PMID:18394190). Membership is the set of null mutants SGD curated from this paper
  as "metal resistance: increased" with nickel(2+) (snapshot in
  curation/genesets/model_organism_members.gmt). A compact, highly coherent set:
  nearly the whole ESCRT machinery (16 of 18 annotated subunits) plus the MVB
  sorting pathway and retromer. The authors' interpretation is that these deletions,
  by affecting transporter downregulation and protein traffic, protect against
  nickel while sensitising to cadmium (see YEAST_CADMIUM_SENSITIVE_RUOTOLO). Gain of
  resistance from loss of a trafficking machine is a mechanistic signal that GO
  enrichment surfaces almost perfectly. No yeast gene is annotated to any
  nickel-response GO term.
