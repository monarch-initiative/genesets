    insight: mechanistic
    curator_note: >-
      The Parkinson's-model arm: ple (tyrosine hydroxylase), Pu (GTP
      cyclohydrolase, which makes the TH cofactor) and Catsup (negative regulator of
      TH and GTP cyclohydrolase) set dopamine levels, which modulate dopaminergic
      neuron vulnerability to paraquat. Only ple and DJ-1alpha are annotated to
      this term (2/12). Pu and Catsup reach it only through regulation or cofactor
      terms outside the is_a/part_of closure, so enrichment under-recovers the
      module: an annotation gap.
