      label: JNK cascade
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: broadly_expressed
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      Gadd45, Mekk1, bsk, hep and puc are directly annotated (5/20, p ~7e-9), and the TNF
      ligand egr upstream is also present. JNK signalling is the fly's main
      inducible defence against oxidative stress: hep gain-of-function and puc
      heterozygosity extend lifespan and paraquat survival. Mechanistic because it
      names a specific signalling route rather than a generic stress category.
