description: >-
  The 50 Drosophila melanogaster genes with CTD-curated interactions with paraquat
  (MeSH D010269; mygeneset.info D010269_7227; membership snapshot in
  curation/genesets/model_organism_members.gmt). Mostly genes whose mutation or
  overexpression alters paraquat survival, plus some paraquat-induced genes
  (undirected). In flies paraquat serves both as an oxidative-stress and longevity
  assay and as a chemical model of Parkinson's disease. GO enrichment
  separates these. Detoxification: Sod1, Sod2, Cat, Prx2, Prx3, GstD1, GstD3,
  GstE6/7/9. A stress-signalling mechanism: the JNK pathway (egr, Mekk1, hep, bsk,
  puc, Gadd45), whose activation confers oxidative-stress tolerance and longevity.
  Insulin/FOXO (InR, Pi3K92E, foxo, mth). A dopaminergic Parkinson's module:
  dopamine synthesis (ple/TH, Pu/GTP cyclohydrolase, Catsup) and the Parkinson's
  genes park, DJ-1alpha and dj-1beta.
