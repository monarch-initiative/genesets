description: >-
  Literature-defined genetic-perturbation signature: the genes UPregulated in
  primary human pancreatic ALPHA cells after knockdown of RFX6, from Coykendall,
  Qian, Tellez et al. (Diabetes 2024, PMID:38064570, Supplementary Table S3).
  GIPZ lentiviral shRNA against RFX6 or scramble control in dispersed primary
  human islet cells, alpha cells purified by CD26+ GFP+ FACS from four
  independent donors, bulk RNA-seq, DESeq2 at P-adjusted < 0.1: 915 DEGs of
  which 357 are up. This file is the UP arm; its pole is
  LIT:RFX6_KNOCKDOWN_ALPHA_CELL_DN. Membership was captured from the published
  Supplementary Table S3 PDF; the parsed count (357) reproduces the paper's
  stated number exactly, every fold change is positive and the maximum
  P-adjusted is 0.0995. Twenty-two symbols were updated to current HGNC symbols
  (DDX58 -> RIGI, WARS -> WARS1, HIST1H2AC -> H2AC6, SEPW1 -> SELENOW among
  them). Three identifiers could not be resolved and are retained verbatim
  (RP11.724O16, AC084219.2, RP11.691N7.6); these are clone-based names whose
  hyphens the published PDF renders as periods, and they carry no GO annotation.
  INTERPRETATION: where the DN arm is the alpha cell
  losing its identity and secretory machinery, this arm is what rises in its
  place, and it is dominated by a single coherent module the paper mentions only
  in passing as "stress responses" — the type I interferon / antiviral program.
  MX1, IFIT1, IFIT2, IFIT3, IFIH1, IFI6, ISG15, STAT1, IRF7 and RIGI (DDX58) are all
  members, together with the interferon-inducible antigen-processing machinery
  (TAP1, PSMB8, PSMB9), alongside a genuine stress and growth-arrest arm
  (CDKN1A, GADD45G, SOD2, ATF3, DDIT3, TRIB3, HIF1A, DDR1) and the two
  proliferation genes the authors name (ABCG1, TRIB3). INTERPRETIVE CAVEAT,
  recorded rather than resolved: an interferon-stimulated-gene signature in a
  lentivirally transduced primary cell always invites the question of whether it
  reflects the perturbation or the vector. The comparison here is shRNA versus
  scramble control, and both arms are transduced, so a pure transduction artefact
  should cancel; but knockdown-specific differences in viral load, in
  RNAi-triggered innate sensing, or simply the generic innate-stress response of
  a cell losing a lineage transcription factor are all live alternatives to a
  direct RFX6-dependent mechanism. The interferon terms below are therefore
  scored as real for the SET while the note is explicit that they are not
  established as direct RFX6 biology. SEED_SOURCE SEMANTICS: no genesets-rs run
  seeded this file; `enrichment_recovered` means the term corresponds to a GO
  category the authors report as significantly upregulated (Fig. 4F),
  `curator_added` means it does not.
