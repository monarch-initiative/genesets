direction: NA
description: >-
  The 34 zebrafish genes with CTD-curated interactions with bisphenol A (BPA; MeSH
  C006780; mygeneset.info C006780_7955; membership snapshot in
  curation/genesets/model_organism_members.gmt). BPA is an endocrine disruptor, and GO
  enrichment identifies its mechanism directly. The set contains the estrogen
  receptors (esr1, esr2a, esr2b, gper1), the estrogen-responsive biomarker vtg1, and
  both aromatase genes (cyp19a1a gonadal, cyp19a1b brain). It also has the thyroid
  hormone receptors (thraa, thrb), the second axis BPA disrupts, and the androgen
  and gonadotropin side (lhcgr, inhbab). The rest is oxidative-stress and
  conjugation enzymes (cat, gpx1b, gsr, sult1st2, ugt1b1, ugt1b3) and kinases
  (mapk1, mapk3, mapk14a).
