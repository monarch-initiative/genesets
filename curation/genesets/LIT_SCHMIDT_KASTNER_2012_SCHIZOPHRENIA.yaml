n_genes: 77
description: 'Schizophrenia candidate genes compiled from the association literature
  by Schmidt-Kastner et al. (2012 Mol Psychiatry, PMID:22290124; 77 genes as used
  by Ballouz et al.). A pre-GWAS candidate-gene list: many members (COMT, DISC1, DTNBP1,
  NRG1, BDNF, AKT1) were chosen for prior biological hypotheses and several are no
  longer considered robustly associated, so the list is biased toward well-studied,
  heavily annotated genes. Ballouz, Pavlidis and Gillis (2017, PMID:28204549) found
  enrichment related to stress and inflammation, and no significant terms at all after
  multifunctionality correction, with synaptic transmission at the top of the corrected
  ranking. Synaptic labels here are therefore medium or low confidence.'
