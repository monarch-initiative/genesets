    which would treat strongly negative Z as signal.'
description: 'Genome-wide MAGMA gene ranking for Alzheimer''s disease from the Jansen
  et al. 2019 GWAS of clinically diagnosed and UK Biobank proxy AD (71,880 cases,
  383,378 controls; PMID:30617256), as computed by the GWAS ATLAS. It is the scored
  counterpart of LIT:ALZHEIMERS_GWAS_GENES, whose membership comes from the later
  Bellenguez et al. 2022 GWAS; no genome-wide gene table of Bellenguez is publicly
  available, so the two entries describe overlapping but not identical studies. The
  APOE locus dominates: NECTIN2, TOMM40 and APOE are the top three genes and one signal.
  GSEA''s weighted KS reaches no term at FDR q < 0.05 (unweighted KS reaches 14: weighting
  by -log10 p lets the APOE locus swamp the running sum); Wilcoxon reaches seven,
  all carried by a few loci. The interpretation is amyloid handling (APOE, CLU, PICALM,
  SORL1, APP, PSEN1, TREM2) with a smaller immune component. Microglial activation
  and APP catabolism, CORE in the gene-set entry, are kept as curator-added CORE terms:
  their genes rank high (TREM2, ABCA7, ADAM10, BACE1, PSEN1) but the whole-term tests
  stop at nominal significance. MAGMA gene p-values of neighbouring genes share SNPs
  and LD, and the gene-set tests here do not model that correlation, so a term carried
  by one locus is one finding, not many.'
