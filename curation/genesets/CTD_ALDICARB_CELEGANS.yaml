  label: Caenorhabditis elegans
direction: NA
description: >-
  The 198 C. elegans genes with literature-curated chemical-gene interactions with
  aldicarb in the Comparative Toxicogenomics Database (CTD; served by
  mygeneset.info as D000448_6239, "Chemical-gene interactions of Aldicarb in
  worm"; membership snapshot in curation/genesets/model_organism_members.gmt).
  Aldicarb is a carbamate acetylcholinesterase inhibitor. In C. elegans, the time
  it takes to paralyse the animal is the standard assay of cholinergic release at
  the neuromuscular junction: mutants resistant to aldicarb (Ric) release less
  acetylcholine, hypersensitive mutants (Hic) release more. CTD records most of
  these genes as altering the response to aldicarb, often from large RNAi
  screens for synaptic genes, so the set mixes both directions and is undirected.
  It is the canonical case where GO enrichment of a behavioural-pharmacology gene
  list recovers mechanism. The core is the presynaptic release machinery (unc-13,
  unc-18, unc-10/RIM, unc-64/syntaxin, snb-1/synaptobrevin, snt-1/synaptotagmin,
  rab-3, aex-3, unc-2/CaV2, unc-17/VAChT, cho-1). Beyond that it resolves
  modulatory layers: Gq/Go signalling that sets release probability (egl-30, egl-8,
  dgk-1, goa-1, egl-10, gsa-1, acy-1, ric-8, pkc-1); dense-core-vesicle neuropeptide
  release (unc-31/CAPS, egl-3, egl-21, sbt-1, ida-1, flp-1, nlp-12); and on the
  muscle side the dystrophin complex (dys-1, dyb-1, stn-1), whose loss causes
  aldicarb hypersensitivity.
