    aspect: biological_process
    category: supporting_process
    confidence: high
    specificity: broadly_expressed
    seed_source: curator_added
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      The Gq (egl-30 -> egl-8/PLCbeta -> DAG -> unc-13) versus Go (goa-1, opposed by
      dgk-1 and the RGS egl-10) network that sets acetylcholine release is a
      classic mechanistic product of aldicarb genetics. 15/198 annotated (egl-10,
      fshr-1, gar-1, goa-1, gsa-1, ric-8, ser-7 direct; acy-1, dgk-1, egl-30, egl-8,
      flp-1, nlp-12, pkc-1, sbt-1 via closure). Against a 662-gene term the
      enrichment is modest; the mechanism lives in the specific Gq/Go genes.
