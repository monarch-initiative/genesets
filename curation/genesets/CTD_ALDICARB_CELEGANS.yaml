  - term:
      id: GO:0007218
      label: neuropeptide signaling pathway
    aspect: biological_process
    category: supporting_process
    confidence: medium
    specificity: lineage_shared
    seed_source: curator_added
    recovery_status: annotation_gap
    insight: mechanistic
    curator_note: >-
      A non-obvious layer: neuropeptides released from dense-core vesicles
      potentiate cholinergic release, so DCV-pathway mutants are aldicarb resistant.
      The set has the DCV release and processing machinery (unc-31/CAPS, egl-3/PC2,
      egl-21/carboxypeptidase E, sbt-1/7B2, ida-1/IA-2) and peptides flp-1 and
      nlp-12, but only flp-1, nlp-12, pkc-1 and sbt-1 are annotated to this term
      (4/80). egl-3 and egl-21 are annotated to peptide processing and
      presynaptic terms, unc-31 and ida-1 to vesicle exocytosis, so the
      neuropeptide pathway is under-recovered: an annotation gap.
