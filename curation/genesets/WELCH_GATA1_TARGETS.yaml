  label: Mus musculus
direction: UP
description: >-
  MSigDB mouse M2:CGP set (M1407) of 29 genes induced when GATA-1 activity is
  restored in G1E-ER4 cells, a GATA-1-null erythroblast line that then matures
  synchronously (Welch et al. 2004, PMID:15297311, Fig. 2). The set is the erythroid
  maturation programme GATA-1 drives. It includes nearly the whole heme biosynthetic
  pathway (Alas2, Alad, Hmbs, Uros, Urod, Ppox, plus the mitochondrial transporter
  Abcb10) and globins (Hba-a1, Hba-x, Hbb-y). It also has the red-cell membrane
  skeleton (Ank1, Slc4a1, Gypa, Dmtn, Stom) and iron uptake/storage (Tfrc, Ftl1).
  Its regulators are Klf1, the GATA-1 cofactor Zfpm1/Fog1, and the heme-responsive
  Nfe2-Maf/Bach1 axis (Nfe2, Mafk, Mafg, Bach1). Largely confirmatory. The
  heme-sensing Bach1/Maf/Nfe2 module is the mechanistic layer: it couples globin
  transcription to heme supply.
