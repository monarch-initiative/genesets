      annotation, so enrichment recovers it (annotation_supported). Scored confirmatory
      because identifying the TCR pathway as required for a TCR-stimulation proliferation
      screen recapitulates the assay design rather than revealing new mechanism.
  curator_note: 'DN: ZAP70, BCL10, IKBKG, TRAF6 and RNF31 (CBM-NF-kB) lead; LCP2,
