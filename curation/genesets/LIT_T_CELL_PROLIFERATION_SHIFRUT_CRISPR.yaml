    snippet: essential T cell receptor signaling components
    explanation: The negatively-selected ("positive regulator") arm of the set is
      the canonical TCR-proximal signaling machinery — CD3D, CD3E, CD247, LCK, ZAP70,
      LCP2, VAV1, RHOH, LAT, PLCG1, PRKCQ, CARD11 — whose knockout impairs stimulation-dependent
