  curator_note: 'UP: ELOB (the paper''s TCEB2), RNF7, ARIH2, CUL5 and SOCS2. A Cullin-5
    E3 ligase module whose loss boosts T cell proliferation, one of the screen''s
    non-obvious brakes.'
