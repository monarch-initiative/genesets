description: 'Genome-wide CRISPR knockout ranking of regulators of primary human T
  cell proliferation after TCR stimulation, from Shifrut et al. 2018 (SLICE; PMID:30449619),
  as signed MAGeCK log fold changes. The ranked counterpart of LIT:T_CELL_FUNCTION_REGULATORS.
  Both poles are biology here. The positive pole is the brakes: CBLB, SOCS1, RASA2,
  UBASH3A, ELOB (TCEB2) and CD5 rank in the top 15, and the Cullin-5 ligase module
  they partly form is significant. The negative pole is TCR signalling (LCP2, VAV1
  and CD247 rank last; ZAP70 is in the bottom 4%) on top of the fitness signal of
  essential genes. Negative regulation of T cell activation, CORE in the gene-set
  entry, is not significant as a term although CBLB and SOCS1 head the ranking: the
  120-gene term mostly holds genes with no effect. Survival and proliferation screens
  carry a generic fitness signal: knockouts of essential genes drop out whatever the
  selection, and knockouts of growth suppressors gain.'
