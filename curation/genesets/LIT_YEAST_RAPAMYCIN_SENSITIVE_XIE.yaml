    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      TOR1 and KOG1 (raptor) are directly annotated (2/5). The drug target's own
      complex: reduced dosage of the target sensitises to the drug, entailed by
      the screen's design, so confirmatory. Too small to be enriched.
