      label: autophagy
    aspect: biological_process
    category: supporting_process
    confidence: medium
    specificity: ubiquitous
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      33/216, p ~3e-12 (ATG10, ATG15, ATG17, VAC8, CCZ1 directly; many trafficking
      genes via closure). Rapamycin induces autophagy, and cells that cannot carry it
      out survive TORC1 inhibition poorly. Expected, hence confirmatory.
  - term:
