      label: ATP export
    aspect: biological_process
    category: false_association
    confidence: high
    specificity: ubiquitous
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    curator_note: >-
      Significant (11/17, p ~2e-12) only because ESCRT and MVB-sorting genes (BRO1,
      DID4, DOA4, MVB12, SNF8, SRN2, VPS20, VPS24, VPS27, VPS28, VPS36) carry IMP
      annotations to ATP export from a single genome-wide screen of extracellular
      ATP levels (PMID:26585826). ATP efflux has nothing to do with rapamycin
      sensitivity: this is screen-phenotype annotation spilling over into
      enrichment, a useful negative control.
