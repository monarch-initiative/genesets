      label: Ragulator complex
    aspect: cellular_component
    category: core_component
    confidence: high
    specificity: ubiquitous
    seed_source: curator_added
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      GTR1, GTR2, MEH1 (EGO1) and SLM4 (EGO3), the complete EGO complex, are all in
      the set and directly annotated to Ragulator complex in SGD GOA (4/6). The EGO
      complex relays vacuolar amino-acid status to TORC1, so losing it lowers TORC1
      activity and sensitises cells to rapamycin. This is the specific
      mechanistic explanation for the vacuole-heavy enrichment. Not significant
      after genome-wide correction (4 genes), so a method-dependent recovery
      despite complete complex coverage.
