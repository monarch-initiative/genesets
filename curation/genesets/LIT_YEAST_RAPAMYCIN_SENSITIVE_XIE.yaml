    insight: mechanistic
    curator_note: >-
      35/179, p ~2e-16 (BRO1, VPS20, VPS24, VPS27, VPS41, VAM7, CCZ1, YPT7, the GARP
      subunits VPS51-54, and others). Vacuolar sorting mutants have impaired
      TORC1 activation and are rapamycin-sensitive, so the enrichment is a real
      route to the phenotype rather than background. Medium confidence because
      vacuolar trafficking mutants are also generically drug-sensitive.
  - term:
