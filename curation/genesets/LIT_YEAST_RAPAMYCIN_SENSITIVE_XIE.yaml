collection: LIT:GENETIC
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
direction: DN
description: >-
  The 280 Saccharomyces cerevisiae deletion strains with decreased resistance
  (hypersensitivity) to rapamycin in the genome-wide high-density cell-array screen
  of Xie et al. (2005, PMID:15883373). Membership is the set of null mutants SGD
  curated from this paper as "resistance to chemicals: decreased" with sirolimus
  (snapshot in curation/genesets/model_organism_members.gmt). Rapamycin inhibits
  TORC1, so hypersensitive mutants are those that already have weakened TORC1
  activity or depend on TORC1 outputs. GO enrichment is dominated by
  endosome/vacuole trafficking (vacuolar protein sorting, late endosome, HOPS/CORVET
  and ESCRT subunits) and autophagy. The mechanistic core is that the vacuole membrane
  is where TORC1 is activated by amino acids: the set contains all four subunits of
  the yeast EGO complex (GTR1, GTR2, MEH1/EGO1, SLM4/EGO3; the Rag GTPase and
  Ragulator orthologues) and TORC1 itself (TOR1, KOG1). A block of ESCRT genes enters
  via an "ATP export" annotation from an unrelated screen, an annotation-driven
  false positive.
