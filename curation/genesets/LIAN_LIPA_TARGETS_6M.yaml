gene_set_name: LIAN_LIPA_TARGETS_6M
collection: M2:CGP
msigdb_release: v2025.1.Mm
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
direction: UP
description: >-
  MSigDB mouse M2:CGP set (M4345) of ~96 genes at least 2-fold up in lungs of
  6-month-old lysosomal acid lipase knockout (Lipa-/-, lal-/-) mice (Lian et al.
  2005, PMID:16127159, Table 1S). Blocking lysosomal hydrolysis of cholesteryl
  esters and triglycerides causes foamy macrophage accumulation, neutrophil
  infiltration and emphysema. The membership is a myeloid inflammatory programme:
  lipid-laden/lysosome-rich macrophage genes (Cd68, Ctsb, Atp6v0d2, Acp5, Gpnmb,
  Trem2, Galc, Neu1, Msr1, Marco, Cd5l, C1qa/b/c), neutrophil genes (S100a9, Camp,
  Clec4d, Clec4e, Cxcl3), an expanded paired-Ig-like receptor cluster (Pira1-12,
  Pirb, Lilra6, Fcgr2b, Fcgr4, Fcer1g), and matrix metalloproteinases (Mmp12, Mmp8,
  Mmp13, Mmp19). GO enrichment links the lysosomal storage defect to
  tissue-destructive mechanism: lysosome-laden macrophages and collagen-degrading
  MMPs (Mmp12 rose ~100-fold) account for the emphysema. Note the authors
  localised the strongest increases (Mmp12, Api-6/Cd5l, Spic, Mafb) mainly to
  alveolar type II cells; assigning the rest of the programme to myeloid cells is
  the curator's inference from marker identity.
