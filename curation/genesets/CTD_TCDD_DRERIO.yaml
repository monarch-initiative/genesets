direction: NA
description: >-
  The 51 zebrafish genes with CTD-curated interactions with
  2,3,7,8-tetrachlorodibenzo-p-dioxin (TCDD; MeSH D013749; mygeneset.info
  D013749_7955; membership snapshot in curation/genesets/model_organism_members.gmt).
  TCDD acts through the aryl hydrocarbon receptor (AHR); in zebrafish embryos its
  signature toxicity is cardiovascular (heart malformation, pericardial oedema),
  mediated by Ahr2/Arnt. The set mixes three kinds of
  members. (1) The receptor machinery and its classic targets: ahr1a, ahr1b, ahr2,
  ahrrb (AHR repressor), arnt2, cyp1a, sult6b1. (2) Developmental and cardiac
  effectors: tcf21 (epicardium), notch1b, bmp4, aldh1a2, and the prostanoid enzymes
  ptgs2b (COX-2) and tbxas1 (thromboxane synthase), implicated in TCDD-induced
  circulation failure. (3) Proteomic and abundance-driven changes: glycolysis
  (aldoaa, aldocb, pgk1, tpi1b, ldhba), proteasome subunits (psma1, psma2a, psma4,
  psmb7, psmc5) and chaperones (hspa5, hspa8, hspd1, tcp1, stip1). Direction is
  mixed (NA).
