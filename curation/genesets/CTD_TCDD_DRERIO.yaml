    curator_note: >-
      ptgs2b (COX-2) is directly annotated (1/10); tbxas1 (thromboxane A synthase)
      acts downstream on the same prostanoid pathway. COX-2/thromboxane signalling
      has been implicated in TCDD-induced circulation failure in zebrafish embryos,
      a specific mechanistic lead. Carried by one or two genes, so not recoverable
      by set enrichment.
  - term:
      id: GO:0031101
      label: fin regeneration
    aspect: biological_process
    category: supporting_process
    confidence: medium
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      aldh1a2, notch1b, mmp9, hspa8 and hspd1 are directly annotated (5/89, p
      ~2e-6). TCDD blocks caudal fin regeneration in larval and adult zebrafish
      through Ahr2, a well-studied zebrafish toxicity endpoint, and the
      regeneration regulators here (retinoic acid synthesis, Notch, Mmp9) are the
      kind of developmental targets it disrupts. A specific, non-obvious
      enrichment for a dioxin list, but part of the signal (hspa8, hspd1) comes
      from abundant chaperones, so confidence is medium.
