    curator_note: >-
      The phenotype-defining biology of TCDD in zebrafish embryos. Developmental
      cardiac regulators are present (tcf21, notch1b, bmp4, aldh1a2), but only
      bmp4 (direct) and arnt2 and tpm4a (via closure) reach heart development in
      ZFIN GOA (3/605). tcf21, notch1b and aldh1a2 have zebrafish heart-relevant
      roles but are annotated to kidney, vasculature, Notch and retinoic-acid
      terms instead, so the cardiotoxicity mechanism is not recoverable: an
      annotation gap. Medium confidence, as CTD does not say which interactions
      come from cardiac studies.
  - term:
