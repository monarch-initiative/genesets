associations:
  - term:
      id: GO:0030073
      label: insulin secretion
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: cell_type_specific
    seed_source: curator_added
    recovery_status: annotation_supported
    insight: mechanistic
    evidence:
      - reference: PMID:38049589
        reference_title: "Genetic risk converges on regulatory networks mediating early type 2 diabetes."
        supports: NEUTRAL
        evidence_source: IN_VITRO
        snippet: "converge on an RFX6-mediated network to reduce insulin secretion"
        explanation: >-
          The quotation is the paper's own headline claim and is recorded here as
          the CONTRAST, hence supports NEUTRAL: secretion falls, while the
          transcripts for the process rise.
          The set contains the beta cell secretory apparatus, and it is UP:
          ABCC8, SLC30A8, SLC2A2, G6PC2, CACNA1C, CACNA1D, PCSK1, PCSK2, CPE,
          IAPP, CHGB, SCG3, SCG5, UNC13A, CADPS and STXBP5, together with the
          identity factors MAFA, ISL1, PAX6, MNX1, GLIS3, SIX3 and the PDX1
          lncRNA PLUT. These members carry insulin-secretion annotations, so the
          term is annotation_supported. It is marked curator_added because the
          study's own Metascape output (Supplementary Data 2b) returns no
          insulin-secretion term for either arm — its clustered output is
          dominated by the synaptic and cytoskeletal modules — so a method that
          recovers this term is finding something the published enrichment did
          not. The paper's matching functional observation, in the Results, is
          that shRFX6 pseudoislets had a greater insulin content while proinsulin
          processing was unchanged, even though stimulated secretion was blunted;
          that sentence is not attached as a snippet because only the abstract is
          machine-retrievable for this reference (the cached record is
          content_type abstract_only).
      - reference: PMID:38064570
        reference_title: "RFX6 Maintains Gene Expression and Function of Adult Human Islet alpha-Cells."
        supports: REFUTE
        evidence_source: IN_VITRO
        explanation: >-
          Recorded as a genuine DISAGREEMENT in the literature about the sign of
          this arm, not as support. A companion study of the same perturbation in
          the same tissue (GIPZ lentiviral shRNA against RFX6 in primary human
          pseudoislets, FACS-purified cells, bulk RNA-seq, DESeq2) reports the
          OPPOSITE direction for the secretory machinery. In its alpha cells,
          SLC30A8 falls (log2FC -0.79) along with UCN3, CHGA, PCSK2, CPE and the
          CACNA1A/CACNA1C/KCNA5 channels — see
          LIT:RFX6_KNOCKDOWN_ALPHA_CELL_DN. In its beta cells it reports 155
          DEGs in which ABCC8 and GCK are DOWNregulated, described as
          corroborating prior mouse work showing Abcc8 and Gck are RFX6-regulated
          — whereas in this set ABCC8 is +0.81 and SLC30A8 is +1.06. The two
          studies differ in vector (adenoviral versus lentiviral), in assay
          (single-nucleus multiome of whole pseudoislets versus bulk RNA-seq of
          FACS-purified cells), in threshold (Padj<0.01 versus <0.1) and in
          knockdown efficiency, so the discrepancy has methodological
          explanations and is not adjudicated here. No verbatim snippet: only the
          abstract is machine-retrievable for this reference.
    curator_note: >-
      Scored mechanistic, and the reason this pole is worth curating: nothing
      about "RFX6 knockdown reduces insulin secretion" entails that the secretory
      and identity transcripts RISE, and the naive expectation — that they fall —
      is recorded as a membership_gap on the DN pole. One coherent reading of the
      pair is a post-transcriptional lesion, with secretory cargo genes and MAFA
      transcriptionally intact or elevated and insulin content accumulating,
      while the trafficking, autophagy, ciliary and proteasomal machinery that
      would move and turn over that cargo is depleted in the DN arm. BUT THAT
      READING IS CONTESTED: the REFUTE evidence above records a companion study
      reporting the opposite sign for ABCC8, GCK and SLC30A8 in the same tissue
      and perturbation. The category stays core_process — these genes are in this
      set and this term is what they do — and the direction stays as published,
      but the mechanistic interpretation is explicitly held open rather than
      asserted. cell_type_specific: insulin secretion is executed by the beta
      cell alone.
  - term:
      id: GO:0030141
      label: secretory granule
    aspect: cellular_component
    category: core_component
    confidence: high
    specificity: cell_type_specific
    seed_source: curator_added
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      The structural counterpart of the term above: the insulin granule and its
      cargo/processing machinery are represented by CHGB, SCG3, SCG5, CPE, PCSK1,
      PCSK2, IAPP, SLC30A8 (the granular zinc transporter) and CADPS (granule
      priming), all members of this arm and all carrying secretory-granule
      annotations (annotation_supported). curator_added for the same reason as
      insulin secretion — the study's clustered Metascape output does not surface
      it. Confirmatory rather than mechanistic: once one accepts that the
      secretory transcripts are up, that they are granule proteins is entailed;
      the non-obvious part is the direction, which is scored on the process term.
  - term:
      id: GO:0099536
      label: synaptic signaling
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    evidence:
      - reference: PMID:38049589
        reference_title: "Genetic risk converges on regulatory networks mediating early type 2 diabetes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: >-
          Synaptic signalling is one of the two up-arm programs the authors name
          in the Results (Extended Data Fig. 9d), and it is the dominant one in
          their own Metascape output (Supplementary Data 2b): modulation of
          chemical synaptic transmission LogP -13.1, regulation of trans-synaptic
          signaling -13.1, chemical synaptic transmission -10.1, synaptic
          signaling -9.3, versus no down-arm signal for the narrower terms. The
          carriers are members: the glutamate receptors GRM5 (log2FC +3.62),
          GRIK2 and GRIA4, the synaptic adhesion molecules NRXN1 and LRRTM4, the
          dense-core-vesicle priming factor CADPS, the neuropeptide receptor
          CRHR1 and the axon-guidance ligands/receptors ROBO1, ROBO2 and SEMA3A.
    curator_note: >-
      Beta cells do not form synapses; the term is recovered because the beta
      cell, as a neuroendocrine cell, shares a large part of the neuronal
      receptor, adhesion and regulated-exocytosis repertoire, and that module is
      coordinately de-repressed when RFX6 is knocked down. Kept core because it
      is the dominant coherent program of this arm and is the enrichment the
      authors themselves report, and lineage_shared because the module is a
      neuroendocrine inheritance rather than anything beta cell-specific. Scored
      confirmatory on the tightened rule: "islet transcription factor knocked
      down, neuronal-like program comes up" is the generic loss-of-identity
      hallmark of an endocrine perturbation, and the authors present it as
      confirming a known similarity rather than as a discovery.
  - term:
      id: GO:0042391
      label: regulation of membrane potential
    aspect: biological_process
    category: supporting_process
    confidence: high
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      The electrical arm that sits between the two programs above, at LogP -7.5
      in the up arm of the study's Metascape output with no down-arm signal.
      Carried by members that are simultaneously beta cell stimulus-secretion
      coupling genes and generic excitability genes: the KATP subunit ABCC8, the
      L-type calcium channels CACNA1C and CACNA1D, the large-conductance
      potassium channel KCNMA1, KCND3 and TRPM3. Supporting rather than core
      because it is a shared substrate of the secretory and neuronal modules
      rather than the defining activity of the set, and confirmatory because
      electrical excitability is exactly what one expects to move with them.
  - term:
      id: GO:0048812
      label: neuron projection morphogenesis
    aspect: biological_process
    category: supporting_process
    confidence: medium
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      The morphogenetic tail of the same neuronal module (LogP -8.7 up), carried
      by the guidance receptors and ligands ROBO1, ROBO2, UNC5C, PLXNA4, NRP1,
      SEMA3A and the neural adhesion molecules LRRC4C, NTM and CNTN4, which hold
