gene_set_id: LIT:RFX6_KNOCKDOWN_BETA_CELL_UP
gene_set_name: RFX6_KNOCKDOWN_BETA_CELL_UP
collection: LIT:PERTURBATION
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
direction: UP
series: SERIES:RFX6_KNOCKDOWN_ISLET_CELL
series_role: beta_up
n_genes: 1272
description: >-
  Literature-defined genetic-perturbation signature: the genes UPregulated in
  primary human pancreatic beta cells after knockdown of the islet transcription
  factor RFX6, from Walker, Saunders, Rai et al. (Nature 2023, PMID:38049589).
  Adenoviral U6-driven RFX6-targeted shRNA (shRFX6, mKate2-tagged) or scramble
  shRNA (control, mCherry-tagged) was delivered to dispersed primary human islet
  cells that were then reaggregated into pseudoislets for six days; shRFX6 and
  control pseudoislets from seven matched donors were profiled by single-nucleus
  multiome, and the RNA component of the beta cell nuclei was tested for
  differential expression. The published list (Supplementary Data 2a, "Genes
  differentially expressed (DE) at Padj<0.01, shRFX6 vs scramble, beta cell
  nuclei, multiome (RNA)") contains 2,675 entries, of which 1,273 have positive
  log2 fold change; this file is that UP arm, and
  LIT:RFX6_KNOCKDOWN_BETA_CELL_DN is its pole. Members are the READOUT of a
  genetic perturbation, not causal/driver genes: RFX6 itself is not a member, so
  this is a downstream-of-knockdown signature rather than a set in which RFX6 is
  merely differentially expressed. MEMBERSHIP PROCESSING: the vector reporter
  transcript mKate2 (log2FC +4.61, the shRFX6 construct's tag; its counterpart
  mCherry sits at -4.37 in the down arm, which independently confirms the stated
  shRFX6-vs-scramble polarity) is an artefact of the dual-construct design and
  was removed, leaving 1,272 members. Published symbols were normalized to
  current HGNC symbols via mygene.info with an exact-current-symbol-first rule;
  no duplicate rows collapsed in this arm. Clone-based identifiers from the
  study's GENCODE annotation with no current HGNC symbol (RP11-*, AC*, CTD-*)
  were retained verbatim so membership stays faithful to the published set,
  though they carry no GO annotation. INTERPRETATION: this arm is where the
  paradox of the experiment lives. RFX6 knockdown blunts stimulated insulin
  secretion, yet the transcripts of the insulin secretory apparatus go UP, not
  down — ABCC8 (+0.81), SLC30A8 (+1.06), SLC2A2 (+1.05), G6PC2 (+0.31), CACNA1D
  (+0.79), PCSK1 (+0.41), PCSK2 (+0.63), CPE (+0.32), IAPP (+0.96) and the beta
  cell identity factors MAFA (+1.28), ISL1, PAX6, MNX1, GLIS3 and SIX3 — while
  the machinery that traffics, degrades and recycles those products falls in the
  DN arm, and the pseudoislets accumulate a greater insulin content. Alongside
  it, a neuronal/synaptic module is de-repressed (GRM5 +3.62, GRIK2, GRIA4,
  NRXN1, LRRTM4, CRHR1, ROBO1/2, SEMA3A), which the authors read as a broad
  similarity of beta cells to neurons as electrically active and secretory cells.
  DISEASE RELEVANCE: RFX6 is the beta cell hub gene on which multiple layers of
  type 2 diabetes genetic risk converge in this study; the direction of this arm
  is why the resulting secretory defect is best read as post-transcriptional
  rather than as loss of secretory gene expression. SEED_SOURCE SEMANTICS: no
  genesets-rs run seeded this file. `enrichment_recovered` here means the term
  (or its immediate parent/child) appears in the study's own published
  enrichment of this exact gene list — Metascape over the up, down and combined
  arms, Supplementary Data 2b — and `curator_added` means it does not, so the
  eval's recall denominator is honest with respect to an independent prior
  enrichment rather than to the tool being scored. Two of this arm's three core
  terms are curator_added, which makes it a deliberately hard recall target.
