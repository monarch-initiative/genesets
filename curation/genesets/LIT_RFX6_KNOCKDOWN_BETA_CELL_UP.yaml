      genes are present and coherently up, but a primary human beta cell extends
      no neurites, so this is a by-product of de-repressing the neuronal
      repertoire rather than a process the cell performs. Note the term is also
      enriched in the DN arm (-10.4), so it does not discriminate the poles of
      this series.
  - term:
      id: GO:0030048
      label: actin filament-based movement
    aspect: biological_process
    category: marker_driven_plausible
    confidence: low
    specificity: broadly_expressed
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    curator_note: >-
      Recorded because it is one of the two terms the paper names for this arm,
      but downgraded on the membership. It is the weaker of the two (LogP -5.0
      up, with actin-mediated cell contraction at -4.5) and the up arm contains
      very few actual actomyosin genes — MYO3A and MYOM1, with the signal
