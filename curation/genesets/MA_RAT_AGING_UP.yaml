description: >-
  MSigDB set (M46418; rat gene symbols) of 110 genes up-regulated with age in at least
  five cell types across a multi-tissue single-cell and single-nucleus atlas of rat
  aging (Ma et al. 2020, PMID:32109414, Table S2). Because it requires concordant change
  across many cell types, it captures the shared, tissue-independent aging program
  rather than any one tissue. GO enrichment shows that the program is
  inflammatory/innate-immune: cytokines and chemokines (Il1b, Il6, Ccl3, Ccl6, Cxcl2),
  alarmins and antimicrobials (S100a8, S100a9, Lyz2, Defa5, Pglyrp1, Slpi), acute-phase
  proteins (Hp, Lrg1, Tf), interferon-stimulated genes (Ifit3, Oas1a, Oasl, Ifitm1,
  Ifi27l2a), MHC (RT1-A1/A2, RT1-Db1, B2m) and myeloid adaptors (Tyrobp, Fcer1g,
  Clec7a). There is also an antioxidant/stress layer (Sod2, Mt1f, Mt2, Nqo1, Txnip,
  Gadd45a, Ucp2). This is the cell-intrinsic counterpart of the paper's finding that
  immune cells accumulate with age. A block of ribosomal-protein genes rides along
  and is treated as a technical, not biological, signal (see the paired
  MA_RAT_AGING_DN). Rat GO annotation is largely inferred from human and mouse
  orthologues (ISO), so recovery here mostly tests orthology-propagated
  annotation.
