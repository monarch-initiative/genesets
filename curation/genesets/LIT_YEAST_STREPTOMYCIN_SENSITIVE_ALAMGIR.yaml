    curator_note: >-
      12/206, near what chance predicts for 377 genes: HCR1, RPL12B, RPL13B, RPP1B,
      RPS0B, RPS10A, RPS7A, SSB1, SSZ1, TRM7 directly; CUE2, UBC4 via closure.
      Aminoglycosides target the ribosome, so translation is the expected core
      process (confirmatory). The carriers that are present are annotated, but they
      are too few relative to the set's size to stand out.
