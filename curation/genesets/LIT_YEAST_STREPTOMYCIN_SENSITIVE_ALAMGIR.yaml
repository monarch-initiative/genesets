    curator_note: >-
      SSB1, SSZ1, ZUO1 and ACL4 are directly annotated (4/13, not significant). Ssb
      (Hsp70) with its RAC partners Ssz1 and Zuo1 binds nascent chains at the exit
      tunnel. RAC/Ssb mutants have reduced translational fidelity and are
      hypersensitive to aminoglycosides, which act by inducing misreading. A specific,
      complete module in a small term; medium confidence because the set is
      otherwise diffuse.
