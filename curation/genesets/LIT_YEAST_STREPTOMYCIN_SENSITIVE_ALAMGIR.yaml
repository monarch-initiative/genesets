  label: Saccharomyces cerevisiae S288C
direction: DN
description: >-
  The 377 Saccharomyces cerevisiae deletion strains with decreased resistance to the
  aminoglycoside streptomycin (40 mg/ml) in the colony-size chemical-genetic screen of
  Alamgir et al. (2010, PMID:20691087). Membership is the set of null mutants SGD
  curated from this paper as "resistance to chemicals: decreased" with streptomycin;
  snapshot in curation/genesets/model_organism_members.gmt. The paper summarises its
  aminoglycoside profiles as dominated by protein-biosynthesis genes, but the curated
  membership does not carry that signal under GO. Translation is 22/377 against a
  717-gene term, and cytoplasmic translation 12/206, both near chance, so no GO
  term is significant. One specific mechanism is visible in the genes: the
  ribosome-associated chaperone system that folds nascent chains at the ribosome exit
  tunnel (SSB1, SSZ1, ZUO1), whose loss is known to cause aminoglycoside
  hypersensitivity through reduced decoding fidelity. The set is a second
  "mechanism present, nothing enriched" case after POMBE_CLS_EXTENDED_ROMILA. Its
  membership is noisier than its paper's summary suggests.
