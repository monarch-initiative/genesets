      genes, p = 2.0e-19). Under IBA only EGLN1 and EGLN3 carry the cellular
      term, so it is not recovered, while the parent is (7 genes, p = 3.8e-8).
      Confirmatory: the set is defined by induction by hypoxia.
  - term:
      id: GO:0001525
      label: angiogenesis
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    evidence:
      - reference: PMID:15374877
        reference_title: "Transcriptional regulation of vascular endothelial cell responses to hypoxia by HIF-1."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Infection of endothelial cells with AdCA5 under nonhypoxic conditions was sufficient to induce increased basement membrane invasion and tube formation similar to the responses induced by hypoxia, indicating that HIF-1 mediates cell-autonomous activation of endothelial cells."
        explanation: >-
          HIF-1 alone drives the endothelial angiogenic phenotype (invasion,
          tube formation), not only the secretion of angiogenic factors by
          other cells.
    curator_note: >-
      ACKR3, ANG, APOD, COL18A1, COL4A1, GJA5, LEPR, LOXL2, MMP2, NOTCH4,
      PDGFB, PGF, PTPRB, PXDN, SERPINE1, TGFBI, VEGFA and VEGFC (18/207 vs
      211; per-set Bonferroni p = 2.5e-12; IBA 8 genes, p = 9.9e-6). Confirmatory for
      a HIF-induced endothelial set.
  - term:
      id: GO:0031012
      label: extracellular matrix
    aspect: cellular_component
    category: core_component
    confidence: high
    specificity: broadly_expressed
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      31/207 vs 571 (per-set Bonferroni p = 9.5e-18; IBA 17 genes, p = 9.2e-11),
      led by the collagens (COL1A2, COL4A1, COL4A2, COL5A1, COL9A1, COL18A1),
      LAMB1, BGN, the collagen-modifying enzymes PLOD1, PLOD2, LOX and LOXL2,
      and secreted factors (ANGPTL4, IGFBP3, SERPINE1, TGFBI, VWF). Manalo
      list collagens among the gene groups they found. The component is
      recorded as confirmatory; the specific mechanism is collagen fibril
      organization below.
  - term:
      id: GO:0030199
      label: collagen fibril organization
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: broadly_expressed
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      COL1A2, COL4A1, COL4A2, COL5A1, LOX, LOXL2, P4HA1, PLOD1, PLOD2 and PXDN
      (10/207 vs 69; per-set Bonferroni p = 8.1e-8; IBA 7 genes, p = 2.9e-7).
      Hypoxia, through HIF-1, induces the whole collagen maturation pathway:
      the prolyl and lysyl hydroxylases that make collagen hydroxylation
      oxygen-dependent and the lysyl oxidases that cross-link it.
      Mechanistic because matrix remodelling is not implied by an
      oxygen-sensing set. One of the four groups Ballouz et al. find
      significant after multifunctionality correction.
  - term:
      id: GO:0031545
      label: peptidyl-proline 4-dioxygenase activity
    aspect: molecular_function
    category: supporting_process
    confidence: high
    specificity: broadly_expressed
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      EGLN1, EGLN3, P4HA1 and P4HA2 (4/207 vs 8; per-set Bonferroni p = 1.1e-3;
      IBA p = 1.3e-4). Two prolyl-4-hydroxylase families: EGLN1/EGLN3
      hydroxylate HIF-alpha and mark it for degradation, so their induction
      is HIF's own negative feedback; P4HA1/P4HA2 hydroxylate collagen.
      Recorded as an MF term because current GO annotates these genes to the
      dioxygenase activities, not to the process terms. Ballouz et al.'s
      peptidyl-proline modification (GO:0018208) has no carriers in this set
      under current GOA, so that 2013 result is not reproducible with current
      annotations.
  - term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    aspect: biological_process
    category: nonspecific
    confidence: medium
    specificity: ubiquitous
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    evidence:
      - reference: PMID:15374877
        reference_title: "Transcriptional regulation of vascular endothelial cell responses to hypoxia by HIF-1."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Transcription factors accounted for the largest group of HIF-1-regulated genes, indicating that HIF-1 controls a network of transcriptional responses to hypoxia in endothelial cells."
        explanation: >-
          The authors' own headline. It describes a real feature of the
          membership but not a specific process.
    curator_note: >-
      45/207 vs 3731 (per-set Bonferroni p = 3.1e-3 under all-GOA; 25 genes,
      not significant, under IBA). Real, and the original paper's headline, but
      too generic to say which transcriptional program is meant, so it is
      nonspecific. The PAN-GO reanalysis also reports transcriptional
      regulation groups.
  - term:
      id: GO:0008217
      label: regulation of blood pressure
    aspect: biological_process
    category: marker_driven_plausible
    confidence: low
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    curator_note: >-
      ADM, COL1A2, EDN1, GJA5, NPR1, PPARG, PTGS1, TPM1 and VEGFC (9/207 vs
      164; per-set Bonferroni p = 5.7e-3 under all-GOA, not significant under
      IBA). The
      top GO group in Ballouz et al.'s 2013 run (FDR 1.4e-4), which does not
      survive multifunctionality correction. The vasoactive genes (ADM, EDN1,
      NPR1, PTGS1) are real endothelial HIF targets, but blood pressure is a
      systemic process that cultured cells do not carry out.
published_analyses:
  - reference: PMID:15374877
    reference_title: "Transcriptional regulation of vascular endothelial cell responses to hypoxia by HIF-1."
    analysis_role: original
    method: Manual assignment of genes to functional categories; no GO enrichment test.
    membership_note: >-
      245 up-regulated probes (genes induced by both hypoxia and AdCA5);
      MSigDB maps them to 210 genes today, and 202 in the release Ballouz et
      al. and PAN-GO used.
    summary: >-
      Transcription factors were the largest category of HIF-1-regulated
      genes, with cytokines, growth factors, receptors and other signalling
      proteins also common among the up-regulated genes.
    snippet: "Transcription factors accounted for the largest group of HIF-1-regulated genes, indicating that HIF-1 controls a network of transcriptional responses to hypoxia in endothelial cells."
