description: >-
  MSigDB C2:CGP set of genes induced in cultured human arterial endothelial
  cells both by hypoxia and by adenoviral expression of a constitutively
  active HIF-1alpha (AdCA5) under normoxia, at least 1.5-fold in each (Manalo
  et al., Blood 2005, PMID:15374877). It is the cell-autonomous, HIF-1-driven
  part of the endothelial hypoxia response. The membership has the expected
  HIF targets: angiogenic factors (VEGFA, VEGFC, PGF, ANGPTL4, ADM, EDN1),
  the HIF negative-feedback prolyl hydroxylases EGLN1 and EGLN3, hypoxia
  markers (BNIP3, BNIP3L, NDRG1, DDIT4, AK4, ERO1A, STC1, STC2), and many
  transcription factors (BHLHE40, HES1, KLF11, MXI1, NPAS2, ZNF395, SOX4,
  HIF3A, MAFF), the largest group in Manalo's own categorization. Its less
  obvious axis is a collagen-maturation and matrix-remodelling program:
  collagens COL1A2, COL4A1, COL4A2, COL5A1, COL9A1, COL18A1, the collagen
  prolyl-4-hydroxylases P4HA1 and P4HA2, the lysyl hydroxylases PLOD1 and
  PLOD2, and the cross-linking oxidases LOX and LOXL2.
  This is one of the three case studies in Ballouz et al. (NAR 2017,
  PMID:28204549) and in the PAN-GO functionome paper (PMID:40011791), both
  of which ran it as a 202-gene list from an earlier MSigDB release. The
  current MSigDB mapping has 210 genes and shares 195 with it. Their results
  are under published_analyses.
