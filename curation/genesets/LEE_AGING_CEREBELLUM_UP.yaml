gene_set_id: MSIGDB:LEE_AGING_CEREBELLUM_UP
gene_set_name: LEE_AGING_CEREBELLUM_UP
collection: M2:CGP
msigdb_release: v2025.1.Mm
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
direction: UP
description: >-
  MSigDB mouse M2:CGP set (M1599) of 90 genes up-regulated in the cerebellum of aged
  versus young mice (Lee, Weindruch and Prolla 2000, PMID:10888876, Table 5S), one of
  the first genome-scale brain-aging profiles. The membership is a glial
  inflammatory program. It has the classical complement cascade (C1qa, C1qb, C1qc,
  C4a, C4b) and primed or disease-associated microglia (Cd68, Ctss, Ctsd, Ctsz,
  Hexb, Cst7, Lgals3, Lgals3bp, Spp1, Axl, Apoe, Mpeg1). It also has interferon
  response genes (Irf7, Ifi27, Ifit1bl2, Irgm1, Trim5) and reactive astrocytes
  (Gfap), plus oxidative-stress genes (Hmox1). GO enrichment recovers complement
  activation and the lysosome, but not microglial activation, whose marker genes
  are present but mostly unannotated to it.
