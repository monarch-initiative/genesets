    evidence:
      - reference: PMID:10888876
        reference_title: "Gene-expression profile of the ageing brain in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ageing resulted in a gene-expression profile indicative of an inflammatory response, oxidative stress and reduced neurotrophic support in both brain regions."
        explanation: >-
          The defining paper characterises the aging profile as inflammatory.
    curator_note: >-
      C1qa, C1qb, C1qc, C4a, C4b directly annotated (5/23, p ~1e-8). Mechanistic:
      beyond "inflammation", the specific rise of C1q and C4 points to the classical
      complement pathway, later shown to accumulate at aging synapses and tag them
      for microglial elimination.
  - term:
      id: GO:0001774
      label: microglial cell activation
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: cell_type_specific
    seed_source: curator_added
    recovery_status: annotation_gap
    insight: confirmatory
    curator_note: >-
      Expected in an aging-brain signature, hence confirmatory. The
      activated/disease-associated microglial genes are present: Cd68, Ctss, Hexb,
      Cst7, Lgals3, Spp1, Axl, Apoe, Mpeg1. Yet only C1qa is annotated to microglial
      cell activation in MGI GOA (1/39), so enrichment cannot recover the cell state
      that drives the signature. An annotation gap: these genes are curated as
      markers, not as participants in the process.
  - term:
      id: GO:0005764
      label: lysosome
    aspect: cellular_component
    category: supporting_process
    confidence: high
    specificity: broadly_expressed
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      14/652, p ~2e-8 (Capn2, Cd68, Cst7, Ctsd, Ctsh, Ctss, Ctsz, Hexb, Irgm1, Slc11a1
      directly; B2m, Gfap, Hspa8, Mpeg1 via closure). The expanded lysosomal
      compartment of primed microglia: the recoverable proxy for the activation
      state above.
  - term:
      id: GO:0035456
      label: response to interferon-beta
    aspect: biological_process
    category: marker_driven_plausible
    confidence: medium
    specificity: broadly_expressed
    seed_source: curator_added
    recovery_status: annotation_supported
    curator_note: >-
      Capn2 and Irgm1 via closure (2/78); Irf7, Ifi27, Ifit1bl2 and Trim5 are also
      present. A type I interferon component of brain aging; plausible but weakly
      carried.
