description: >-
  MSigDB set (M46419; rat gene symbols) of 170 genes down-regulated with age in at
  least five cell types of the rat multi-tissue single-cell aging atlas (Ma et al.
  2020, PMID:32109414, Table S2), the opposite pole of MA_RAT_AGING_UP. The programme
  lost with age is structural and proteostatic. The dominant signal is extracellular
  matrix and collagen: Col1a1, Col1a2, Col3a1, Col4a1, Col6a2, Col15a1, Col18a1, Eln,
  Fbn1, Fn1, Lox, Lum, Dcn, Bgn, Ogn, Postn, Sparc, Serpinh1. Next is the heat-shock
  chaperone response (Hspa1a, Hspa8, Hsph1, Hsp90aa1, Hspb1, Dnaja1, Dnajb1), then
  smooth-muscle contractile genes (Acta1, Actg2, Cnn1, Myh11, Myl9, Tagln, Des) and
  epidermal keratinization (Krt1, Krt10, Krt14, Krt16, Krtdap). Immediate-early genes
  (Fos, Jun, Jund, Egr1, Atf3, Klf4, Zfp36, Dusp1) are also down; in
  single-cell data these partly reflect dissociation stress. The pair contrasts
  rising inflammation (UP) with declining matrix and proteostasis capacity (DN).
