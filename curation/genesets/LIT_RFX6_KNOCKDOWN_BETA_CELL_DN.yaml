description: >-
  Literature-defined genetic-perturbation signature: the genes DOWNregulated in
  primary human pancreatic beta cells after knockdown of the islet transcription
  factor RFX6, from Walker, Saunders, Rai et al. (Nature 2023, PMID:38049589).
  Adenoviral U6-driven RFX6-targeted shRNA (shRFX6, mKate2-tagged) or scramble
  shRNA (control, mCherry-tagged) was delivered to dispersed primary human islet
  cells that were then reaggregated into pseudoislets for six days; shRFX6 and
  control pseudoislets from seven matched donors were profiled by single-nucleus
  multiome (snRNA-seq + snATAC-seq), and the RNA component of the beta cell
  nuclei (15,825 nuclei total across cell types) was tested for differential
  expression. The published list (Supplementary Data 2a, "Genes differentially
  expressed (DE) at Padj<0.01, shRFX6 vs scramble, beta cell nuclei, multiome
  (RNA)") contains 2,675 entries, of which 1,401 have negative log2 fold change;
  this file is that DOWN arm. Members are the READOUT of a genetic perturbation,
  not causal/driver genes: RFX6 itself is not a member (it does not reach the
  Padj<0.01 threshold in the snRNA data), so this is a downstream-of-knockdown
  signature rather than a set in which RFX6 is merely differentially expressed.
  MEMBERSHIP PROCESSING: the two vector reporter transcripts mCherry (log2FC
  -4.37, the control construct's tag) and mKate2 (log2FC +4.61, the shRFX6
  construct's tag) are experimental artefacts of the dual-construct design and
  were removed — their opposite signs independently confirm the stated
  shRFX6-vs-scramble polarity of the table. Of the remaining symbols, 207 were
  renamed to their current HGNC symbols via mygene.info using an
  exact-current-symbol-first rule (alias resolution only where the published
  symbol is no longer current, e.g. FAM129A -> NIBAN1, KIAA0368 -> ECPAS,
  TRAF3IP1 -> IFT54, HIST1H2AC -> H2AC6, PARK2 -> PRKN), which collapsed four
  duplicate rows (CXorf22/CHDC2/CXorf30 -> CFAP47, AGPAT9 -> LPCAT1, C10orf68 ->
  CCDC7) and yields 1,397 unique members; 354 clone-based identifiers from the
  study's GENCODE annotation that have no current HGNC symbol (RP11-*, AC*,
  CTD-*) were retained verbatim across both arms so the membership stays faithful
  to the published set, but they carry no GO annotation and contribute nothing to
  enrichment. INTERPRETATION: the down arm is where the catabolic and
  trafficking machinery of the beta cell collapses. The paper's own narrative
  reports membrane trafficking, autophagy and ciliary pathways; the strongest
  signal in its Metascape output (Supplementary Data 2b), which the paper does
  not discuss, is the ubiquitin-proteasome system (LogP -39 for proteolysis
  involved in cellular protein catabolic process), carried by 25 proteasome
  subunits plus SCF/APC ubiquitin-ligase components. The naively EXPECTED arm —
  the insulin-secretion machinery going down alongside the blunted secretion
  phenotype — is NOT here: those transcripts are in the UP arm
  (LIT:RFX6_KNOCKDOWN_BETA_CELL_UP), which is recorded below as a
  membership_gap and is the interpretive point of the pair. DISEASE RELEVANCE:
  RFX6 is the beta cell hub gene on which multiple layers of type 2 diabetes
  genetic risk converge in this study, and genetically predicted lower islet
  RFX6 expression is causally associated with T2D. SEED_SOURCE SEMANTICS: no
  genesets-rs run seeded this file. `enrichment_recovered` here means the term
  (or its immediate parent/child) appears in the study's own published
  enrichment of this exact gene list — Metascape over the up, down and combined
  arms, Supplementary Data 2b — and `curator_added` means it does not, so the
  eval's recall denominator is honest with respect to an independent prior
  enrichment rather than to the tool being scored.
