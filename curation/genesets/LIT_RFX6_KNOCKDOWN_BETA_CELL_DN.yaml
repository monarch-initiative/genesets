    evidence:
      - reference: PMID:38049589
        reference_title: "Genetic risk converges on regulatory networks mediating early type 2 diabetes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: >-
          The single strongest enrichment of the down arm in the study's own
          Metascape output (Supplementary Data 2b): proteolysis involved in
          cellular protein catabolic process LogP -39.2, modification-dependent
          protein catabolic process -33.9, ubiquitin-dependent protein catabolic
          process -33.2, proteasomal protein catabolic process -32.2,
          proteasome-mediated ubiquitin-dependent protein catabolic process
          -26.0, KEGG Proteasome -24.2. The carriers are in the membership:
          PSMA2, PSMA3, PSMA4, PSMA5, PSMA7, PSMB2, PSMB3, PSMB4, PSMB6, PSMB7,
          PSMC1, PSMC3, PSMC4, PSMC6, PSMD1, PSMD2, PSMD3, PSMD4, PSMD6, PSMD7,
          PSMD8, PSMD11, PSMD12, PSMD13 and PSMD14, together with UBC, the
          proteasome-assembly chaperone ECPAS, the ERAD cofactor UFD1 and the
          SCF/APC ubiquitin-ligase components SKP1, CUL1, FBXW7 and CDC27. These
          genes carry the annotation directly, so enrichment recovers it
          (annotation_supported). No verbatim snippet is attached because the
          paper's Results narrative does not discuss this arm at all — it is
          present only in the deposited supplementary enrichment table.
    curator_note: >-
      Scored mechanistic rather than confirmatory on the tightened rule: nothing
      about "genes down after knocking down a beta cell transcription factor"
      entails a coordinated collapse of the ubiquitin-proteasome system, and the
      authors themselves did not report it, so it is a genuine, non-obvious
      enrichment insight rather than a restatement of the set's construction.
      This is the term to watch in the eval — a method that returns only the
      trafficking/cilia story the paper narrates is missing the largest signal in
      the set.
  - term:
      id: GO:0000502
      label: proteasome complex
    aspect: cellular_component
    category: core_component
    confidence: high
    specificity: ubiquitous
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      The structural counterpart of the catabolic process above and the same
      convergence seen as a component: the 20S core (PSMA2/3/4/5/7,
      PSMB2/3/4/6/7) and 19S regulatory particle (PSMC1/3/4/6,
      PSMD1/2/3/4/6/7/8/11/12/13/14) are both represented, which is why the
      study's Metascape output returns the CORUM PA700-20S-PA28 complex at LogP
      -24.8. All of these members carry the proteasome complex annotation
      (annotation_supported). Specificity is ubiquitous — the proteasome is a
      housekeeping machine present in every cell — but it is scored core rather
      than nonspecific because it is not a diffuse background hit here: 25
      subunits — most of the 26S proteasome's structural repertoire — are
      coordinately down in one arm of one perturbation, which is the observation
      itself. Marked
      mechanistic for the same reason as the process term.
  - term:
