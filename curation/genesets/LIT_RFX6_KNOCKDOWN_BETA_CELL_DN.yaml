          content_type abstract_only), and the abstract does not descend to this
          level, so quoting the Results sentence would leave an unvalidatable
          excerpt in the gold standard.
          The term is carried by members ATG2B, ATG5, ATG9B, ATG16L1, RB1CC1,
          PIK3C3, GABARAPL1, SQSTM1, TAX1BP1 and the ER-phagy receptor RETREG1,
          which hold the annotation, so enrichment recovers it
          (annotation_supported); the study's Metascape output scores
          macroautophagy at LogP -18.0 and regulation of macroautophagy at -8.8
          in the down arm and returns nothing for the up arm. Scored confirmatory
          rather than mechanistic: loss of autophagic capacity is a generic
          downstream hallmark of a stressed, dedifferentiating secretory cell and
          is explicitly the arm the paper leads with, so it recapitulates the
          published framing rather than revealing anything the set's construction
          did not already suggest.
  - term:
      id: GO:0016192
      label: vesicle-mediated transport
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: ubiquitous
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    evidence:
      - reference: PMID:38049589
        reference_title: "Genetic risk converges on regulatory networks mediating early type 2 diabetes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: >-
          Membrane trafficking is the arm the authors emphasise, and the one they
          connect to disease: they report common pathway overlap between shRFX6
          beta cell nuclei and purified T2D beta cells, particularly in cellular
          membrane and vesicle components linked to T2D GWAS variants, and
          conclude that reduced RFX6 disrupts networks fundamental to beta cell
          function, identifying exocytosis as a target of RFX6-mediated
          dysfunction (Results, Fig. 5). No verbatim snippet is attached because
          only the abstract is machine-retrievable for this reference.
          The members carrying the term are the clathrin/adaptor and
          coat machinery (CLTC, AP2B1, DNM1, SEC24B), the retromer (VPS26A,
          VPS29), the exocyst (EXOC2, EXOC4), TRAPPC8/TRAPPC9 and the cytoplasmic
          dynein motor (DYNC1H1, DYNC1I2); Reactome Membrane Trafficking scores
          LogP -20.5 and vesicle-mediated transport -18.7 in the down arm of the
          study's Metascape output, with no up-arm signal.
    curator_note: >-
      Confirmatory: a transcription factor whose knockdown blunts stimulated
      insulin secretion depleting the vesicle-transport machinery is the
      expected, paper-forward reading. Specificity ubiquitous because vesicular
      transport operates in every cell; kept core because it is the functional
      axis the study itself ties to the secretory phenotype.
  - term:
      id: GO:0005929
      label: cilium
    aspect: cellular_component
    category: core_component
    confidence: medium
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: mechanistic
    evidence:
      - reference: PMID:38049589
        reference_title: "Genetic risk converges on regulatory networks mediating early type 2 diabetes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        explanation: >-
          The ciliary arm is named by the authors in the Results (Extended Data
          Fig. 9d) — again without a verbatim snippet here, since only the
          abstract is machine-retrievable for this reference. It is
          carried by members IFT88,
          IFT172, IFT54, DYNC2LI1, BBS4, BBS9, CEP290, TTBK2, KATNIP, CEP20, KIZ,
          CFAP43 and CFAP47, which hold cilium annotations (annotation_supported);
          WP4352 Ciliary landscape scores LogP -11.6 in the down arm with no
          up-arm signal. It connects to the rest of the paper, where
          cilia-related processes defined functionally correlated modules in
          every islet sample type and the cilium-movement modules were negatively
          correlated with glucose-stimulated insulin secretion.
    curator_note: >-
      Scored mechanistic: RFX6 is the endocrine outlier of the RFX family, and
      the ciliogenic transcriptional program is the job of its paralogues RFX2
      and RFX3 — RFX2 is itself a member of this down arm — so intraflagellar
      transport and basal-body genes collapsing after RFX6 knockdown in a
      post-mitotic primary beta cell is a specific and non-obvious result, and
      one with a mechanism attached given that the beta cell primary cilium
      regulates insulin secretion. Confidence medium and specificity
      lineage_shared rather than higher: the arm is smaller than the
      proteasome/trafficking convergences, and primary cilia are shared across
      most vertebrate cell types rather than being beta cell-specific.
  - term:
      id: GO:0030073
      label: insulin secretion
    aspect: biological_process
    category: supporting_process
    confidence: high
    specificity: cell_type_specific
    seed_source: curator_added
    recovery_status: membership_gap
    insight: confirmatory
    evidence:
      - reference: PMID:38049589
        reference_title: "Genetic risk converges on regulatory networks mediating early type 2 diabetes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "converge on an RFX6-mediated network to reduce insulin secretion"
        explanation: >-
          Recorded as the contrastive, naively EXPECTED arm of an RFX6-knockdown
          down-signature. The functional phenotype is real and central — the
          abstract's whole claim is that genetic risk converges on an
          RFX6-mediated network to reduce insulin secretion, and in the Results
          the dynamic insulin secretion of shRFX6 pseudoislets is significantly
          blunted in the presence of secretagogues — but the transcripts that
          execute it are NOT in this arm. ABCC8, SLC30A8, SLC2A2, G6PC2, CACNA1C,
          CACNA1D,
          PCSK1, PCSK2, CPE, IAPP, MAFA, UNC13A and CADPS all move in the
          opposite direction and are members of LIT:RFX6_KNOCKDOWN_BETA_CELL_UP,
          and the study's Metascape output returns no insulin-secretion term for
          either arm. Hence membership_gap and curator_added rather than
          false_association: the biology belongs in a complete account of RFX6
          knockdown, but the down arm cannot carry it.
    curator_note: >-
      The interpretive hinge of this series. Marked supporting rather than core
      because it is not a process the down-arm members execute, and confirmatory
      because it is exactly what one would predict from "RFX6 knockdown reduces
      insulin secretion" — the surprise is its direction, which is scored on the
      UP pole.
  - term:
      id: GO:0007049
      label: cell cycle
    aspect: biological_process
    category: nonspecific
    confidence: medium
    specificity: ubiquitous
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    curator_note: >-
      Recorded as the arm's main spurious enrichment so precision can be scored
      against it. The study's Metascape output is full of mitotic terms for the
      down arm — Cell Cycle (LogP -16.9), Regulation of mitotic cell cycle
      (-20.9), APC/C-mediated degradation of cell cycle proteins (-20.9), Orc1
      removal from chromatin (-22.1), Mitotic G2-G2/M phases (-22.4) — but these
      are driven almost entirely by the proteasome subunits above together with
      CDC27, SKP1, CUL1 and FBXW7, because the Reactome representation of
      APC/C- and SCF-mediated degradation is annotated as cell-cycle machinery.
      Adult primary human beta cells in six-day pseudoislets are essentially
      post-mitotic and the set contains none of the actual cell-cycle drivers
      (no cyclins, CDKs, MCMs, PCNA, AURKA/B, PLK1 or TOP2A), so the term is
      annotation_supported but biologically uninformative here. No insight tag:
      insight is reserved for core and supporting terms.
