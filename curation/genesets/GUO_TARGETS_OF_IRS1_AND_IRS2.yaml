direction: NA
description: >-
  MSigDB mouse M2:CGP set (M2434) of 105 hepatic transcripts dysregulated in livers
  lacking Irs1 and Irs2 (Guo et al. 2009, PMID:19596788, Fig. 1), the two insulin
  receptor substrates that relay hepatic insulin signalling. The set mixes directions
  and is undirected. It has a known FOXO1 gluconeogenic arm (Pck1, G6pc1, Igfbp1,
  Ppargc1a) and lost glucokinase (Gck). GO enrichment shows that the dominant
  programme is the cholesterol biosynthetic pathway: Hmgcr, Mvk, Mvd, Fdps, Fdft1,
  Sqle, Lss, Cyp51, Msmo1, Nsdhl, Sc5d, Dhcr7, Dhcr24, Acat2, together with Pcsk9 and
  the Abcg5/Abcg8 sterol exporters. This mirrors the insulin → mTORC1 → SREBP route
  that hepatic insulin signalling uses to sustain lipogenic and sterol gene
  expression.
