description: 'Genome-wide CRISPR knockout ranking of human host factors for SARS-CoV-2
  from Daniloski et al. 2021 (GeCKOv2 in A549-ACE2 lung cells, low-MOI screen; PMID:33147445),
  scored by MAGeCK positive selection. The ranked counterpart of the Daniloski half
  of LIT:SARS_COV2_HOST_FACTORS. The top is the paper''s: VPS35, ATP6V0C, ATP6AP1,
  SNX27, with ACE2 11th and CTSL 35th. The interpretation is endolysosomal entry:
  the vacuolar ATPase that acidifies endosomes, and the retromer/commander recycling
  machinery. Weighted KS suits this concentrated top (29 terms at q < 0.05); Wilcoxon
  finds only the V-ATPase. Cholesterol biosynthesis, supporting in the gene-set entry,
  is flat here (KS p = 0.47): the paper found it through single-cell transcriptional
  changes after knockout, not through the screen.'
