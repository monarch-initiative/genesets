  evidence:
  - reference: PMID:33147445
    reference_title: Identification of Required Host Factors for SARS-CoV-2 Infection
      in Human Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Top-ranked genes cluster into distinct pathways, including the vacuolar
      ATPase proton pump, Retromer, and Commander complexes.
    explanation: 'The single most prominent cluster of host-dependency hits in the
      genome-wide screen is the vacuolar (V-)type ATPase proton pump (e.g. ATP6V1A,
      ATP6AP1). These subunit genes are members of the set and carry the proton-transporting
      V-type ATPase complex annotation directly, so enrichment recovers it (annotation_supported).
      It is scored mechanistic rather than confirmatory: a respiratory virus depending
      on a housekeeping organellar proton pump is non-obvious, and the dependency
      reflects the virus''s need for endosomal/lysosomal acidification (see vacuolar
      acidification) during entry, not anything entailed by the set''s "viral infection"
      framing.'
  curator_note: 16 of 27 V-ATPase subunits in the leading edge (ATP6V0C, ATP6AP1,
    ATP6V1B2, ATP6V0B, ATP6V1G1, ATP6V0D1, ATP6V1H, VMA12).
