    curator_note: >-
      ANP1, MNN9 and OCH1 (Golgi mannan polymerase/initiating mannosyltransferase) and
      OST3 (oligosaccharyltransferase) are directly annotated (4/57). Glycosylation
      defects increase the folding load in the secretory pathway and weaken the cell
      wall, a plausible specific route to reductive-stress sensitivity. Not
      significant; medium confidence.
  - term:
