gene_set_name: YEAST_DTT_SENSITIVE_RAND
collection: LIT:GENETIC
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
direction: DN
description: >-
  Saccharomyces cerevisiae deletion strains sensitive to the reductant
  dithiothreitol (DTT, 32 mM) in the genome-wide screen of Rand and Grant (2006,
  PMID:16251355). The paper reports 195 mutants; SGD curates 174 of them as null
  mutants with "resistance to chemicals: decreased" with DTT, and that is the
  membership used here (snapshot in curation/genesets/model_organism_members.gmt).
  DTT causes reductive stress and, by blocking disulfide formation, ER protein
  folding stress. GO enrichment recovers the secretory pathway (Golgi; the
  Golgi mannosyltransferases ANP1, MNN9 and OCH1; OST3), and the ER unfolded
  protein response regulators IRE1 and HAC1 are present. The single strongest hit,
  the vacuolar V-ATPase, is a known multidrug-sensitivity class rather than a
  DTT-specific mechanism. The paper's own mechanism, that the peroxiredoxin TSA1
  chaperones ribosomal proteins against stress-induced aggregation, is carried by
  TSA1 and a few RPL genes but is not visible to set enrichment.
