    curator_note: >-
      RPL1B, RPL13B, RPL27A, RPL31A, RPL35A, RPL39 and RPP1B are directly annotated
      (7/93, not significant). The paper's mechanism, Tsa1 chaperoning misassembled
      ribosomal proteins whose aggregation is toxic under DTT, implies that
      ribosome-assembly imbalance sensitises to DTT. TSA1 is in the set (annotated to
      protein folding, not to this term). A real but under-powered mechanistic
      signal.
