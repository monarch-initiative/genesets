  label: Schizosaccharomyces pombe
direction: DN
description: >-
  The 238 Schizosaccharomyces pombe deletion mutants sensitive to cadmium in the
  genome-wide screen of the fission yeast haploid deletion collection by Kennedy et
  al. (2008, PMID:18684775; the paper reports 237). Membership is the set of
  deletion alleles PomBase curated from this paper with the FYPO phenotype
  "sensitive to cadmium" (FYPO:0000096); snapshot in
  curation/genesets/model_organism_members.gmt. A cross-species counterpart of
  YEAST_CADMIUM_SENSITIVE_RUOTOLO with a different mechanism. Budding yeast detoxifies
  cadmium mainly as glutathione conjugates pumped into the vacuole by YCF1. Fission
  yeast instead makes phytochelatins: pcs2 (phytochelatin synthase) and gcs1
  (glutathione synthesis) are in the set. It also imports phytochelatin-cadmium into
  the vacuole through the ABC transporter hmt1, and builds sulfide-rich complexes from
  sulfate assimilation (met1, met10, met14, met16, sua1). The strongest specific
  enrichment is ubiquinone (CoQ) biosynthesis, one of the paper's headline results.
  The set also contains hmt2, the mitochondrial sulfide:quinone oxidoreductase, which
  plausibly links CoQ to sulfide handling.
