  evidence:
  - reference: PMID:35396579
    reference_title: Rare coding variants in ten genes confer substantial risk for
      schizophrenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: formation, structure and function of the synapse
    explanation: The paper reports that the implicated genes are most expressed in
      CNS neurons and have functions including the formation, structure and function
      of the synapse.
  curator_note: Leading edge headed by GRIA3 and GRIN2A, with BSN, PCLO, MAGI2, the
    scaffolds SHANK1, SHANK3, DLGAP1 and DLG1, and CACNA1C. The expected synaptic
    convergence of schizophrenia genetics, here from rare coding variation. Exome
    burden tests have more power in long, highly expressed, mutation-intolerant genes,
    and synaptic genes are typically long, so a modest whole-term shift like this
    one can partly reflect gene length or constraint rather than biology; confidence
    is medium until tested against a length- or constraint-matched null.
