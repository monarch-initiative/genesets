description: 'Genome-wide ranking of 17,867 genes by rare coding variant burden in
  schizophrenia, from the SCHEMA exome meta-analysis of 24,248 cases and 97,322 controls
  (Singh et al., Nature 2022, PMID:35396579). It is the scored, rare-variant counterpart
  of LIT:SCHIZOPHRENIA_RISK_GENES, whose membership includes the SCHEMA genes alongside
  common-variant GWAS loci and C4. The ten exome-wide significant genes (SETD1A, CUL1,
  XPO7, TRIO, CACNA1G, SP4, GRIA3, GRIN2A, HERC1, RB1CC1) head the ranking. Analyzed
  with the Wilcoxon rank-sum, because the signal is a modest shift across many genes
  rather than a concentrated top: GSEA''s weighted KS reached no term at FDR q < 0.05.
  The interpretation is the expected glutamatergic, postsynaptic convergence. Two
  results are recorded here rather than as associations. Complement activation, the
  mechanistic centrepiece of the GWAS set, is measured but flat in this ranking (Wilcoxon
  z = 0.22, q = 0.98; C4A ranks 10,184th): C4 risk acts through structural variation
  and expression, which exome burden does not capture, so this is a result about the
  data type, not a gap. And burden power tracks gene length and constraint, so whole-term
  shifts among long neuronal genes need a matched null before they are read as biology.'
