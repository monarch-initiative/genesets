    0.39 over 36 genes): GRIA3, GRIN2A, GRIN2B, GRIN2C, CAMK2A/B and PRKCG, the glutamatergic
    plasticity machinery. Confirmatory because glutamatergic dysfunction is the paper''s
    own headline hypothesis. Exome burden tests have more power in long, highly expressed,
    mutation-intolerant genes, and synaptic genes are typically long, so a modest
    whole-term shift like this one can partly reflect gene length or constraint rather
    than biology; confidence is medium until tested against a length- or constraint-matched
    null.'
