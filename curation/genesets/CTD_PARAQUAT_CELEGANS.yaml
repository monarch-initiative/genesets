    curator_note: >-
      8/56, p ~6e-10: ndua-5 direct; mev-1, gas-1, isp-1, nuo-4, ndub-6, ndus-8,
      cyc-2.1 via closure. Mechanistic: it localises the toxicity to the site of
      superoxide production. Complex I/II mutants (gas-1, mev-1) are paraquat
      hypersensitive, while the complex III mutant isp-1 is resistant and
      long-lived, so the chain sets ROS output in both directions.
