    curator_note: >-
      9/34, p ~1e-13, among the strongest hits: che-11, che-13, dyf-13, dyf-3,
      osm-1, osm-3, osm-5, osm-6 direct, che-3 via closure. Mechanistic: nothing
      about oxidative chemistry implies cilia. The link runs through sensory
      perception: ciliated amphid neurons regulate insulin-like signalling, and
      cilium-defective mutants are long-lived and stress resistant in a
      daf-16-dependent way.
