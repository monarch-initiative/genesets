description: >-
  The 76 C. elegans genes with CTD-curated interactions with paraquat (MeSH
  D010269; mygeneset.info D010269_6239; membership snapshot in
  curation/genesets/model_organism_members.gmt). Paraquat redox-cycles to generate
  superoxide, largely at mitochondrial complex I, and is the standard
  oxidative-stress challenge in worm ageing genetics. Members are mostly genes
  whose mutation alters paraquat resistance (undirected). GO enrichment resolves
  three mechanisms. (1) Detoxification and stress transcription (sod-1, gsr-1,
  gst-10, gsto-1, skn-1/Nrf, hsf-1). (2) Insulin/IGF signalling (daf-2, age-1,
  pdk-1, daf-18, daf-16), the longevity pathway whose reduction confers stress
  resistance. (3) Mitochondria: the electron transport chain (mev-1/SDHC, gas-1,
  isp-1, nuo-4, ndua-5, ndub-6, ndus-8, cyc-2.1, cox-6C) together with fusion and
  fission (fzo-1, eat-3, drp-1). The less expected finding is a block of
  sensory-cilium intraflagellar transport genes (che-3, che-11, che-13, osm-1,
  osm-3, osm-5, osm-6, dyf-3, dyf-13): loss of amphid sensory cilia extends
  lifespan and raises stress resistance through neuroendocrine control of DAF-16.
