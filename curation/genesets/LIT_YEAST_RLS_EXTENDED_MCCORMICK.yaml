    curator_note: >-
      TOR1 (directly annotated; AAG1 also annotated, 2/5). tor1 deletion is a
      canonical long-lived mutant, and TORC1 inhibition/dietary restriction is the
      pathway the paper links to LOS1 and Gcn4. Too few genes to be enriched;
      recorded because it is the upstream pathway, expected for an RLS screen.
  - term:
