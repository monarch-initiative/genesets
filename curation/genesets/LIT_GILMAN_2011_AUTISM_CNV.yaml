published_analyses:
  - reference: PMID:21658583
    reference_title: "Rare de novo variants associated with autism implicate a large functional network of genes involved in formation and function of synapses."
    analysis_role: original
    tool: NETBAG
    method: >-
      Not over-representation. For each of 1,454 MSigDB GO categories, the
      average background-network log-likelihood interaction between its genes
      and the cluster genes, with empirical p-values from random CNV sets of
      matched gene count and FDR across categories.
    annotation_source: MSigDB GO gene sets (2010-era) and a GO-derived likelihood network
    membership_note: >-
      Gilman report two clusters, 45 genes when one gene per CNV is allowed
      and 72 when two are allowed. This entry's membership is the 72-gene
      cluster (Table S2).
    correction: FDR over GO categories (empirical p-values)
    summary: >-
      The 25 categories most strongly connected to the cluster concern actin
      network dynamics, synaptogenesis, axonogenesis, cell-cell adhesion,
      small GTPase signalling and neurite development. Gilman also note that
      plain over-representation of GO terms across all 433 CNV genes does not
      give the same result.
    snippet: "The genes forming the network are primarily related to synapse development, axon targeting, and neuron motility."
  - reference: PMID:28204549
    reference_title: "Using predictive specificity to determine when gene set analysis is biologically meaningful."
    analysis_role: reanalysis
    tool: ErmineJ 3.0
    method: Over-representation analysis of GO groups, as described in the paper's case study.
    annotation_source: GO (ErmineJ Generic_human annotations, 2013)
    annotation_date: "2013"
    membership_size: 70
    membership_note: >-
      The paper text describes a 70-gene hit list. This entry's 72-gene
      Table S2 list contains all 11 multifunctional genes the paper names
      (see curation/sources/ballouz2017/README.md). The deposited ErmineJ
      files are for a 44-gene cluster instead (next entry).
    correction: Benjamini-Hochberg FDR; then multifunctionality correction
    significance_threshold: 0.05
    n_significant: 30
    significant_unit: GO groups
    summary: >-
      The list is strongly biased toward multifunctional genes (MF score
      0.86). Removing the 11 most multifunctional genes down-weights learning
      or memory (four of its six cluster genes have 186-289 GO annotations
      each) and lets neuron migration rise. Ballouz et al. argue such terms
      are non-specific rather than false positives.
    snippet: "Repeating their analysis using ErmineJ on their hit list of 70 genes, we arrive at a list of 30 GO gene sets (FDR < 0.05) similar but not identical to those reported."
    reported_terms:
      - reported_label: learning or memory
        term:
          id: GO:0007611
          label: learning or memory
        significant: true
        authors_stance: discounted
        note: Driven by four highly multifunctional genes; down-weighted after correction.
      - reported_label: neuron migration
        term:
          id: GO:0001764
          label: neuron migration
        authors_stance: highlighted
        note: >-
          Ranked 28th before correction and unaffected by it, so it rises;
          Ballouz et al. suggest it may be more relevant to autism than
          learning and memory.
