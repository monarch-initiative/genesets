description: 'Genes in the functional network cluster of rare de novo copy-number
  variants in autism spectrum disorder (Gilman et al. 2011 Neuron, PMID:21658583,
  Table S2; 72 genes). The cluster was found with NETBAG, which builds its gene network
  from functional evidence that includes GO, so synapse terms are partly entailed
  by how the set was made. Ballouz, Pavlidis and Gillis (2017, PMID:28204549) used
  this list as a case study of enrichment driven by multifunctional genes: 11 members
  (FLNA, NRXN1, DLG1, MAPK3, CRHR1, DLG4, DKK1, AXIN1, WNT3, NLGN3, STUB1) carry a
  large share of the annotations, and ''learning or memory'' disappears once that
  is corrected for, while ''neuron migration'' is unaffected.'
