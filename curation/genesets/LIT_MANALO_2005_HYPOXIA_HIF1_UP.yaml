  evidence:
  - reference: PMID:28204549
    reference_title: Using predictive specificity to determine when gene set analysis
      is biologically meaningful.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: peptidyl-proline modification
    explanation: Source authors' judgement under multifunctionality-corrected enrichment.
  curator_note: 'Ballouz et al. name peptidyl-proline modification as one of the four
    terms that survive correction. The carriers are in the set (P4HA1, P4HA2: collagen
    prolyl 4-hydroxylases; EGLN1, EGLN3: HIF prolyl hydroxylases), but in the current
    GOA release no member is annotated to this process or its parent peptidyl-proline
    modification: the signal is visible only through MF terms such as L-ascorbic acid
    binding.'
