description: 'Genes induced in human pulmonary artery endothelial cells both by hypoxia
  and by a constitutively active form of HIF-1alpha (Manalo et al. 2005 Blood, PMID:15374877;
  202 genes). Ballouz, Pavlidis and Gillis (2017, PMID:28204549) used it as a case
  study: 70 GO terms were significant before multifunctionality correction and four
  after (peptidyl-proline modification, cellular response to hypoxia, collagen fibril
  organization, cellular response to oxygen levels). The membership is dominated by
  HIF targets in oxygen sensing (EGLN1, EGLN3, BNIP3, BNIP3L, DDIT4, NDRG1), angiogenesis
  (VEGFA, VEGFC, PGF, ADM, EDN1, ANGPTL4) and collagen synthesis and cross-linking
  (P4HA1, P4HA2, PLOD1, PLOD2, LOX, LOXL2). Classical glycolytic HIF targets are mostly
  absent (only SLC2A3, ENO2, PGM1).'
