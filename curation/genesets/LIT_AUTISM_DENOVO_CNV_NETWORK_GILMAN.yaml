gene_set_id: LIT:AUTISM_DENOVO_CNV_NETWORK_GILMAN
gene_set_name: AUTISM_DENOVO_CNV_NETWORK_GILMAN
collection: LIT:GENETIC
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
direction: NA
n_genes: 44
description: >-
  The functional network of genes hit by rare de novo copy number variants in
  autism, found by NETBAG (Gilman et al., Neuron 2011, PMID:21658583) from the
  Levy et al. de novo CNVs (47 CNV regions, 433 genes after preprocessing).
  NETBAG searches for a cluster of CNV genes that are strongly connected in a
  likelihood network built from shared GO annotations, KEGG pathways,
  interactions and co-evolution. Gilman report two clusters: 45 genes when one
  gene per CNV is allowed (Fig. 2A) and 72 genes when two are allowed (Fig. 2B).
  This entry is the one-gene-per-CNV cluster as deposited by Ballouz et al.
  (NAR 2017, PMID:28204549) in their ErmineJ supplement
  (QuickList.vitkup-cluster1.txt), 44 symbols after HGNC normalization
  (ADAM5P -> ADAM5, now a pseudogene). The 72-gene cluster, which the PAN-GO
  functionome reanalysis used, is not captured here. Membership is in
  curation/genesets/lit_members.gmt.
  The convergence is synaptic. NLGN3, NRXN1, DLG4 (PSD-95), DLG2 and CTNND2
  carry postsynapse organization and postsynaptic-density annotations; BAIAP2,
  LIMK1, PAK2, CYFIP1 and FLNA are actin regulators, which Gilman place at the
  centre of dendritic spine remodelling; DCC adds axon guidance. Two caveats.
  First, GO coherence is partly built in: NETBAG's network uses shared GO
  annotation as one of its edge types, so a cluster it selects is expected to
  look GO-coherent, and synaptic terms are confirmatory here. Second, this set
  is one of three case studies Ballouz et al. used to show that enrichment
  results can be driven by highly annotated (multifunctional) genes: in their
  deposited ErmineJ run on these 44 genes, 16 GO groups pass FDR < 0.05 and
  none survive multifunctionality correction. Those runs, and the PAN-GO
  reanalysis, are recorded under published_analyses.
contexts:
  - term:
      id: MONDO:0005258
      label: autism spectrum disorder
    context_type: disease
    role_note: >-
      Genes in rare de novo CNVs from autistic children (Simons Simplex
      Collection, Levy et al. 2011) that NETBAG selects as one functionally
      connected cluster.
associations:
  - term:
      id: GO:0099173
      label: postsynapse organization
    aspect: biological_process
    category: core_process
    confidence: high
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    evidence:
      - reference: PMID:21658583
        reference_title: "Rare de novo variants associated with autism implicate a large functional network of genes involved in formation and function of synapses."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "The genes forming the network are primarily related to synapse development, axon targeting, and neuron motility."
        explanation: >-
          Gilman's own summary of the cluster puts synapse development first.
          In the full text, the GO categories most connected to it concern
          actin network dynamics, synaptogenesis, axonogenesis, cell-cell
          adhesion, small GTPase signalling and neurite development.
    curator_note: >-
      Carried by CHRNA7, CRKL, CTNND2, DLG2, DLG4, NLGN3 and NRXN1 (7/44 vs
      104 annotated genes; all-GOA Fisher, per-set Bonferroni p = 6.0e-7). Also
      recovered with IBA annotations alone (CTNND2, DLG4, NLGN3, NRXN1;
      p = 1.6e-5), the only specific process that survives under
      IBA, and the PAN-GO reanalysis reports postsynapse organization among
      its six groups. Confirmatory: the synaptic hypothesis is what Gilman set
      out to test, and NETBAG partly uses GO to build the cluster.
  - term:
      id: GO:0014069
      label: postsynaptic density
    aspect: cellular_component
    category: core_component
    confidence: high
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      BAIAP2, CTNND2, DCC, DLG2, DLG4, ITPR1 and PAK2 (7/44 vs 356; per-set
      Bonferroni p = 3.1e-3 under all-GOA; 3 genes and not significant under
      IBA). It misses the benchmark's stricter matrix-wide correction over all
      evaluable sets. Gilman
      also report that the cluster connects strongly to proteins from human
      neocortex PSD proteomics. The scaffold DLG4 (PSD-95) and DLG2 and the
      spine regulators BAIAP2 and PAK2 are the component's core.
  - term:
      id: GO:0048812
      label: neuron projection morphogenesis
    aspect: biological_process
    category: supporting_process
    confidence: medium
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      BAIAP2, CHRNA7, CTNND2, CYFIP1, DCC, DLG4, NLGN3, NRXN1 and PRKG1 (9/44
      vs 383; per-set Bonferroni p = 8.9e-6 under all-GOA; 3 genes, not
      significant, under IBA). Covers Gilman's axonogenesis and neurite-development themes;
      DCC, the netrin receptor, is their axon-guidance example.
  - term:
      id: GO:0030036
      label: actin cytoskeleton organization
    aspect: biological_process
    category: supporting_process
    confidence: medium
    specificity: broadly_expressed
    seed_source: curator_added
    recovery_status: annotation_supported
    insight: mechanistic
    curator_note: >-
      Gilman's mechanistic synthesis: the network's signalling pathways
      (Rho-family GTPases, WNT, reelin, mTOR) converge on actin network
      growth and branching, which drives dendritic spine remodelling. Members
      annotated to the term are BAIAP2, FLNA, LIMK1, MYH11, NPHP1 and SPTAN1
      (4 under IBA), not enough to reach significance in a term of this size
      (per-set Bonferroni p = 0.62), so enrichment does not recover it. PAK2 and CYFIP1, which Gilman also
      place in the actin pathway, are not annotated to the term. The more
      specific spine terms (regulation of dendritic spine morphogenesis,
      dendritic spine organization) are carried by one to three members only.
      Mechanistic because actin regulation is not implied by the set's
      construction from autism CNVs.
  - term:
      id: GO:0098609
      label: cell-cell adhesion
    aspect: biological_process
    category: supporting_process
    confidence: medium
    specificity: broadly_expressed
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      BAIAP2, CTNNA3, CTNND2, DCC, DLG2, DLG4, FLNA, NLGN3, NPHP1 and NRXN1
      (10/44 vs 533; per-set Bonferroni p = 7.5e-6 under all-GOA; 6 genes,
      p = 3.3e-3, under IBA). The adhesion that matters here is trans-synaptic, the
      neurexin-neuroligin contact (NRXN1, NLGN3) that Gilman describe as
      mediating the first axon-dendrite contact, plus the catenins CTNNA3 and
      CTNND2. Listed among Gilman's top GO themes.
  - term:
      id: GO:0007611
      label: learning or memory
    aspect: biological_process
    category: marker_driven_plausible
    confidence: low
    specificity: lineage_shared
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    evidence:
      - reference: PMID:28204549
        reference_title: "Using predictive specificity to determine when gene set analysis is biologically meaningful."
        supports: REFUTE
        evidence_source: COMPUTATIONAL
        snippet: "we stress that the enrichment of ‘learning and memory’ in the first place is not a statistical false positive; we prefer to think of it as non-robust and, most importantly, non-specific."
        explanation: >-
          Ballouz et al. show the term is driven by a few heavily annotated
          genes and drops out after multifunctionality correction.
    curator_note: >-
      The textbook multifunctionality artefact for this set. Ballouz et al.
      found it significant on this list in 2013 (deposited ErmineJ run: FDR
      0.028, corrected 1.0), and the PAN-GO reanalysis reports it under all GO
      annotations but not under PAN-GO. Members carrying it are CHRNA7, DLG4,
      MAPT, NLGN3 and NRXN1 (only NRXN1 under IBA). It is still significant
      with current all-GOA (5/44 vs 179; per-set Bonferroni p = 0.039), so
      the artefact persists, and it disappears under IBA. Plausible for autism as phenotype
      biology, but it describes organism-level behaviour rather than what the
      genes do, so it is kept as marker-driven and low confidence.
published_analyses:
  - reference: PMID:21658583
    reference_title: "Rare de novo variants associated with autism implicate a large functional network of genes involved in formation and function of synapses."
    analysis_role: original
    tool: NETBAG
    method: >-
      Not over-representation. For each of 1,454 MSigDB GO categories, the
      average background-network log-likelihood interaction between its genes
      and the cluster genes, with empirical p-values from random CNV sets of
      matched gene count and FDR across categories.
    annotation_source: MSigDB GO gene sets (2010-era) and a GO-derived likelihood network
    membership_size: 72
    membership_note: >-
      The GO characterization is reported for the two-genes-per-CNV cluster
      (Fig. 2B, 72 genes). This entry's membership is the one-gene-per-CNV
      cluster (Fig. 2A, 45 genes, 44 symbols after normalization).
    correction: FDR over GO categories (empirical p-values)
    summary: >-
      The 25 categories most strongly connected to the cluster concern actin
      network dynamics, synaptogenesis, axonogenesis, cell-cell adhesion,
      small GTPase signalling and neurite development. Gilman also note that
      plain over-representation of GO terms across all 433 CNV genes does not
      give the same result. These themes are the basis of the synaptic and
      actin associations above.
    snippet: "The genes forming the network are primarily related to synapse development, axon targeting, and neuron motility."
  - reference: PMID:28204549
    reference_title: "Using predictive specificity to determine when gene set analysis is biologically meaningful."
    analysis_role: reanalysis
    tool: ErmineJ 3.0
    method: Over-representation analysis of GO groups, as described in the paper's case study.
    annotation_source: GO (ErmineJ Generic_human annotations, 2013)
    annotation_date: "2013"
    membership_size: 70
    membership_note: >-
      The paper text describes a 70-gene hit list, which matches the larger
      two-genes-per-CNV cluster rather than this entry's 44 genes. The
      deposited ErmineJ files are for the 44-gene cluster (next entry).
    correction: Benjamini-Hochberg FDR; then multifunctionality correction
    significance_threshold: 0.05
    n_significant: 30
    significant_unit: GO groups
    summary: >-
      The list is strongly biased toward multifunctional genes (MF score
      0.86). Removing the 11 most multifunctional genes down-weights learning
      or memory (four of its six cluster genes have 186-289 GO annotations
      each) and lets neuron migration rise. Ballouz et al. argue such terms
      are non-specific rather than false positives.
    snippet: "Repeating their analysis using ErmineJ on their hit list of 70 genes, we arrive at a list of 30 GO gene sets (FDR < 0.05) similar but not identical to those reported."
    reported_terms:
      - reported_label: learning or memory
        term:
          id: GO:0007611
          label: learning or memory
        significant: true
        authors_stance: discounted
        note: Driven by four highly multifunctional genes; down-weighted after correction.
      - reported_label: neuron migration
        term:
          id: GO:0001764
          label: neuron migration
        authors_stance: highlighted
        note: >-
          Ranked 28th before correction and unaffected by it, so it rises;
          Ballouz et al. suggest it may be more relevant to autism than
          learning and memory.
