    confidence: medium
    specificity: cell_type_specific
    seed_source: curator_added
    recovery_status: membership_gap
    insight: confirmatory
    curator_note: >-
      The primary Paneth-cell phenotype of Atg16l1 deficiency is abnormal granule
      exocytosis (disorganised, diminished lysozyme granules). This is a cell
      biological defect and its machinery is not transcriptionally changed: no
      member is annotated to regulated exocytosis or its descendants, and the
      granule cargo genes (Lyz1, defensins) are not in the UP set. Recorded so the
      description of the context is complete; a membership gap.
