  label: Mus musculus
direction: UP
description: >-
  MSigDB mouse M2:CGP set (M5688) of ~120 genes up-regulated in ileal Paneth-cell
  enriched epithelium of Atg16l1 hypomorphic mice (Cadwell et al. 2008,
  PMID:18849966, Table 1S). ATG16L1 is a Crohn's disease risk gene and an essential
  autophagy protein; the expected readout of autophagy loss (Paneth granule
  exocytosis defects) is morphological and is not carried by this transcriptional
  set. Instead GO enrichment reveals the "unexpected gain of function" the authors
  describe: a lipid-handling programme (Apoa1, Apoa4, Apoc2, Mttp, Fabp1, Fabp4,
  Cd36, Lpl, Scarb1, Npc1l1, Dgat2, Cidec, Plin1, Plin4, Scd1), the adipocytokines
  leptin and adiponectin (Lep, Adipoq), and acute-phase reactants (Saa1, Saa2, Hp).
  Several of these are PPAR target genes. A small interferon-stimulated component
  (Isg15, Rsad2, Ifit1bl2) is also present, and some genes look like tissue
  carry-over (hemoglobins, Amy2b, Krt12).
