        snippet: "transcriptional analysis revealed an unexpected gain of function specific to ATG16L1-deficient Paneth cells including increased expression of genes involved in peroxisome proliferator-activated receptor (PPAR) signalling and lipid metabolism"
        explanation: >-
          The authors themselves identify the lipid-metabolism programme as the
          unexpected transcriptional consequence of Atg16l1 deficiency.
    curator_note: >-
      The headline enrichment (13/206, p ~3e-12; with the more specific
      regulation of plasma lipoprotein particle levels at p ~2e-15). Carriers in
      MGI GOA: Apoa4, Scd1, Bloc1s6, Etnppl directly; Apoa1, Apoc2, Dgat2, Fabp1,
      Fabp4, Lpl, Mttp, Npc1l1, Scarb1 via closure. Mechanistic: the perturbation is
      an autophagy gene, so a lipid-transport/storage signature is not entailed by
      construction and points to a metabolic (PPAR-linked) gain of function in
      autophagy-deficient Paneth cells.
