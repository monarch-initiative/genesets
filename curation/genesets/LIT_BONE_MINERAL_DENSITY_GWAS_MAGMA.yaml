  score_description: '-log10 of the MAGMA gene-based p-value (snp-wise mean model,
    1 kb windows, protein-coding genes; one-sided). Built by `curate build-ranking`
    from rankings/BONE_MINERAL_DENSITY_GWAS_MAGMA.recipe.yaml: of 19,629 atlas rows,
    258 mapped by their approved symbol after their Ensembl v92 id failed, 866 have
    no approved HGNC symbol, and 66 duplicate symbols kept the stronger score; 18,697
    genes ranked. Scored on -log10 p rather than ZSTAT because the KS running sum
    weights by |score|, which would treat strongly negative Z as signal.'
description: 'Genome-wide MAGMA gene ranking for heel ultrasound bone mineral density
  from Morris et al. 2019 (426,824 UK Biobank participants; PMID:30598549), as computed
  by the GWAS ATLAS. The scored counterpart of LIT:BONE_MINERAL_DENSITY_GWAS, from
  the same study. With 518 loci the signal is highly polygenic: Wilcoxon finds 283
  terms at q < 0.05 and unweighted KS (--weight 0) 181, but GSEA''s default weighted
  KS none. Weighting steps by -log10 p, which reaches 150 here, lets a few loci dominate
  every running sum, so random gene sets score as high as real ones; for p-value-derived
  scores use Wilcoxon or --weight 0. The interpretation is the established skeletal
  program: Wnt signalling (WNT16, SFRP4, LRP5, WLS), BMP signalling, ossification
  and chondrocyte differentiation. Osteoclast differentiation, with TNFRSF11A (RANK)
  and TNFSF11 (RANKL) in its leading edge, is only nominal and kept as curator-added.
  MAGMA gene p-values of neighbouring genes share SNPs and LD, and the gene-set tests
  here do not model that correlation, so a term carried by one locus is one finding,
  not many.'
