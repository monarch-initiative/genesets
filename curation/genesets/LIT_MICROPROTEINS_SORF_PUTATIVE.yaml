description: >-
  Putative human microproteins: Swiss-Prot entries of 100 aa or less that a
  rule-based classifier assigned to the sORF class but that UniProt does not
  support at the protein level (protein existence 2 to 5, mostly 5,
  "uncertain"). Membership comes from the ai-gene-review MICROPROTEINS census
  (projects/MICROPROTEINS/data/human_microproteins.tsv, ai4curation/ai-gene-review,
  census of 2026-09-30, from UniProt REST), class "sORF-class microprotein,
  putative (no protein-level evidence)", 125 entries. The 19 entries without a
  gene symbol were dropped, leaving 106 symbols, of which 37 carry a GOA
  annotation on a UniProtKB protein after protein-binding rows are dropped.
  Most members are ORFs annotated in lncRNAs (LINC*, *-AS1, *-DT), pseudogene
  products (SNRPGP15, PMCHL1, PMCHL2, DPH3P1, PIN1P1, PSPHP1) and short
  uncharacterized ORFs; none of them has a demonstrated function. There is
  therefore no core biology to recover: this set is a NEGATIVE CONTROL, the
  putative pole of SERIES:MICROPROTEIN_EVIDENCE whose other pole is
  LIT:MICROPROTEINS_SORF_PROTEIN_EVIDENCE. Its value is in what a method should
  NOT report. Enrichment of the membership against human GOA (UniProtKB
  background, 2026-07-26 GO release, GOA current on 2026-11-26) finds nothing
  significant after Bonferroni under the all, IBA-only or IBA+IEA variants. Every
  nominal hit, however, is carried by the same two genes, PMCHL1 and PMCHL2,
  through melanin-concentrating hormone terms (p = 1.1e-5; Bonferroni-adjusted
  0.12 under IBA-only). These are inherited by phylogenetic propagation (IBA
  from a PANTHER node seeded by rat Pmch) and by InterPro2GO from a prepro-MCH
  signature onto two primate pseudogene copies of PMCH that lack a signal
  peptide and for which no protein has been detected. The ai-gene-review
  MICROPROTEINS Tier 3 audit removed all 13 of their GO rows. The set is
  therefore a precision test for evidence variants: one that keeps IBA/IEA
  propagation onto PE5 pseudogene products is liable to report these terms, and a
  review-pruned variant should not. A second hazard, too small to reach even
  nominal significance, is SNRPGP15, an SNRPG pseudogene with 13 IBA
  spliceosome terms.
