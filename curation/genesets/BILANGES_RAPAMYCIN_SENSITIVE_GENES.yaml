gene_set_id: MSIGDB:BILANGES_RAPAMYCIN_SENSITIVE_GENES
gene_set_name: BILANGES_RAPAMYCIN_SENSITIVE_GENES
collection: M2:CGP
msigdb_release: v2025.1.Mm
taxon:
  id: NCBITaxon:10090
  label: Mus musculus
direction: DN
description: >-
  MSigDB mouse M2:CGP set (M2329) of 41 mRNAs whose serum-stimulated recruitment to
  polysomes in mouse embryo fibroblasts is blocked by rapamycin (Bilanges et al.
  2007, PMID:17562867, Table 3S). It is a translational (polysome-profiling), not a
  transcriptional, signature of mTORC1 inhibition. GO enrichment recovers the
  mechanism directly: the strongest signal is cytosolic ribosomal proteins (Rpl11,
  Rpl22, Rpl23a, Rpl27, Rpl34, Rpl35, Rpl35a, Rps15), the classic 5'-terminal
  oligopyrimidine (TOP) mRNAs whose translation mTORC1 controls, so that mTORC1
  couples growth signalling to ribosome production. The remaining ~33 members are
  heterogeneous (Insig1, Acsl1, Polr1b, Smc2, Apex1, ...) and carry no coherent
  GO signal. The ribosomal-protein genes also generate artefactual hits via
  moonlighting annotations (myoblast fusion, synaptic translation), useful
  negative controls.
