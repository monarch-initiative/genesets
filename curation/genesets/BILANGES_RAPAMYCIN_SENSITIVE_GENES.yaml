    evidence:
      - reference: PMID:17562867
        reference_title: "Tuberous sclerosis complex proteins 1 and 2 control serum-dependent translation in a TOP-dependent and -independent manner."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Serum-responsive mRNAs that are sensitive to inhibition by rapamycin are highly enriched for terminal oligopyrimidine and for very short 5' and 3' untranslated regions."
        explanation: >-
          TOP mRNAs are predominantly those encoding ribosomal proteins, so the
          ribosome enrichment is the GO-visible signature of TOP-dependent,
          mTORC1-controlled translation.
    curator_note: >-
      Top hit in a GOA-mouse run (7/62, p ~3e-12): Rpl11, Rpl22, Rpl23a, Rpl27,
      Rpl34, Rpl35, Rpl35a, all directly annotated. Marked mechanistic although
      "ribosome" is usually a housekeeping hit: here the set is defined by
      rapamycin-sensitive translation, and recovering ribosomal-protein mRNAs is
      exactly the evidence that mTORC1 acts through TOP-mRNA translation. In this
      context it is the mechanism, not background.
