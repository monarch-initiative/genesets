    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      The process the TOP-mRNA-encoded ribosomal proteins serve (8/213, p ~6e-10): the seven Rpl genes plus Rps15. Confirmatory relative to the
      component term: it restates that the targets are translation machinery.
  - term:
      id: GO:1901740
      label: negative regulation of myoblast fusion
    aspect: biological_process
    category: false_association
    confidence: high
    specificity: ubiquitous
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    curator_note: >-
      Significant (6/51, p ~1e-10) only because Rpl11, Rpl23a, Rpl27, Rpl34,
      Rpl35 and Rpl35a carry direct annotations to this term in MGI GOA (from an
      extra-ribosomal-function study). Nothing about fibroblast translation
      control implies myoblast fusion; an annotation-driven artefact and a useful
      negative control for methods that report specific-sounding child terms.
  - term:
      id: GO:0140236
      label: translation at presynapse
    aspect: biological_process
    category: false_association
    confidence: high
    specificity: ubiquitous
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    curator_note: >-
      SynGO-style annotations of ribosomal proteins (Rpl22, Rpl23a, Rpl27, Rpl34,
      Rpl35, Rpl35a) make this term significant (6/47, p ~6e-11) in embryonic
