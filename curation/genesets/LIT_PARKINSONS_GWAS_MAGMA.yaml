description: Genome-wide MAGMA gene ranking for Parkinson's disease from the Nalls
  et al. 2019 meta-analysis (PMID:31701892), in its public IPDGC release without 23andMe
  (33,674 cases, 449,056 controls), as computed by the GWAS ATLAS. The scored counterpart
  of LIT:PARKINSONS_GWAS_GENES, from the same study. SNCA dominates (P = 3e-33), and
  GSEA's weighted KS, which concentrates on the top of the ranking, returns nine significant
  terms that SNCA alone can carry; only those with several independent loci in the
  leading edge are read as biology. Wilcoxon finds only the HLA class II block. The
  interpretation is synaptic-vesicle trafficking and alpha-synuclein aggregation,
  with the lysosomal and endocytic CORE of the gene-set entry present at nominal significance
  (TMEM175, LRRK2, GBA1, VPS35; GAK, SH3GL2). MAGMA gene p-values of neighbouring
  genes share SNPs and LD, and the gene-set tests here do not model that correlation,
  so a term carried by one locus is one finding, not many.
