  evidence:
  - reference: PMID:43058136
    reference_title: Growth and molecular responses of potato to lunar regolith simulants.
    snippet: Whole-transcriptome profiling of leaves revealed that each simulant elicited a distinct pattern of
      gene expression changes, indicating that the type and intensity of regolith-induced stress is substrate-dependent.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    explanation: OPRH4W30 produced the smallest DEG set (124) of the four simulants profiled.
  curator_note: Nine PAL paralogues (03G011440-03G011490, 09G005690-09G005710, 10G020990), log2FC -0.6 to -1.4.
    This is the entry step of phenylpropanoid synthesis, named as the process it performs, and the strongest single
    signal in this small set.
