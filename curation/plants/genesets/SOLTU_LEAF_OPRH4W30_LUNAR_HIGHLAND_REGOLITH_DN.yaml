  - reference: PMID:16357201
    reference_title: Jasmonate-inducible plant enzymes degrade essential amino acids in the herbivore midgut.
    snippet: We show that two JIPs, arginase and threonine deaminase (TD), act in the M. sexta midgut to catabolize
      the essential amino acids Arg and Thr, respectively.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    explanation: Threonine deaminase, down 8.5 log2 here, is a JA-inducible anti-nutritive defence enzyme in Solanaceae,
      acting alongside the proteinase inhibitors.
  curator_note: 'The effector mechanism of the JA module: inhibiting herbivore digestive proteases. Only the three
    Kunitz inhibitors (03G018510, 03G018520, 03G023520) carry this BP (3/31, nominal p = 5e-5). Three potato inhibitor
    I genes (09G025890/940/950, -4 to -5.4), two type II inhibitors (03G023580, 03G023620, which have no GO annotation
    at all) and two cystatins (06G028910 at -7.9, 06G028940) are in the set too, but lack it. Alongside them sit
    threonine deaminase (09G004660, -8.5) and leucine aminopeptidase (12G027320, -7.4), the tomato JA-inducible
    anti-nutritive enzymes, which GO annotates only to Thr catabolism and proteolysis.'
