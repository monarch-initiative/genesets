  label: Brachypodium distachyon
direction: UP
n_genes: 34
description: The Brachypodium distachyon root arbuscular mycorrhizal (AM) endosymbiosis, strigolactone
  rhizosphere hyphal-branching signal synthesis, common symbiosis signaling pathway (SYMRK/DMI2, CCaMK/DMI3,
  CYCLOPS/IPD3), and periarbuscular membrane phosphate (BdPT4/PT11) and ammonium (BdAMT2) nutrient-exchange
  module (Hong et al. 2012 Plant Cell PMID:22669881; brachypodium-Glomus intraradices symbiosis; Bravo
  et al. 2016 New Phytol PMID:26749197). Unlike Arabidopsis thaliana (a non-mycorrhizal Brassicaceae species
  that lost the AM host gene toolkit), bioenergy grasses (Brachypodium, switchgrass, sorghum) and poplar
  form obligate arbuscular mycorrhizal symbioses critical for low-input phosphorus and nitrogen acquisition
  on marginal soils.
