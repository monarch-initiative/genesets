description: The Arabidopsis thaliana secondary cell wall transcriptional network and biosynthetic effector
  regulon active in xylem vessels and interfascicular fibers (Taylor-Teeples et al. 2015 Nature PMID:25533953;
  Zhong et al. 2008 Plant Cell PMID:18952777). Comprises first-tier NAC master switches (VND6, VND7, NST1,
  NST2, SND1/NST3), second-tier MYB/NAC regulators (MYB46, MYB83, MYB58, MYB63, MYB103, SND2, SND3, KNAT7),
  secondary-wall cellulose synthase complex subunits (CESA4/IRX5, CESA7/IRX3, CESA8/IRX1, COBL4/IRX6,
  KOR1), glucuronoxylan biosynthetic enzymes (IRX7/FRA8, IRX8/GAUT12, IRX9, IRX10, IRX14, IRX15, IRX15-L,
  GUX1, GUX2, RWA1), and monolignol/lignin polymerization enzymes (PAL1, C4H, 4CL1, HCT, C3H1, CCOAOMT1,
  CCR1, F5H1, COMT1, CAD4, CAD5, LAC4/IRX12, LAC17).
