  label: Sorghum bicolor
direction: UP
series: SERIES:SORBI_STEM_CARBON_PARTITIONING
series_role: stem_soluble_sucrose
n_genes: 31
description: The Sorghum bicolor sweet-sorghum stem internode sucrose biosynthesis (SPS, SPP), reversible
  cleavage (SUS), apoplastic phloem unloading (SbSUT1, SbSUT2, SbSUT4, SWEET), and vacuolar tonoplast
  sugar storage (SbTST1, SbTST2) module (Bihmidine et al. 2015 Front Plant Sci PMID:26904046; McKinley
  et al. 2016 Plant J PMID:27132116; Brenton et al. 2016 Genetics PMID:27356614). Contrasts with SORBI_BM_MONOLIGNOL_CELL_WALL
  in SERIES:SORBI_STEM_CARBON_PARTITIONING. Whereas grain/forage sorghums partition stem carbon into insoluble
  lignocellulosic secondary cell walls or starch, sweet sorghum cultivars (e.g. Rio, Della, Wray) accumulate
  molar concentrations of soluble fermentable sucrose in stem parenchyma vacuoles for direct bioethanol
  and bioproduct fermentation.
