  evidence:
  - reference: PMID:20023196
    reference_title: 'Towards a systems approach for lignin biosynthesis in Populus trichocarpa: transcript
      abundance and specificity of the monolignol biosynthetic genes.'
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    explanation: Vascular plants do not catabolize or depolymerize lignin in secondary xylem; instead,
      plant xylem laccases polymerize monolignols into lignin. GO:0046274 (lignin catabolic process) is
      a classic InterPro2GO/UniRule IEA over-projection from wood-rot fungal degradative laccases onto
      plant multicopper laccases.
  curator_note: 'Signature non-model plant IEA domain-projection error: all 10 Populus xylem laccases
    carry IEA annotations to GO:0046274 (lignin catabolic process, p_adj=4.41e-21 in all and iba_iea),
    whereas PANTHER IBA-only cleanly avoids it.'
