description: The Populus trichocarpa (black cottonwood) developing secondary xylem monolignol biosynthesis
  and apoplastic laccase polymerization program (Shi et al. 2010 Plant Cell PMID:20023196; Wang et al.
  2018 Plant Cell PMID:29967048; Sundell et al. 2017 New Phytol PMID:28493306). Contrasts with POPTR_TENSION_WOOD_G_LAYER
  in SERIES:POPTR_WOOD_FORMATION. Comprises the complete wood-expressed monolignol enzymatic pathway —
  PAL (5 paralogs), C4H (2), 4CL (3), HCT (2), C3H, CCoAOMT (3), CCR, F5H/CAld5H (2), COMT (2), and CAD
  (2) — together with apoplastic monolignol-oxidizing laccases (10 paralogs) and secondary-wall MYB regulators.
