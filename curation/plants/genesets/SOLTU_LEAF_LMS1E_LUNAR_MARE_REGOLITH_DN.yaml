series_role: lms1e_mare_down
n_genes: 831
description: 'Genes down-regulated in leaves of potato grown in the lunar mare simulant LMS-1E versus Adkins soil;
  831 of the 1,397 LMS-1E DEGs. Two programmes dominate. (1) Growth and cell-wall synthesis: CESA4, CSLG, COBRA-like,
  DUF828/TBL, expansins EXPA4/6/15 and DIM/DWF1, matching the reduced canopy. (2) The jasmonate wound-defence module,
  strongly lower in regolith than in soil: potato type I and II proteinase inhibitors, Kunitz trypsin inhibitors,
  cystatins, JAZ1, AOS, AOC and 13-LOX. The lower JA module is shared with the LHS-1E and OPRH4W30 lists (JAZ1 Soltu.DM.12G008980
  down 5.5-8.6 log2 in all three), so lunar regolith did not raise leaf wound signalling relative to soil. Source:
  Data S5 of Handy et al. 2026 (npj Microgravity, PMID:43058136), DESeq2 padj < 0.05, upper-canopy leaves at 39
  DAP, n = 5 per substrate, all substrates amended with 5% v/v vermicompost plus Osmocote. Direction: Data S5 does
  not state the sign convention; log2FoldChange is read as regolith relative to Adkins (DESeq2 default reference,
  alphabetically first level ADK). This is confirmed by the copper switch tracking the measured copper: FSD1 falls
  and CSD1/CSD2 rise most in JSC-1A, the simulant with significantly higher tuber Cu (Table 1). Gene ids are DM
  v6.1 (Soltu.DM) as in the paper; GO enrichment uses the SpudDB DM v6.1 GO annotation (TAIR best-hit projection,
  all IEA, the annotation the authors used), with the annotated genome as background because only DEGs were released.'
