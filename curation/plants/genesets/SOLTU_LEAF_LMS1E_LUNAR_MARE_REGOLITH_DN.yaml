    Kunitz (03G018450, 03G018670), JAZ1 (12G008980), JAZ-like (08G007100), AOS (07G016990, 11G023180), 13-LOX (01G002140,
    08G005470/80), MYC2-like bHLH (10G005280), CYP94B. All are lower in regolith than in soil. The authors suggested
    glassy particles abrade tissues, which would predict wound signalling rising in regolith; the leaves show the
    opposite.'
