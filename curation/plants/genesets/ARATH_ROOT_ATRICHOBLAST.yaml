    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    explanation: Root atrichoblasts do not form branched aerial trichomes; GO:0010091 (trichome branching)
      is enriched in full GAF because GL2, GL3, EGL3, TTG1, TTG2, TRY, CPC, ETC1, and MYB23 are pleiotropically
      reused in shoot leaf trichome development.
  curator_note: 'Classic pleiotropic organ-reuse trap in plants: the same MBW (MYB-bHLH-WD40) module specifies
    non-hair cells in roots and branched trichomes in leaves. Enriched in all (p_adj=2.66e-12), avoided
    by iba_iea and iba.'
