description: Transcriptional and epidermal barrier program of the Arabidopsis thaliana non-hair (atrichoblast,
  N-position) root epidermal cell lineage (Bruex et al. 2012 PLoS Genet PMID:22291601; Ryu et al. 2019
  Plant Physiol PMID:30842268; Denyer et al. 2019 Dev Cell PMID:30910786). Contrasts with ARATH_ROOT_HAIR_TRICHOBLAST
  in SERIES:ARATH_ROOT_EPIDERMIS. Comprises the WER-GL3/EGL3-TTG1-GL2 regulatory complex, lateral-inhibition
  R3 MYBs (CPC, TRY, ETC1), receptor kinase SCM, and the GL2-regulated root surface lipid/cutin/wax biosynthetic
  enzymes (FDH/KCS10, KCS1, KCS6, CER1, CER2, CER3, CER4, LACS1, LACS2, GPAT4, GPAT8, DCR, Mah1).
