description: The Arabidopsis thaliana cell-surface pattern-triggered immunity (PTI) receptor, RLCK, MAPK/CDPK,
  and WRKY/indolic-phytoalexin early transcriptional response module (Bjornson et al. 2021 Nat Plants
  PMID:33723397; Zipfel et al. 2004 Nature PMID:15085136). Contrasts with ARATH_SAR_SALICYLIC_ACID_IMMUNITY
  in SERIES:ARATH_IMMUNE_SIGNALING. Includes surface PRRs and coreceptors (FLS2, EFR, CERK1, LYK5, LORE,
  WAK1, BAK1, BKK1, SOBIR1), receptor-like cytoplasmic kinases (BIK1, PBL1, BSK1), NADPH oxidase and calcium
  channels (RBOHD, CNGC2, CNGC4), MAPK and CDPK cascades (MEKK1, MKK4, MKK5, MPK3, MPK4, MPK6, CPK4, CPK5,
  CPK6, CPK11), defense WRKYs (WRKY22, WRKY29, WRKY33, WRKY40, FRK1), and camalexin/indole-glucosinolate
  phytoalexin enzymes (CYP71A13, CYP71B15/PAD3,CYP79B2, CYP79B3, PEN2, PEN3).
