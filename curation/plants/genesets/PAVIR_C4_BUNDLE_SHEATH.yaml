description: C4 dicarboxylate decarboxylation and Calvin-Benson-Bassham refixation program in Kranz bundle
  sheath cells of the NAD-ME C4 bioenergy grass Panicum virgatum (switchgrass) (Rao et al. 2016 Plant
  Physiol PMID:27099212; Lovell et al. 2021 Nature PMID:33505029). Contrasts with PAVIR_C4_MESOPHYLL in
  SERIES:PAVIR_C4_KRANZ. Imported C4 acids are decarboxylated in bundle sheath mitochondria by NAD-dependent
  malic enzyme (NAD-ME) and cytosolic PEPCK to concentrate CO2 around bundle-sheath-restricted RuBisCO
  (RBCS), RuBisCO activase (RCA), PRK, PGK, and SBPase/FBPase for Calvin-Benson-Bassham carbon assimilation.
