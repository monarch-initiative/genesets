  evidence:
  - reference: PMID:27099212
    reference_title: Comparative transcriptomics of C4 photosynthesis in switchgrass (Panicum virgatum).
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    explanation: In C4 bundle sheath cells, PEPCK decarboxylates OAA to supply CO2 to RuBisCO while chloroplastic
      PGK and FBPase/SBPase drive the photosynthetic Calvin cycle, not heterotrophic gluconeogenesis from
      lipid/protein reserves.
  curator_note: 'IEA pathway-context error: UniRule/InterPro IEA maps PEPCK, PGK, and FBPase/SBPase to
    GO:0006094 (gluconeogenesis, 14/34 genes, p_adj=2.66e-24 in all and iba_iea) without distinguishing
    photosynthetic carbon assimilation from heterotrophic gluconeogenesis.'
