description: The Arabidopsis thaliana abscisic acid (ABA) biosynthesis, PYR/PYL-PP2C-SnRK2 core signaling,
  and ABF/AREB transcriptional drought-response module (Cutler et al. 2010 Annu Rev Plant Biol PMID:20192755;
  Song et al. 2016 Science PMID:27846570). Contrasts with ARATH_CBF_COLD_ACCLIMATION in SERIES:ARATH_ABIOTIC_STRESS.
  Includes ABA biosynthetic enzymes (NCED3, ABA1, ABA2, ABA3, AAO3), START-domain ABA receptors (PYR1,
  PYL1, PYL2, PYL4, PYL5, PYL8), clade A PP2C coreceptors/phosphatases (ABI1, ABI2, HAB1, HAB2, AHG1,
  AHG3/PP2CA, HAI1, HAI2, HAI3), subclass III SnRK2 kinases (SnRK2.2, SnRK2.3, SnRK2.6/OST1), ABRE-binding
  bZIP transcription factors (ABF1, ABF2/AREB1, ABF3, ABF4/AREB2, ABI5), and canonical ABA-induced drought
  effectors (RD29B, RAB18, RD22,HAI1, RCAR/PYL).
