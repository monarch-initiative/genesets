description: The Thlaspi arvense (field pennycress) developing seed fatty acid elongation (FAE1/KCS18
  erucic acid pathway), Kennedy-pathway triacylglycerol (TAG) assembly, and oil-body oleosin storage program
  (Dorn et al. 2015 Plant J PMID:25641109; Chopra et al. 2020 Plant Direct PMID:32128489; Nunn et al.
  2022 Nat Commun PMID:35610221). Contrasts with THLAR_GLUCOSINOLATE_BIOSYNTHESIS in SERIES:THLAR_SEED_DOMESTICATION.
  Pennycress is a winter annual Brassicaceae oilseed cover crop producing >30% seed oil rich in erucic
  acid (C22:1) for sustainable aviation biofuel, or low-erucic edible oil when FAE1 is knocked out.
