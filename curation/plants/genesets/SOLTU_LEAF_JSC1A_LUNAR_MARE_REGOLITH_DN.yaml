  evidence:
  - reference: PMID:19122104
    reference_title: SQUAMOSA Promoter Binding Protein-Like7 Is a Central Regulator for Copper Homeostasis in Arabidopsis.
    snippet: SPL7 is also required for the expression of multiple microRNAs, miR397, miR408, and miR857, involved
      in copper homeostasis and of genes encoding several copper transporters and a copper chaperone, indicating
      its central role in response to copper deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    explanation: COPT transporters, the CCH chaperone and FSD1 are SPL7 targets induced under Cu deficiency; their
      coordinated drop indicates Cu sufficiency.
  - reference: PMID:43058136
    reference_title: Growth and molecular responses of potato to lunar regolith simulants.
    snippet: Heavy metals, including Cu, Zn, and Al, were modestly elevated in tubers from certain LRS treatments,
      warranting continued monitoring in future studies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    explanation: Cu was significantly elevated in tubers of JSC-1A plants (Table 1).
  curator_note: COPT1 (06G003660, -3.2), COPT5-like (02G021950) and CCH (11G006190, -1.3); 3/16, nominal p = 0.002.
    These, with FSD1 (06G012170, -4.1; 06G012180), are the SPL7-activated copper-deficiency genes. All falling means
    the SPL7 regulon is off and the leaf is copper-replete. FSD1 carries no copper-homeostasis annotation, so part
    of the signal sits outside the term.
