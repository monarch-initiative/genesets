    explanation: JSC-1A plants had reduced canopy and tuber yield relative to soil.
  curator_note: 'Ten LHC antenna genes: eight LHCA/LHCB-like (02G014000-02G014050, 03G000820/30/900) and two LHCB
    (07G024910, 12G029100), log2FC -0.5 to -2.0. Reduced antenna expression fits the smaller, stressed canopy of
    JSC-1A plants.'
