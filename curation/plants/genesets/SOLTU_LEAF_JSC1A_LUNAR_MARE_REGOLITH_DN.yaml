description: 'Genes down-regulated in leaves of potato grown in the lunar mare simulant JSC-1A versus Adkins soil;
  527 of 958 JSC-1A DEGs. Light-harvesting antenna genes (LHCA/LHCB) and a phenylalanine ammonia-lyase (PAL) gene
  cluster are lower, as is the copper-deficiency half of the SPL7 switch: FSD1 (-4.1 log2), the high-affinity copper
  transporters COPT1 and COPT5, and the copper chaperone CCH. With CSD1/CSD2 up in the paired UP set, this is a
  copper-replete leaf, matching the significantly raised tuber Cu of JSC-1A plants. Source: Data S5 of Handy et
  al. 2026 (npj Microgravity, PMID:43058136), DESeq2 padj < 0.05, upper-canopy leaves at 39 DAP, n = 5 per substrate,
  all substrates amended with 5% v/v vermicompost plus Osmocote. Direction: Data S5 does not state the sign convention;
  log2FoldChange is read as regolith relative to Adkins (DESeq2 default reference, alphabetically first level ADK).
  This is confirmed by the copper switch tracking the measured copper: FSD1 falls and CSD1/CSD2 rise most in JSC-1A,
  the simulant with significantly higher tuber Cu (Table 1). Gene ids are DM v6.1 (Soltu.DM) as in the paper; GO
  enrichment uses the SpudDB DM v6.1 GO annotation (TAIR best-hit projection, all IEA, the annotation the authors
  used), with the annotated genome as background because only DEGs were released.'
