description: The Populus trichocarpa winter-chilling-induced dormancy release, gibberellin (GA) biosynthesis
  and signaling, glycoside hydrolase family 17 (GH17) 1,3-beta-glucanase plasmodesmatal callose-plug degradation,
  and cyclin/CDK meristem reactivation program (Rinne et al. 2011 Plant Cell PMID:21282524; Singh et al.
  2018 Plant Cell PMID:30150313; Conde et al. 2019 New Phytol PMID:30536606). Contrasts with POPTR_AUTUMN_BUD_DORMANCY_ABA
  in SERIES:POPTR_SEASONAL_BUD_DORMANCY. Prolonged winter chilling represses SVL/ABA and induces GA1/GA4
  biosynthesis and GH17 beta-1,3-glucanases that hydrolyze plasmodesmatal callose sphincters, reopening
  symplastic transport of FT1 to trigger spring bud flush.
