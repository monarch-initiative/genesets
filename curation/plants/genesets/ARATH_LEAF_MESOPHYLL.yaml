description: Photosynthetic light-harvesting, thylakoid electron transport, and Calvin-Benson-Bassham
  carbon assimilation program of Arabidopsis thaliana leaf mesophyll cells (Kim et al. 2021 Plant Cell
  PMID:33793811; Lopez-Anido et al. 2021 Dev Cell PMID:33823130). Contrasts with ARATH_LEAF_GUARD_CELL
  in SERIES:ARATH_LEAF_CELL_TYPES. Includes LHCII/LHCI antenna proteins (LHCB1.1-1.3, LHCB2.1, LHCB3,
  LHCB4.1, LHCB5, LHCB6, LHCA1-4), photosystem core and OEC subunits (PSAD-1, PSAE-1, PSAF, PSAH-1, PSAK,
  PSAL, PSBO1, PSBO2, PSBP-1, PSBQ-2, PSBR), and Calvin-cycle enzymes (RBCS1A, RBCS1B, RBCS2B, RBCS3B,
  RCA, GAPA-2, GAPB, PRK, SBPase, FBA1).
