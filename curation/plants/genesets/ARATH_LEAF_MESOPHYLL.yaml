  evidence:
  - reference: PMID:33793811
    reference_title: Single-cell RNA-seq analysis in Arabidopsis leaf tissues reveals distinct cell-type
      programs.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    explanation: Chloroplast antenna proteins, OEC subunits, and RuBisCO/Calvin-cycle enzymes are not
      bona fide mRNA-binding regulators; GO:0003729 (mRNA binding) is enriched in full TAIR GAF due to
      high-throughput UV-crosslinking RNA-interactome proteomics capturing hyper-abundant leaf proteins.
  curator_note: 'Classic plant proteomics abundance artifact: hyper-abundant photosynthetic proteins (RBCS,
    GAPA-2, GAPB, FBA1, LHCB, PSBO1/2) co-purify in whole-leaf mRNA interactome screens and receive HDA/IDA
    annotations to GO:0003729 in all (19/32 genes, p_adj=1.40e-12), completely eliminated by iba_iea and
    iba.'
