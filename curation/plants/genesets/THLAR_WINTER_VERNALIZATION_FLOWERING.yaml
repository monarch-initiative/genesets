  label: Thlaspi arvense
direction: UP
n_genes: 33
description: The Thlaspi arvense (field pennycress) winter-annual vernalization requirement, epigenetic
  Polycomb/chromatin silencing of FLOWERING LOCUS C (TaFLC), photoperiodic CO-FT-SOC1-AP1 floral transition,
  and cold-hardiness dehydrin module (Dorn et al. 2018 Biotechnol Biofuels PMID:29371883; Geng et al.
  2021 Plant Physiol PMID:34618056; Nunn et al. 2022 Nat Commun PMID:35610221). Winter vs spring growth
  habit (controlled by loss-of-function mutations in TaFLC or FRI) and early spring flowering time are
  critical agronomic traits enabling pennycress to fit as a winter cash cover crop between autumn corn
  harvest and spring soybean planting in the US Midwest Corn Belt.
