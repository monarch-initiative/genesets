collection: LIT:PLANT_CELL_TYPE
taxon:
  id: NCBITaxon:3702
  label: Arabidopsis thaliana
direction: UP
n_genes: 30
description: Transcriptional and apoplastic barrier program of the Arabidopsis thaliana root endodermis
  governing Casparian strip lignification and suberin lamellae deposition (Pfister et al. 2014 eLife PMID:25233276;
  Naseer et al. 2012 PNAS PMID:22645358; Ryu et al. 2019 Plant Physiol PMID:30842268). Includes the SHR-SCR-MYB36
  regulatory cascade, CASP1-5 membrane scaffolds, the SGN1-SGN3-CIF1/2 surveillance receptor pathway,
  localized lignin polymerization machinery (RBOHF, PER64, ESB1, LAC3), and endodermal suberin biosynthetic
  enzymes (GPAT5, ASFT, KCS2, KCS20, CYP86A1/HORST, CYP86B1, FAR1, FAR4, FAR5, ABCG2, ABCG6, ABCG20, MYB41).
