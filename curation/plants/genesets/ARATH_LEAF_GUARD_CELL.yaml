description: Stomatal lineage specification and mature guard cell aperture control program in Arabidopsis
  thaliana leaves (Bauer et al. 2013 Curr Biol PMID:23219726; Lopez-Anido et al. 2021 Dev Cell PMID:33823130;
  Kim et al. 2021 Plant Cell PMID:33793811). Contrasts with ARATH_LEAF_MESOPHYLL in SERIES:ARATH_LEAF_CELL_TYPES.
  Includes master bHLH/MYB stomatal transcription factors (SPCH, MUTE, FAMA, SCRM/ICE1, SCRM2, FLP, MYB88,MYB60),
  epidermal patterning peptides and receptors (EPF1, EPF2, TMM, ERL1), and guard-cell ion channels, CO2/ABA/blue-light
  signaling kinases, and turgor effectors (SLAC1, SLAH3, QUAC1/ALMT12, KAT1, KAT2, GORK, AKT1, AHA1, AHA2,
  OST1, HT1, BLUS1, PHOT1, PHOT2, GCA2, RBOHD, RBOHF).
