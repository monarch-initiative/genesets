description: The Arabidopsis thaliana salicylic acid (SA) and N-hydroxypipecolic acid (NHP) biosynthesis,
  EDS1-PAD4-NRG1/ADR1 helper-NLR, and NPR1-TGA systemic acquired resistance (SAR) transcriptional immunity
  module (Vlot et al. 2009 Annu Rev Phytopathol PMID:19400646; Hartmann et al. 2018 Cell PMID:29587148).
  Contrasts with ARATH_PTI_FLG22_IMMUNITY in SERIES:ARATH_IMMUNE_SIGNALING. Includes isochorismate SA
  synthesis and transport (ICS1/SID2, EDS5, PBS3), NHP systemic mobile signal synthesis (ALD1, SARD4,
  FMO1), upstream transcription factors (SARD1, CBP60g, WRKY18, WRKY54, WRKY70), lipase-like and helper-NLR
  nodes (EDS1, PAD4, SAG101, NDR1, ADR1, ADR1-L1, ADR1-L2, NRG1.1), SA receptors and TGA coactivators
  (NPR1, NPR3, NPR4, TGA1, TGA2, TGA5, TGA6), and canonical PR effectors (PR1, PR2/BGL2, PR5).
