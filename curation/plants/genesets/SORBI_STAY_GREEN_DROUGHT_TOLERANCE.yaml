gene_set_id: LIT:SORBI_STAY_GREEN_DROUGHT_TOLERANCE
gene_set_name: SORBI_STAY_GREEN_DROUGHT_TOLERANCE
collection: LIT:DOE_BER_BIOENERGY
taxon:
  id: NCBITaxon:4558
  label: Sorghum bicolor
direction: UP
n_genes: 33
description: The Sorghum bicolor post-flowering drought tolerance ('stay-green' Stg1-Stg4 canopy maintenance),
  ABA-SnRK2-ABF/DREB2osmotic/dehydrin stress protection, and cuticular wax / cutin ('bloom' glaucousness)
  water-conservation program (Borrell et al. 2014 New Phytol PMID:25041086; Varoquaux et al. 2019 PNAS
  PMID:31740602; Busta et al. 2021 New Phytol PMID:33421161). Sorghum is a premier dryland C4 bioenergy
  and grain crop whose ability to maintain photosynthetically active green leaves during terminal post-anthesis
  drought combines root/canopy water sparing, thick epicuticular wax crystals on leaf sheaths and culms,
  and cellular dehydrin/ABA osmoprotection.
