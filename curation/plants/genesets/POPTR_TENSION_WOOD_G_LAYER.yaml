description: The Populus trichocarpa tension wood gelatinous-layer (G-layer) crystalline cellulose, xyloglucan
  endotransglucosylase, fasciclin arabinogalactan protein, and UDP-glucose supply program induced in xylem
  fibers under gravitational/mechanical bending stress (Mizrachi et al. 2015 New Phytol PMID:25329758;
  Andersson-Gunneras et al. 2006 Plant J PMID:16412089). Contrasts with POPTR_SECONDARY_XYLEM_LIGNIN in
  SERIES:POPTR_WOOD_FORMATION. Tension wood suppresses monolignol/lignin synthesis and instead deposits
  a thick, non-lignified, highly crystalline cellulose G-layer via secondary-wall CESA4/7/8 paralogs,
  KORRIGAN endoglucanases, sucrose synthases (SUS) channeling carbon into UDP-glucose, xyloglucan endotransglucosylase/hydrolases
  (XTHs) stitching the G-layer to the S2 wall, and fasciclin-like AGPs (FLAs).
