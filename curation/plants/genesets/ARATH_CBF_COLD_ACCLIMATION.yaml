description: The Arabidopsis thaliana ICE1-CAMTA3-CBF1/2/3 (DREB1B/C/A) cold acclimation and freezing
  tolerance regulon (Park et al. 2015 Plant J PMID:25754474; Jia et al. 2016 New Phytol PMID:27159328;
  Thomashow 2010 Plant Physiol PMID:20592040). Contrasts with ARATH_ABA_DROUGHT_RESPONSE in SERIES:ARATH_ABIOTIC_STRESS.
  Includes upstream regulators (ICE1, ICE2, CAMTA3, SIZ1, HOS1, OST1, BZR1, ZAT12, DEAR1), the AP2/ERF
  master factors (CBF1/DREB1B, CBF2/DREB1C, CBF3/DREB1A, CBF4), and canonical cold-regulated (COR) dehydrin
  and cryoprotective targets (COR15A, COR15B, COR47, COR78/RD29A, KIN1, KIN2, LTI30, ERD10, GOLS3, DEAR1).
