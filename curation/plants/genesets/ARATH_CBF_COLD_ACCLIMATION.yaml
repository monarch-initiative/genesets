  evidence:
  - reference: PMID:20592040
    reference_title: 'Molecular basis of plant cold acclimation: insights gained from studying the CBF
      cold response pathway.'
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    explanation: The ICE1-CBF1/2/3 cold acclimation pathway is the classic ABA-independent abiotic stress
      signaling pathway; GO:0009737 (response to abscisic acid) is enriched in full GAF because downstream
      COR promoters (RD29A, COR47, KIN1, KIN2, ERD10) contain both ABA-independent DRE/CRT motifs and
      ABA-responsive ABRE motifs.
  curator_note: 'Contrasting pole trap against ARATH_ABA_DROUGHT_RESPONSE in SERIES:ARATH_ABIOTIC_STRESS:
    enriched in all (14/23 genes, p_adj=2.99e-09) due to dual-promoter COR target genes, but avoided by
    iba_iea and iba.'
