description: The Populus trichocarpa short-day photoperiodic growth cessation, abscisic acid (ABA) biosynthesis
  and PYR/PYL-PP2C-ABI3/SVL signaling, and callose synthase (CALS/GSL) plasmodesmatal-sealing autumn bud
  endodormancy program (Tylewicz et al. 2018 Science PMID:29519917; Singh et al. 2018 Plant Cell PMID:30150313;
  Rinne et al. 2011 Plant Cell PMID:21282524). Contrasts with POPTR_SPRING_BUD_FLUSH_CHILLING in SERIES:POPTR_SEASONAL_BUD_DORMANCY.
  In perennial boreal/temperate trees, autumn short days induce ABA accumulation and SVL (SHORT VEGETATIVE
  PHASE-LIKE), which upregulates 1,3-beta-D-glucan (callose) synthases to plug shoot apical meristem plasmodesmata
  and isolate the dormant bud from growth-promoting signals over winter.
