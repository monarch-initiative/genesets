n_genes: 35
description: The Panicum virgatum (switchgrass) autumnal shoot senescence, pheophorbide a oxygenase (PAO/SGR)
  chlorophyll breakdown, autophagic (ATG8/ATG9) chloroplast dismantling, glutamine/asparagine synthetase
  (GLN1/ASN1) nitrogen translocation, and belowground rhizome starch storage program (Palmer et al. 2017
  BMC Plant Biol PMID:28851290; Lovell et al. 2021 Nature PMID:33505029; Sarath et al. 2014 BioEnergy
  Res). Contrasts with PAVIR_TILLER_AXILLARY_BUD_OUTGROWTH in SERIES:PAVIR_PERENNIAL_BIOMASS_ARCHITECTURE.
  Complete autumn nitrogen and mineral remobilization from aerial tillers to perennial rhizomes is critical
  both for multi-year stand persistence and for low-ash, low-NOx lignocellulosic biofuel feedstock quality.
