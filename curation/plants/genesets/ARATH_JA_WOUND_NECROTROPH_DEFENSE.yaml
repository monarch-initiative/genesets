      response, growth and development.'
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    explanation: LOX2/3/4/6, AOS (CYP74A), AOC1-4, OPR3, and ACX1 oxidatively cleave and beta-oxidize
      C18 alpha-linolenic acid into a C12 cyclopentanone hormone (jasmonic acid) rather than elongating
      or synthesizing long-chain aliphatic fatty acids (C13-C21; GO:0042759).
  curator_note: 'GO-ChEBI chemical ontology artifact: GO classifies jasmonic acid biosynthesis (GO:0009695)
    under long-chain fatty acid biosynthetic process (GO:0042759) and fatty acid biosynthetic process
    (GO:0006633), causing 12/34 oxylipin genes to enrich for fatty acid synthesis (p_adj=2.82e-22 in all
    and iba_iea).'
