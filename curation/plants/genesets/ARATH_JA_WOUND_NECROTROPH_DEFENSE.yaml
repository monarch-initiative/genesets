description: The Arabidopsis thaliana jasmonic acid (JA) / oxylipin biosynthesis, SCF-COI1-JAZ-MYC2/3/4
  wound and insect herbivory signaling, and ERF1/ORA59-PDF1.2 necrotrophic fungal defense regulon (Howe
  et al. 2018 Annu Rev Plant Biol PMID:29539269; Wasternack & Hause 2013 Ann Bot PMID:23558912). Contrasts
  with ARATH_PTI_FLG22_IMMUNITY and ARATH_SAR_SALICYLIC_ACID_IMMUNITY in SERIES:ARATH_IMMUNE_SIGNALING.
  Includes plastidial and peroxisomal JA-Ile biosynthetic enzymes (LOX2, LOX3, LOX4, LOX6, AOS/CYP74A,
  AOC1-4, OPR3, ACX1, JAR1, JMT), coreceptor and bHLH/JAZ signaling nodes (COI1, MYC2, MYC3, MYC4, JAZ1/TIFY10A,
  JAZ3/TIFY6B, JAZ10/TIFY9), ethylene-synergistic AP2/ERFs (ORA59/ERF094, ERF1B), canonical defensin/thionin/VSP
  effectors (PDF1.2A, PDF1.2B, PDF1.2C, VSP1, VSP2, THI2.1, CORI3), and JA-induced indolic glucosinolate/camalexin
  enzymes (CYP79B2, CYP79B3, SUR1, UGT74B1, PAD3/CYP71B15).
