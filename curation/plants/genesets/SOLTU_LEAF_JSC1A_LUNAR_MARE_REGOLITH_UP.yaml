n_genes: 431
description: 'Genes up-regulated in leaves of potato grown in the NASA lunar mare reference simulant JSC-1A versus
  Adkins soil; 431 of 958 JSC-1A DEGs, largely distinct from the LMS-1E list (Fig. 5). Its clearest axis is the
  copper-replete half of the SPL7 copper switch: Cu/Zn superoxide dismutases CSD1 and CSD2 (miR398 targets) are
  up, together with metal-responsive genes (ALS3-like, a ZIP5-like zinc transporter, tau GSTs, CYP82C). This matches
  JSC-1A being the only simulant with significantly raised tuber Cu (Table 1). Receptor-like kinases are up as in
  every simulant. Source: Data S5 of Handy et al. 2026 (npj Microgravity, PMID:43058136), DESeq2 padj < 0.05, upper-canopy
  leaves at 39 DAP, n = 5 per substrate, all substrates amended with 5% v/v vermicompost plus Osmocote. Direction:
  Data S5 does not state the sign convention; log2FoldChange is read as regolith relative to Adkins (DESeq2 default
  reference, alphabetically first level ADK). This is confirmed by the copper switch tracking the measured copper:
  FSD1 falls and CSD1/CSD2 rise most in JSC-1A, the simulant with significantly higher tuber Cu (Table 1). Gene
  ids are DM v6.1 (Soltu.DM) as in the paper; GO enrichment uses the SpudDB DM v6.1 GO annotation (TAIR best-hit
  projection, all IEA, the annotation the authors used), with the annotated genome as background because only DEGs
  were released.'
