  evidence:
  - reference: PMID:19122104
    reference_title: SQUAMOSA Promoter Binding Protein-Like7 Is a Central Regulator for Copper Homeostasis in Arabidopsis.
    snippet: SPL7 is also required for the expression of multiple microRNAs, miR397, miR408, and miR857, involved
      in copper homeostasis and of genes encoding several copper transporters and a copper chaperone, indicating
      its central role in response to copper deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    explanation: SPL7 drives miR398 (CSD1/CSD2 repression), COPT transporters and a copper chaperone under Cu deficiency.
      The reverse pattern here indicates Cu sufficiency.
  curator_note: CSD1 and CSD2 up (2/14, nominal p = 0.014). In Arabidopsis and Solanaceae these are miR398 targets
    that SPL7 represses under copper deficiency, so their rise, with FSD1/COPT1/CCH falling in the paired DN set,
    reads out a copper-replete leaf. Too few genes for Bonferroni; added because it is the specific mechanism behind
    the metal-response hit.
