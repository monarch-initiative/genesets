  evidence:
  - reference: PMID:43058136
    reference_title: Growth and molecular responses of potato to lunar regolith simulants.
    snippet: Heavy metals, including Cu, Zn, and Al, were modestly elevated in tubers from certain LRS treatments,
      warranting continued monitoring in future studies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    explanation: Cu was significantly elevated in tubers of JSC-1A plants (Table 1).
  curator_note: '30 carriers: CSD1 (01G022650), CSD2 (11G020830), ALS3-like (10G021270), zinc transporter (07G014000),
    tau GSTs (01G029100, 09G001300, 09G001440), CYP82C (06G033570, 04G034610), basic chitinases. Several are annotated
    only through Cd/Zn/Al responses in Arabidopsis, so the general term is right and the specific metal is copper
    (next association).'
