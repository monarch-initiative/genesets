direction: UP
series: SERIES:ARATH_ROOT_EPIDERMIS
series_role: trichoblast
n_genes: 25
description: Transcriptional and effector program of the Arabidopsis thaliana root hair (trichoblast,
  H-position) epidermal cell lineage, defined by single-cell and developmental genetics studies (Ryu et
  al. 2019 Plant Physiol PMID:30842268; Denyer et al. 2019 Dev Cell PMID:30910786; Bruex et al. 2012 PLoS
  Genet PMID:22291601). Contrasts with ARATH_ROOT_ATRICHOBLAST (the non-hair N-position pole of SERIES:ARATH_ROOT_EPIDERMIS).
  Includes the bHLH/C2H2 transcriptional cascade (RHD6, RSL2, RSL4, ZFP5) and polarized tip-growth effectors
  (EXPA7, EXPA18, RBOHC, SFH1, LRX1, LRX2, IRE, MRH6, PERK13, PRP3, PIP5K3, ADF8, ARAC4, ACT8, CML25).
