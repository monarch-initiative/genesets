description: The Thlaspi arvense (field pennycress) aliphatic and indolic glucosinolate (sinigrin) core
  biosynthesis, sulfotransferase, and myrosinase-ESP glucosinolate-mustard oil bomb hydrolysis pathway
  (Dorn et al. 2015 Plant J PMID:25641109; Chopra et al. 2020 Plant Direct PMID:32128489; Nunn et al.
  2022 Nat Commun PMID:35610221). Contrasts with THLAR_SEED_ERUCIC_ACID_OIL in SERIES:THLAR_SEED_DOMESTICATION.
  Wild pennycress seeds accumulate high levels of the allyl-glucosinolate sinigrin (~100 umol/g), which
  renders defatted seed meal pungent and goitrogenic to livestock; knocking out glucosinolate biosynthesis/transport
  genes alongside FAE1 yields 'double-low' canola-quality pennycress.
