taxon:
  id: NCBITaxon:15368
  label: Brachypodium distachyon
direction: UP
n_genes: 36
description: The Brachypodium distachyon (DOE JGI Flagship C3 grass model) Type II commelinid monocot
  secondary cell wall glucuronoarabinoxylan (GT43/IRX9/IRX14, GT47/IRX10, GT61 xylan arabinosyltransferase,
  TBL/XOAT xylan O-acetyltransferase, BAHD feruloyltransferase), mixed-linkage (1->3),(1->4)-beta-D-glucan
  (CSLF6) and secondary cellulose synthase (BdCESA4/7/8), and monolignol/laccase (BdPTAL1, BdCOMT, BdCAD,
  BdLAC5, BdLAC8) biosynthesis module (Coomey et al. 2020 New Phytol PMID:32167579; Wang et al. 2015 Plant
  Cell PMID:25724637; Petrik et al. 2014 Plant J PMID:24460551). Grass Type II cell walls differ fundamentally
  from dicot Type I walls by using glucuronoarabinoxylan cross-linked to lignin via ferulate and p-coumarate
  esters and by incorporating bifunctional phenylalanine/tyrosine ammonia-lyase (PTAL).
