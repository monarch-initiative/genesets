    process) is classified under GO:0072351 (tricarboxylic acid biosynthetic process) because nicotianamine
    chemically possesses three carboxylic acid moieties, causing iron-deficiency sets to enrich for TCA
    biosynthesis across all 4 variants (4/39 genes, p_adj=4.30e-06).'
