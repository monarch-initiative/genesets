description: The Arabidopsis thaliana Strategy I root iron-deficiency response, URI-bHLH38/39/100/101-FIT-PYE-BTS
  transcriptional cascade, FRO2-IRT1-AHA2 rhizosphere acidification/reduction machinery, and MYB72-F6'H1-S8H-CYP82C4-PDR9
  redox-active coumarin (fraxetin/sideretin) secretion regulon (Riaz & Guerinot 2021 Plant Physiol PMID:33793927;
  Stringlis et al. 2018 PNAS PMID:29686086; Rajniak et al. 2018 Nat Chem Biol PMID:29581584). Contrasts
  with ARATH_PHOSPHATE_STARVATION_PHR1 in SERIES:ARATH_ROOT_NUTRIENT_FORAGING.
