description: The Sorghum bicolor brown midrib (bmr) monolignol biosynthesis, tricin/ferulate grass cell-wall
  cross-linking, and secondary cell wall CESA/laccase module (Saballos et al. 2008 Genetics PMID:18562666;
  Sattler et al. 2010 Plant Sci PMID:20185057; Hennet et al. 2020 Front Plant Sci PMID:32373138). Includes
  the classical sorghum brown midrib loci Bmr2 (4CL), Bmr6 (CAD), and Bmr12 (COMT) along with their stem-expressed
  paralogs across PAL (6), C4H (2), 4CL (3), HCT (2), C3H, CCoAOMT (2), CCR (2), F5H (2), COMT (3), CAD
  (3), apoplastic laccases (7), and secondary cell wall cellulose synthases (7).
