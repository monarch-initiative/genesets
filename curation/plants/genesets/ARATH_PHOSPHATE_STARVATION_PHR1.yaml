    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    explanation: Under Pi starvation, PHR1 induces sulfolipid synthases (SQD1, SQD2) and galactolipid
      synthases (MGD2, MGD3, DGD1, DGD2) alongside phospholipases (NPC4, NPC5) to replace membrane phospholipids
      with non-phosphorus glycolipids.
  curator_note: Mechanistically resolves the signature membrane phospholipid-to-glycolipid substitution
    strategy that frees internal cellular phosphate (7/37 members; recovered across all 4 variants).
