description: The Arabidopsis thaliana PHR1/PHL1-SPX1/2/3/4 inositol-pyrophosphate phosphate starvation
  response (PSR) regulon, PHT1-PHF1-PHO2/UBC24-NLA-PHO1 phosphate transport module, SQD1/2-MGD2/3-DGD1/2-NPC4/5
  membrane phospholipid-to-sulfolipid/galactolipid substitution pathway, and secreted purple acid phosphatase
  (PAP10/12/17/26) / STOP1-ALMT1-LPR1/2 organic-Pi scavenging program (Puga et al. 2014 PNAS PMID:25271326;
  Bustos et al. 2010 PLoS Genet PMID:20838596). Contrasts with ARATH_IRON_DEFICIENCY_FIT_COUMARIN in SERIES:ARATH_ROOT_NUTRIENT_FORAGING.
