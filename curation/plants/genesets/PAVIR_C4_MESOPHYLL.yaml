description: Initial C4 carbon fixation and phosphoenolpyruvate regeneration program in leaf mesophyll
  cells of the NAD-malic enzyme C4 bioenergy grass Panicum virgatum (switchgrass) (Rao et al. 2016 Plant
  Physiol PMID:27099212; Lovell et al. 2021 Nature PMID:33505029). Contrasts with PAVIR_C4_BUNDLE_SHEATH
  in SERIES:PAVIR_C4_KRANZ. In NAD-ME C4 Kranz anatomy, atmospheric CO2 is hydrated to bicarbonate by
  cytosolic beta-carbonic anhydrases (CA) in mesophyll cells, fixed into oxaloacetate by phosphoenolpyruvate
  carboxylase (PEPC), and converted to aspartate (via AspAT) or malate (via NADP-MDH) for export to bundle
  sheath cells, while pyruvate returning from the bundle sheath is regenerated into PEP by chloroplastic
  pyruvate, orthophosphate dikinase (PPDK).
