  curator_note: 'Carried by genes that Arabidopsis induces under hypoxia but that also belong to the general stress
    regulon: CML38-like (11G024590-11G024610, 02G034080), HUP-like DUF4228 (02G026480, 04G002490), GA2ox (07G022700),
    ZAT10, ERF, DREB2A. Waterlogging is plausible because the simulants retained more moisture and cemented after
    watering (Table 2). But the core anaerobic marker PDC1 (Soltu.DM.10G019440, AT4G33070) goes the other way, down
    5.1 log2 in LMS-1E leaves, and ADH is unchanged. So this is general stress signalling, not a hypoxia programme
    in the leaf.'
