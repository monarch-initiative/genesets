series: SERIES:SOLTU_LUNAR_REGOLITH_LEAF
series_role: lms1e_mare_up
n_genes: 566
description: 'Genes up-regulated in leaves of potato (Solanum tuberosum cv. Modoc) grown in the lunar mare simulant
  LMS-1E versus a terrestrial sandy soil (Adkins series); 566 of the 1,397 LMS-1E DEGs. The membership is dominated
  by the rapid general-stress regulon (WRKY33/40-like, ZAT10/STZ, ERF5/ERF105-like, CML37/38-like calmodulin-like
  proteins, CMPG1-like PUB E3 ligases, ATL RING ligases) and a large S-locus lectin and S-domain-2 receptor-like
  kinase expansion, consistent with the stunted canopy of LMS-1E plants. Source: Data S5 of Handy et al. 2026 (npj
  Microgravity, PMID:43058136), DESeq2 padj < 0.05, upper-canopy leaves at 39 DAP, n = 5 per substrate, all substrates
  amended with 5% v/v vermicompost plus Osmocote. Direction: Data S5 does not state the sign convention; log2FoldChange
  is read as regolith relative to Adkins (DESeq2 default reference, alphabetically first level ADK). This is confirmed
  by the copper switch tracking the measured copper: FSD1 falls and CSD1/CSD2 rise most in JSC-1A, the simulant
  with significantly higher tuber Cu (Table 1). Gene ids are DM v6.1 (Soltu.DM) as in the paper; GO enrichment uses
  the SpudDB DM v6.1 GO annotation (TAIR best-hit projection, all IEA, the annotation the authors used), with the
  annotated genome as background because only DEGs were released.'
