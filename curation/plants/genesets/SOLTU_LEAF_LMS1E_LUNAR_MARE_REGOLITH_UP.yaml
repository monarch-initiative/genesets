  evidence:
  - reference: PMID:17953483
    reference_title: Mechanical stress induces biotic and abiotic stress responses via a novel cis-element.
    snippet: Comparison of RWR genes with published abiotic and biotic stress microarray datasets demonstrates a
      large overlap across a wide range of environmental stresses.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    explanation: The chitin-responsive WRKY/ZAT/ERF/CML genes here are the rapid wound responsive (RWR) regulon
      that is shared across many abiotic and biotic stresses.
  - reference: PMID:43058136
    reference_title: Growth and molecular responses of potato to lunar regolith simulants.
    snippet: Whole-transcriptome profiling of leaves revealed that each simulant elicited a distinct pattern of
      gene expression changes, indicating that the type and intensity of regolith-induced stress is substrate-dependent.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    explanation: LMS-1E elicited its own, largest DEG set (1,397 genes).
  curator_note: '26 carriers, almost all transcription factors and E3 ligases of the Arabidopsis rapid wound/general
    stress regulon: WRKY33-like (Soltu.DM.09G009490, 06G018840), WRKY40-like (06G024270), ZAT10/STZ-like (12G006170,
    04G032780), ERF105-like (05G022070, 03G014560), ERF5-like (08G024170), CMPG1-like (04G026330), ATL/TOXICOS EN
    LEVADURA (01G021450). No chitin is involved: in TAIR this term is the expression-based proxy for that shared
    regulon, so it is kept as the core term with medium confidence.'
