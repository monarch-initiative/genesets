description: The Arabidopsis thaliana phloem sieve-element differentiation, enucleation, sieve-plate callose/P-protein
  assembly, and companion-cell sucrose/florigen loading program (Furuta et al. 2014 Science PMID:25378460;
  Wallner et al. 2017 Curr Biol PMID:28392111; Kim et al. 2021 Plant Cell PMID:33793811). Contrasts with
  ARATH_SECONDARY_CELL_WALL_REGULON (xylem vessels and fibers) in SERIES:ARATH_VASCULAR_TISSUES. Includes
  protophloem/metaphloem specification factors (APL, SMXL3, SMXL4, SMXL5, OPS, BRX, CVP2/IP5P6, CVL1/IP5P7),
  CLE45-BAM3/RPK2/CRN/CLV2 autocrine peptide signaling, NAC45/86-NEN1/2/3/4 sieve-element enucleation
  nucleases, sieve-plate callose synthases and P-proteins (CALS7, CALS3, CALS10, SEOA, SEOB, CHER1), and
  companion-cell apoplastic sucrose/florigen loaders (SUC2, SUC1, SWEET11, SWEET12, SWEET13, AHA3, FT,
  TSF, FTIP1).
