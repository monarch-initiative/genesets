description: The Panicum virgatum (switchgrass) axillary tiller bud outgrowth, strigolactone/apocarotenoid
  (D27/CCD7/CCD8-TB1) branching control, and PIN/ABCB polar auxin canalization program (benchmarked against
  Lovell et al. 2021 Nature PMID:33505029; Palmer et al. 2017 BMC Plant Biol PMID:28851290). Contrasts
  with PAVIR_RHIZOME_OVERWINTERING_SENESCENCE in SERIES:PAVIR_PERENNIAL_BIOMASS_ARCHITECTURE. Tiller number
  and crown bud activation are primary determinants of aerial biomass yield across upland and lowland
  switchgrass ecotypes.
