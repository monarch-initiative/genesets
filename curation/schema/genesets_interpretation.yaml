id: https://w3id.org/genesets-rs/genesets-interpretation
name: genesets_interpretation
title: Gene Set GO Interpretation Schema
description: >-
  Curated, validated GO-term interpretations of non-GO gene sets (e.g. MSigDB
  C8 cell-type signatures) and of ranked gene signatures (a score for every
  measured gene, e.g. a differential-expression contrast or GWAS gene-level
  statistics). Each interpretation records, per GO term, a curator judgment
  (role category, confidence, specificity), and optional literature evidence.
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  genesets: https://w3id.org/genesets-rs/genesets-interpretation/
  GO: http://purl.obolibrary.org/obo/GO_
  CL: http://purl.obolibrary.org/obo/CL_
  UBERON: http://purl.obolibrary.org/obo/UBERON_
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  PR: http://purl.obolibrary.org/obo/PR_
  HP: http://purl.obolibrary.org/obo/HP_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  EFO: http://www.ebi.ac.uk/efo/EFO_
  MSIGDB: https://www.gsea-msigdb.org/gsea/msigdb/cards/
  LIT: https://w3id.org/genesets-rs/lit/
  CGSA: https://w3id.org/genesets-rs/cgsa/
  PMID: http://identifiers.org/pubmed/
  DOI: https://doi.org/
default_prefix: genesets
default_range: string
imports:
  - linkml:types

classes:

  GeneSetInterpretation:
    tree_root: true
    description: A curated GO interpretation of a single non-GO gene set.
    attributes:
      gene_set_id:
        identifier: true
        range: uriorcurie
        required: true
        description: Stable identifier for the gene set (e.g. MSIGDB:HAY_BONE_MARROW_DENDRITIC_CELL, or LIT:DISEASE_ASSOCIATED_MICROGLIA for a literature-defined gene set identified by its defining paper).
      gene_set_name:
        required: true
        description: Human-readable name of the gene set.
      collection:
        description: Source collection, e.g. C8, C2:CP:KEGG_LEGACY, C7.
      msigdb_release:
        description: MSigDB release the gene set came from, e.g. v2025.1.Hs.
      taxon:
        range: Term
        inlined: true
        description: Species the gene set is defined in (an NCBITaxon term).
      direction:
        range: DirectionEnum
        description: >-
          Whether the signature is the up, down, or undirected component. For a
          ranked signature, which carries both poles, direction is recorded on
          each association instead.
      ranking:
        range: RankedSignature
        inlined: true
        description: >-
          Present when the interpretation is of a ranked signature rather than
          a gene set. The scores themselves live in the file it points to; the
          leading edge of each association plays the role a set's membership
          plays for a gene set.
      derived_from:
        range: uriorcurie
        description: >-
          For a gene set made by thresholding a ranking (e.g. an MSigDB _UP/_DN
          pair cut from one contrast), the gene_set_id of the ranked
          interpretation it was cut from, when one is curated here.
      series:
        range: uriorcurie
        description: >-
          Identifier of a pair or series this set belongs to (e.g.
          SERIES:MICROGLIA_ACTIVATION). Groups related signatures that form a
          contrast (two poles), a directional pair (up/down of one experiment),
          or an ordered series. The series id need not be separately defined.
      series_role:
        description: >-
          This set's role or position within its `series` — a short label such
          as baseline, activated, neurotoxic, reparative, up, down, or a step
          name. Members of one series should use distinct roles. Free text
          rather than an enum because the meaningful poles differ per series.
      n_genes:
        range: integer
        description: Number of genes in the source set.
      description:
        description: Free-text summary of what the signature represents.
      contexts:
        range: BiologicalContext
        multivalued: true
        inlined_as_list: true
        description: What the signature is about (cell type, disease, chemical, etc.).
      associations:
        range: TermAssociation
        multivalued: true
        inlined_as_list: true
        recommended: true
        description: Per-GO-term curator judgments.

  RankedSignature:
    description: >-
      Provenance and storage of a ranked signature: one score for every gene
      the source measured. The ranking is also the universe of a ranked
      analysis, so genes absent from it were not measured, not unchanged.
    attributes:
      source:
        range: uriorcurie
        required: true
        description: >-
          Where the scores come from: the paper (PMID/DOI), dataset accession,
          or resource the curator downloaded them from.
      source_detail:
        description: >-
          The exact table, file or contrast within the source, e.g.
          "Supplementary Table 3, sheet MAGMA" or "GSE12345, treated vs vehicle".
      download_url:
        range: uri
        description: URL the scores were downloaded from, when there is one.
      score_type:
        range: ScoreTypeEnum
        required: true
        description: What the scores measure.
      score_description:
        description: >-
          What the score means and how it was derived from the source columns,
          e.g. "MAGMA gene-level Z (column ZSTAT), SNP-wise mean model".
      signed:
        range: boolean
        required: true
        description: >-
          Whether negative scores are meaningful. True for a fold change or a
          t-statistic, whose two poles are two programs; false for one-sided
          association strengths such as a MAGMA Z or -log10 p, where only the
          high end is signal and associations may only be UP.
      gene_id_type:
        required: true
        description: >-
          Identifier namespace of the ranked genes as stored in the file, e.g.
          "HGNC symbol". Must match the annotations it is analyzed against.
      n_ranked:
        range: integer
        required: true
        minimum_value: 1
        description: Number of genes in the ranking file.
      file:
        required: true
        description: >-
          Path to the ranking, relative to the interpretation file: a
          gzip-compressed two-column TSV of gene and score with a header row
          (`gene`, `score`), as `genesets-rs gsea --ranks` reads it.
      sha256:
        required: true
        pattern: "^[0-9a-f]{64}$"
        description: SHA-256 of the ranking file as stored, compressed.

  BiologicalContext:
    description: An ontology term describing what the gene set is about.
    attributes:
      term:
        range: Term
        inlined: true
        required: true
      context_type:
        range: ContextTypeEnum
        required: true
      role_note:
        description: Optional note on the term's role, e.g. "treatment", "vs comparator".

  TermAssociation:
    description: A curated association between the gene set and a single GO term.
    attributes:
      term:
        range: Term
        inlined: true
        required: true
        description: The GO term.
      aspect:
        range: GOAspectEnum
        description: The GO aspect (BP/CC/MF) of the term.
      category:
        range: AssociationCategoryEnum
        recommended: true
        description: >-
          The curator's role judgment. Unset on freshly drafted (un-adjudicated)
          associations.
      confidence:
        range: ConfidenceLevelEnum
      confidence_score:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      specificity:
        range: SpecificityEnum
        description: How specific the term is to this biological context.
      specificity_score:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      seed_source:
        range: SeedSourceEnum
        required: true
        description: Whether the term was recovered by enrichment or added by a curator.
      direction:
        range: DirectionEnum
        description: >-
          For a ranked signature, the pole the term is enriched at: UP toward
          high scores (positive NES), DN toward low scores. Unused for gene
          sets, whose direction is the set's.
      recovery_status:
        range: RecoveryStatusEnum
        recommended: true
        description: >-
          Orthogonal to category: whether this (biologically asserted) term is
          actually supported by the gene set's current GO annotations, or
          represents a gap. This does NOT modulate the biological category or
          confidence — a term that is biologically core stays core even when no
          annotation supports it; the gap is recorded here so it is visible and
          scoreable. annotation_gap marks a GO curation target; membership_gap
          marks gene-set incompleteness.
      insight:
        description: >-
          Curator judgment of the term's interpretive value FOR THIS SET,
          relative to how the set was derived (its collection / context_type /
          direction). Recommended values: `confirmatory` — true and core, but
          entailed by the set's construction or known identity (e.g. an
          estradiol-response set enriching for "response to estradiol", or a
          PRC2-target set enriching for embryonic morphogenesis); recapitulates
          the design rather than revealing mechanism. `mechanistic` — a
          non-obvious process that illuminates how/why and is not entailed by the
          set's construction; a genuine enrichment insight. Free text is allowed
          (not a closed enum) so curators can record nuance or other
          distinctions.
      enrichment_stats:
        range: EnrichmentStats
        inlined: true
      evidence:
        range: EvidenceItem
        multivalued: true
        inlined_as_list: true
        recommended: true
      curator_note:

  Term:
    description: An ontology term reference (validated by linkml-term-validator).
    attributes:
      id:
        identifier: true
        range: uriorcurie
        required: true
      label:
        required: true
        comments:
          - This is automatically validated by the linkml-term-validator tool.

  EnrichmentStats:
    description: >-
      Enrichment numbers that seeded an association. `overlap` and the size
      slots describe a Fisher test of a gene set; `es`, `nes`, `set_size` and
      the leading-edge slots describe a ranked test.
    attributes:
      method:
        range: EnrichmentMethodEnum
        recommended: true
        description: The test that produced these numbers.
      algorithm:
        range: GraphAlgorithmEnum
        description: How the ontology graph was used; classic when unset.
      p_adjust_method:
        range: PAdjustMethodEnum
        description: How p_adjust was computed.
      p_value:
        range: float
      p_adjust:
        range: float
      es:
        range: float
        description: >-
          Ranked tests: the GSEA enrichment score (gsea_ks) or rank-biserial
          correlation (wilcoxon); positive toward high scores.
      nes:
        range: float
        description: >-
          Ranked tests: the normalized enrichment score (gsea_ks) or z-score
          (wilcoxon).
      set_size:
        range: integer
        description: "Ranked tests: term genes present in the ranking and scored."
      leading_edge_size:
        range: integer
        description: Number of genes in the leading edge.
      leading_edge_genes:
        multivalued: true
        description: >-
          Ranked tests: the term genes that drive the score, from the top of
          the ranking to the running-sum peak (UP) or from the trough to the
          bottom (DN). The ranked analogue of overlap_genes; ground judgments
          in these.
      peak_rank:
        range: integer
        description: "Ranked tests: 1-based rank of the leading edge's boundary gene."
      overlap:
        range: integer
      query_size:
        range: integer
      target_size:
        range: integer
      overlap_genes:
        multivalued: true

  EvidenceItem:
    description: A literature evidence item supporting or refuting an association.
    attributes:
      reference:
        range: uriorcurie
        description: Authoritative reference (PMID/DOI).
        implements:
          - linkml:authoritative_reference
      reference_title:
        recommended: true
      supports:
        range: EvidenceSupportEnum
      evidence_source:
        range: EvidenceSourceEnum
        recommended: true
        description: >-
          Origin/type of the underlying evidence (human clinical, model
          organism, in vitro, computational, or other). Mirrors the dismech
          EvidenceItem.evidence_source field for downstream interoperability.
      snippet:
        description: Exact excerpt from the reference supporting/refuting the claim.
        comments:
          - This is automatically validated by the linkml-reference-validator tool.
        implements:
          - linkml:excerpt
      explanation:
    rules:
      - description: >-
          A verbatim snippet must cite a reference, otherwise it cannot be
          validated by linkml-reference-validator (it would pass vacuously).
        preconditions:
          slot_conditions:
            snippet:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            reference:
              value_presence: PRESENT

enums:

  DirectionEnum:
    permissible_values:
      UP:
      DN:
      NA:

  ScoreTypeEnum:
    description: What a ranked signature's scores measure.
    permissible_values:
      log2_fold_change:
      signed_neg_log10_p:
        description: -log10(p) times the sign of the effect.
      t_statistic:
      wald_statistic:
      z_score:
        description: A signed standardized effect not covered by a more specific value.
      magma_gene_z:
        description: >-
          MAGMA gene-level association Z (one-sided; higher is stronger
          association).
      neg_log10_p:
        description: Unsigned -log10(p); association strength only.
      correlation:
      crispr_gene_effect:
        description: CRISPR screen gene-level effect (e.g. log fold change, beta, CERES/Chronos).
      other:
        description: Explain in score_description.

  EnrichmentMethodEnum:
    description: The enrichment test behind an association's statistics.
    permissible_values:
      fisher:
        description: One-sided Fisher exact / hypergeometric test of a gene set.
      gsea_ks:
        description: >-
          Preranked GSEA weighted Kolmogorov-Smirnov running sum with
          gene-set permutation (`genesets-rs gsea --statistic ks`).
      wilcoxon:
        description: >-
          Wilcoxon rank-sum of term members against non-members
          (`genesets-rs gsea --statistic wilcoxon`).

  GraphAlgorithmEnum:
    description: How the ontology graph was used while scoring terms.
    permissible_values:
      classic:
        description: Every term tested on its own.
      elim:
        description: Genes of significant descendants removed (Alexa et al. 2006).
      weight01:
        description: >-
          A child's genes removed from its parent when the child is at least as
          significant.

  PAdjustMethodEnum:
    description: Multiple-testing adjustment behind p_adjust.
    permissible_values:
      bonferroni:
      benjamini_hochberg:
      gsea_fdr:
        description: GSEA's pooled-null FDR q-value (Subramanian et al. 2005).
      none:

  GOAspectEnum:
    permissible_values:
      biological_process:
        meaning: GO:0008150
      cellular_component:
        meaning: GO:0005575
      molecular_function:
        meaning: GO:0003674

  ContextTypeEnum:
    permissible_values:
      cell_type:
      anatomical_structure:
      disease:
      phenotype:
      chemical_perturbagen:
      genetic_perturbation:
      infection:
      developmental_stage:
      cell_line:
      experimental_condition:

  AssociationCategoryEnum:
    permissible_values:
      core_process:
        description: Central biological process this context actually executes.
      core_component:
        description: Characteristic cellular component or structure.
      supporting_process:
        description: Real enabling/supporting process, not defining.
      marker_driven_plausible:
        description: Plausible given the marker genes but peripheral or generic.
      nonspecific:
        description: Housekeeping or broadly expressed; not informative here.
      false_association:
        description: Artifactual or biologically wrong for this set.

  ConfidenceLevelEnum:
    permissible_values:
      high:
      medium:
      low:

  SpecificityEnum:
    permissible_values:
      cell_type_specific:
      lineage_shared:
      broadly_expressed:
      ubiquitous:

  SeedSourceEnum:
    permissible_values:
      enrichment_recovered:
      curator_added:

  RecoveryStatusEnum:
    permissible_values:
      annotation_supported:
        description: >-
          Genes in the set are annotated to this term; enrichment recovers it.
      annotation_gap:
        description: >-
          Relevant genes ARE in the gene set, but their GO annotations are not
          deep/specific enough to capture this term. The association is real;
          the gap is GO's (a GO annotation curation target). Do not weaken the
          biological category for this reason.
      membership_gap:
        description: >-
          The genes that would carry this term are NOT in the gene set (the set
          is core/legacy/incomplete). The association is real for the underlying
          biology and SHOULD be in a complete set; the gap is the gene set's.
      universe_gap:
        description: >-
          Ranked signatures: the genes that would carry this term were not
          measured, so they are absent from the ranking. The ranked analogue of
          membership_gap. Genes that were measured but did not move are not a
          gap; that is a result, recorded in the category and curator_note.
      false_association:
        description: >-
          Not a gap: the term is biologically wrong for the set (mirrors the
          false_association category; use when the annotation support is absent
          because the association itself is spurious).

  EvidenceSupportEnum:
    permissible_values:
      SUPPORT:
      REFUTE:
      NEUTRAL:

  EvidenceSourceEnum:
    permissible_values:
      HUMAN_CLINICAL:
        description: Evidence from human clinical/observational studies or patient material.
      MODEL_ORGANISM:
        description: Evidence from animal or other model-organism studies.
      IN_VITRO:
        description: Evidence from cell-culture or other in-vitro experiments.
      COMPUTATIONAL:
        description: Evidence from computational/in-silico analysis.
      OTHER:
        description: Evidence that does not fit the other source types.

