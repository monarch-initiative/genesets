  atlas_id: 4328
  sha256: e8d06aa5f249a7f41ae1b91d5df70befcd53cbbafbbcf198797626906b092bd6
table:
  format: atlas_json
gene_column: GENE
gene_id_type: ensembl
fallback_symbol_column: SYMBOL
score_column: P
transform: neg_log10
duplicates: max
# The atlas serves this table only through its web page, so the built ranking
# is committed rather than rebuilt on demand.
store: true
