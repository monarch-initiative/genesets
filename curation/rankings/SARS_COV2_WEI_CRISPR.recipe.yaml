# Wei et al. 2021 (PMID:33147444), genome-wide knockout screen for SARS-CoV-2-
# induced death in African green monkey Vero-E6 cells, Table S1. Score: the
# averaged gene z-score of the Cas9-v2 screens; positive = enriched in
# survivors = proviral host factor, negative = depleted. Signed. The library
# targets Chlorocebus sabaeus genes; their symbols are mapped to human HGNC
# symbols (approved, then unambiguous previous or alias symbols), so LOC loci
# and monkey-specific names drop out.
name: SARS_COV2_WEI_CRISPR
