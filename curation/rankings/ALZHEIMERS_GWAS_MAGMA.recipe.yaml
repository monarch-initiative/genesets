# Alzheimer's disease GWAS, Jansen et al. 2019 (PMID:30617256): 71,880 clinical and UK Biobank proxy cases, 383,378 controls.
# MAGMA gene-based results (snp-wise mean model, 1 kb windows, protein-coding
# genes) as computed by the GWAS ATLAS (Watanabe et al. 2019, PMID:31427789),
# atlas study 4094. Score: -log10 of the MAGMA gene p-value (one-sided, unsigned).
name: ALZHEIMERS_GWAS_MAGMA
source:
  kind: ctg_atlas
  atlas_id: 4094
  sha256: 94f8ff897f994a38c2d28db52a74f1578ec33b991ae400487a082d7afce77bda
table:
  format: atlas_json
gene_column: GENE
gene_id_type: ensembl
fallback_symbol_column: SYMBOL
score_column: P
transform: neg_log10
duplicates: max
# The atlas serves this table only through its web page, so the built ranking
# is committed rather than rebuilt on demand.
store: true
hgnc:
  url: https://storage.googleapis.com/public-download-files/hgnc/archive/archive/monthly/tsv/hgnc_complete_set_2026-10-06.txt
  sha256: 8bf6f686e640dbc864a346484626953621b0500d900d26cd085a35c2782d725d
