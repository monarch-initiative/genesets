description: >-
  DEG module PMC10202813-6 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a human melanoma study, GO-BP annotated. The benchmark ground
  truth leads with pigment/melanin biosynthesis, and the module is indeed the
  melanoma-relevant pigment cluster — but grounding in the actual 50-gene
  membership shows the pigment signal is THIN (chiefly OCA2, with ATOX1 as a
  copper-chaperone supporter of tyrosinase-family enzymes) and is co-mixed with
  a distinct proliferation signal (the mitotic genes CDC45, AURKB, PBK, plus
  TERT) and a large melanoma-derived tail of ion-channel (GABRP, GABRB2,
  CACNA1S) and sensory (OTOG, OTOGL, OTOF) genes. This set is included precisely
  because it exercises the membership-grounding discipline: the paper's top
  ground-truth term (melanin biosynthesis) is real but carried by very few set
  members, illustrating the noisy-cluster behaviour cGSA's community detection
  is designed to mitigate.
contexts:
