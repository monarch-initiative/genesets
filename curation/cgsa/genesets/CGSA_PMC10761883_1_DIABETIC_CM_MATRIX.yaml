description: >-
  DEG module PMC10761883-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), the matrix/remodeling arm of the human diabetic-cardiomyopathy
  study whose HIF/glycolysis arm is PMC10761883-2
  (SERIES:CGSA_PMC10761883_MODULES). genesets-rs enrichment against human GOA
  recovers a heparin / glycosaminoglycan-binding extracellular-matrix program —
  CCN3, CCDC80, MDK (midkine), NELL2, PCOLCE2, SERPINA5, SPOCK2, TGFBR3 and the
  collagen COL25A1 — alongside the shared hypoxia response (ANGPTL4, BNIP3,
  NDRG1, HILPDA), the fibrotic/hypoxic remodeling of the diabetic heart.
