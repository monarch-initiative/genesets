description: >-
  DEG module PMC10772820-5 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), mouse NASH liver, KEGG-annotated (top ground truth: "Chemokine
  signaling pathway", plus infection/phagosome/osteoclast terms that share the
  same chemokine and myeloid genes). The membership carries a
  chemokine-driven inflammatory-recruitment program — the CC chemokines Ccl2,
  Ccl4, Ccl5, the CXC chemokine Cxcl9 and the receptor Ccr2 — the monocyte/
  macrophage recruitment that drives hepatic inflammation in steatohepatitis.
