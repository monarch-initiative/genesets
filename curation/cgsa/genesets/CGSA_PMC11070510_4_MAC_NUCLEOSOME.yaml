description: >-
  DEG module PMC11070510-4 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a mouse Mycobacterium avium complex infection study. Small and
  clean: genesets-rs enrichment against mouse MGI GOA recovers a nucleosome /
  chromatin-structure program built almost entirely from core and linker histone
  genes (H1f1/H1f3/H1f4/H1f5, the H2ac cluster) plus the centromeric histone
  variant Cenpa — the histone-gene block that dominates this DEG module.
