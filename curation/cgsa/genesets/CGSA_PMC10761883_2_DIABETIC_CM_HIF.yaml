description: >-
  DEG module PMC10761883-2 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a human study of shared targets in diabetic cardiomyopathy,
  annotated against KEGG (top ground-truth terms: HIF-1 signaling, PPAR
  signaling, glycolysis/gluconeogenesis). Grounded in the membership, the
  coherent core is a hypoxia/HIF program — the HIF targets Bnip3, Adm, Angptl4,
  Bhlhe40, Vegfa and the glycolytic effectors Slc2a1/Glut1, Ldha, Hk2 — with a
  PPAR/lipid arm (Angptl4 and fatty-acid-handling members). Cdkn1a (p21) rides
  along as a HIF/stress-responsive cell-cycle brake.
