description: >-
  DEG module PMC11056152-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a human Williams-Beuren syndrome study. genesets-rs enrichment
  against human GOA recovers an extracellular-matrix / basement-membrane program
  that includes ELN (elastin) — the 7q11.23 gene whose loss drives the WBS
  elastin arteriopathy and connective-tissue phenotype — alongside COL4A3,
  COL9A3, ACAN, the ADAMTS proteases (ADAMTS5/7/18), CCN4, COCH and DMP1. This is
  the disease-relevant signal (matched by the -3 module's "NABA matrisome"
  ground truth). The membership also enriches olfactory-receptor genes, but that
  is a gene-family artifact of a large DEG list, not WBS biology (recorded as
  nonspecific below).
