description: >-
  DEG module PMC9232499-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a mouse glioblastoma study, GO-BP annotated. Small (43-gene)
  and unusually clean: the membership genuinely carries a cell-migration /
  extracellular-matrix-remodeling program — the matrix metalloproteinases Mmp9
  and Mmp10, collagen Col1a1, the procollagen processing metalloproteinases
  Adamts2 and Tll1, the matricellular signal Cyr61/Ccn1, the smooth-muscle actin
  Acta2, the autotaxin Enpp2, the ephrin receptor Epha4, Amigo2 and the
  endothelial cadherin Cdh5. This is the pro-invasive/ECM arm of the study
  contrast; its paired module (PMC9232499-2) carries the stress/defense arm.
