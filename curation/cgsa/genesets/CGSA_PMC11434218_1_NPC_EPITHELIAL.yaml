description: >-
  DEG module PMC11434218-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a human nasopharyngeal carcinoma study. genesets-rs enrichment
  against human GOA recovers an epithelial-differentiation / tube-morphogenesis
  program — the epithelial and morphogen genes AGR2, ACTA2, the AKR1C aldo-keto
  reductases, the BMP ligands BMP2/BMP4/BMP5/BMP6, CASP14 and CAV1 — the
  epithelial-tissue program of this carcinoma of the nasopharyngeal epithelium.
