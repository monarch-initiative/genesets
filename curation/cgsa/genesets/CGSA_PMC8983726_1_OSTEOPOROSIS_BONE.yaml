description: >-
  DEG module PMC8983726-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a mouse osteoporosis study. Curated semi-automatically:
  genesets-rs enrichment against mouse MGI GOA surfaced an ossification /
  osteoblast-differentiation program grounded in real carriers — the
  bone-mineralization enzyme Alpl, the osteogenic BMPs Bmp2/Bmp4/Bmp5 and their
  antagonist Nog, the transcription factors Msx2 and Satb2, and matrix proteins
  Dmp1 and Ibsp. The benchmark's own top ground-truth term ("Morphogenesis of a
  branching epithelium") is a BMP/morphogen side-annotation, not the osteoporosis
  biology; the bone program is the real core.
