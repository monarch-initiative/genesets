description: >-
  DEG module PMC10202813-2 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), human melanoma, GO-BP annotated (benchmark ground truth leads
  with cellular senescence and T-cell activation). Grounded in the 62-gene
  membership, the module carries two coherent signals plus the study's melanoma
  drivers: (1) a senescence/cell-aging arm anchored by CDKN2A (p16INK4A) and
  TP53; (2) an adaptive-immune arm (PTPRC/CD45, TIGIT, SELL/CD62L, LY9, B2M,
  IL1RL1); and the canonical melanoma driver genes BRAF, NRAS, TP53 and CDKN2A
  themselves, which co-occur here as differentially expressed transcripts rather
  than as a mutation panel. Apoptotic regulators (TP53, BCL2L11/BIM, BFAR) form
  a supporting arm. Included to represent a mixed disease-context module in the
  curation demonstration.
