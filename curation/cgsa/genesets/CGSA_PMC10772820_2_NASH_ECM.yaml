description: >-
  DEG module PMC10772820-2 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), mouse NASH liver, KEGG-annotated (top ground truth:
  "ECM-receptor interaction", "Focal adhesion", "Protein digestion and
  absorption"). The membership carries a fibrotic extracellular-matrix program —
  the fibrillar/basement-membrane collagens Col1a1, Col4a1 and Col6a1 and the
  laminins Lama2 and Lamb1 — consistent with the hepatic fibrosis that
  characterizes steatohepatitis progression.
