description: >-
  DEG module PMC10156590-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a human pancreatic cancer study (Reactome ground truth "Mitotic
  Prometaphase"; siblings PMC10156590-2 Golgi and -4 Rho-actin). genesets-rs
  enrichment against human GOA recovers the mitotic chromosome-segregation
  machinery — the centromere/kinetochore proteins CENPC/CENPE, BUB3, the spindle
  and centrosome components AURKA, CDK5RAP2, BORA, and the anaphase-promoting
  complex (ANAPC7/ANAPC16, CDC23/CDC27) — the proliferation program of the tumor.
