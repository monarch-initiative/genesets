description: >-
  DEG module PMC10156590-4 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a human pancreatic cancer study (the Golgi-transport module
  PMC10156590-2 is its sibling). The benchmark ground truth names "Signaling by
  Rho GTPases"; genesets-rs enrichment against human GOA grounds this in an
  actin-cytoskeleton program regulated by a large block of Rho-family GAP/GEF
  genes — ARHGAP21, ARHGEF12, ARAP1, ASAP2, AGAP3, ARFGAP1 — together with the
  actin regulators ABI1/ABI2, ADD1, ABLIM1 and DIAPH1.
