description: >-
  DEG module PMC11471230-2 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a mouse Parkinson disease study (a second module of the
  PMC11471230 study whose -1 module is the synaptic signature). genesets-rs
  enrichment against mouse MGI GOA recovers a striking ciliary-axoneme program —
  a dense block of cilia-and-flagella-associated proteins (Cfap43, Cfap45,
  Cfap57, Cfap65, Cfap100, Cfap126), Ccdc103, Ak8 and Ccsap — plus a neuronal
  arm at the axon/neuron-projection terminus (Chrm1/2/4, Drd1, Cck/Cckar). The
  ciliary signal is notable given the growing links between primary-cilium
  function and Parkinsonian neurodegeneration.
