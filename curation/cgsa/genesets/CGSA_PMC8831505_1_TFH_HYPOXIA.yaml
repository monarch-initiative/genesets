description: >-
  DEG module PMC8831505-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a mouse study of hypoxia-driven regulation of T follicular
  helper (Tfh) cells, annotated against MSigDB Hallmark. The membership carries a
  coherent hypoxia / glycolytic-metabolism program — the glucose transporter
  Slc2a1/Glut1 and the glycolytic enzymes Ldha, Pgk1, Hk2, Aldoa, Eno1, Pfkl,
  plus the hypoxia effectors Pdk1 and Bnip3. This is the immunometabolic
  signature by which hypoxia reprograms Tfh differentiation.
