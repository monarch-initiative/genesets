description: >-
  DEG module PMC10202813-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a fifth module of the same human melanoma study as the
  interferon/pigment/senescence modules in SERIES:CGSA_PMC10202813_MODULES.
  genesets-rs enrichment against human GOA recovers a very tight, highly specific
  antigen-presentation program: the set contains a near-complete HLA locus
  (HLA-A/B/C class I and HLA-DMA/DMB/DOA/DOB/DPA1/DPB1 class II), so the MHC and
  antigen-processing terms enrich with overlap approaching the full term size.
  In melanoma this is the tumor's antigen-presentation status — a key axis of
  immune recognition and checkpoint-therapy response.
