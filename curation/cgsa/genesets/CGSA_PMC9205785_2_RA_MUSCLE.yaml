description: >-
  DEG module PMC9205785-2 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), from a rheumatoid arthritis study. NOTE: the benchmark labels
  this set's ground truth "T cell receptor complex / lymphocyte chemotaxis", but
  genesets-rs enrichment against human GOA shows the actual membership is
  dominated by a striated-muscle program — the sarcomeric/contractile genes
  ACTC1, ANKRD1, ANKRD23, CSRP3, CAV3, DTNA, CKMT2 — with a secondary epidermal
  arm (CASP14, CDSN, DSG1, FLG2, IVL). This is a documented ground-truth /
  membership mismatch (the drafter's mismatch screen flagged it): the immune
  ground truth is not carried by these genes, so the set is curated to the
  muscle biology the membership actually supports, not to the benchmark label.
