description: >-
  DEG module PMC9232499-2 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), mouse glioblastoma, GO-BP annotated — the paired stress/immune
  arm of PMC9232499-1's migration/ECM module. The benchmark ground truth leads
  with the very broad "response to stress" and "defense response"; grounded in
  the membership, the coherent signal is an innate-immune / interferon-inducible
  defense arm: the interferon-gamma-induced GTPase Gbp1, the MHC class II
  transactivator Ciita, the coagulation/immune effector Fgl2, the acute-phase
  Lcn2 and Serpina1a, and the IL-33 receptor Il1rl1. The generic stress term is
  retained but flagged as broad/nonspecific relative to this defense signal.
