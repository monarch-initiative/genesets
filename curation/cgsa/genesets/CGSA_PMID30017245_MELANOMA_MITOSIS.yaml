description: >-
  DEG set PMID30017245 from the cGSA benchmark (Wang et al., Bioinformatics 2026,
  btag214), a human melanoma transcriptional-state study — the same set the
  authors use in their published results table. The dominant, cleanly supported
  signal is a mitotic cell-cycle / proliferation program: every canonical mitotic
  marker is present (CDK1, CCNB1, AURKB, BUB1, PLK1, TOP2A, CENPA, KIF11, CDC20,
  MKI67, MELK, TTK). The benchmark ground truth for this set also lists
  melanocyte/pigmentation and interferon terms reflecting the melanoma context;
  those are secondary arms, and the proliferation program is the defining core.
