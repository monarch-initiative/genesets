description: >-
  DEG module PMC10772820-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a mouse non-alcoholic steatohepatitis (NASH) liver study,
  KEGG-annotated (top ground truth: "Complement and coagulation cascades"). The
  membership carries a coherent hepatic complement + coagulation program — the
  complement components C3 and Cfb and the coagulation/fibrinolysis factors F2
  (prothrombin), Serpinc1 (antithrombin), the fibrinogen chains Fga/Fgb/Fgg and
  Plg (plasminogen) — reflecting the liver's role as the source of plasma
  complement and clotting factors and their dysregulation in steatohepatitis.
