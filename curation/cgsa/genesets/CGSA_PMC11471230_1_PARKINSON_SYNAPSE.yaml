description: >-
  DEG module PMC11471230-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a mouse Parkinson disease study. genesets-rs enrichment against
  mouse MGI GOA recovers a synaptic-signaling / axonogenesis program — the
  trans-synaptic and channel genes C1ql1/C1ql3, Cacna1e, Cacna2d1, Cacng8,
  Chrna6, Abcc8 and the axon-guidance genes Celsr3, Bhlhe22, Chn1 — the neuronal
  connectivity biology relevant to the neurodegeneration studied here.
