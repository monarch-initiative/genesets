description: >-
  DEG module PMC10772820-4 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), the hepatic lipid/steroid-metabolism arm of the mouse NASH
  study (its complement, ribosome, ECM and chemokine arms are the other
  SERIES:CGSA_PMC10772820_MODULES members). genesets-rs enrichment against mouse
  MGI GOA recovers a dense metabolic program — the lipoprotein/cholesterol genes
  Apoa1/Apoa2/Apoc3/Abca1, the sterol/fatty-acid enzymes Acat2, Acaa1a, Acox1,
  Acsl1, and the xenobiotic cytochromes Cyp2a12/Cyp2b10 — the hepatocyte
  lipid-handling and detoxification biology deranged in steatohepatitis.
