description: >-
  DEG module PMC11352921 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), from a mouse study of ten-eleven translocation (TET) loss and
  gliogenic competence in neural stem cells. genesets-rs enrichment against mouse
  MGI GOA recovers a neurodevelopmental program — axon outgrowth and guidance
  (Ablim1, Ank3, Chl1, Cntn1, Cxcl12, Boc), and neuronal cell-fate commitment
  (Arx, Casz1, Dbx1, Dmrt3, Ebf2, Cdon) — the differentiation and wiring biology
  a TET-loss neural-stem-cell perturbation would disturb.
