description: >-
  DEG module PMC9159952-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a mouse brain (sex-differences) study. genesets-rs enrichment
  against mouse MGI GOA recovers a coherent postsynaptic / synaptic-organization
  program — the postsynaptic scaffold and receptor machinery Anks1b, Cbln1/Cbln2,
  Chrm3, Ctnna2, Add2, the voltage-gated Ca channels Cacna1e/Cacna1h and the
  adhesion-GPCR Adgrl2 — the excitatory synapse biology expected of a
  neuronal DEG signature.
