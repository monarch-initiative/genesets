description: >-
  DEG module PMC10156590-2 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a human pancreatic cancer study, Reactome-annotated (top ground
  truth: "Transport to the Golgi and subsequent modification", "Intra-Golgi and
  retrograde Golgi-to-ER traffic"). The membership carries a coherent
  ER–Golgi vesicular-transport program built on the COPI coatomer — Copb1,
  Copb2, Copg1 — together with the small GTPase Arf1 (COPI recruitment) and
  Rab1a (ER-to-Golgi tethering). The Reactome ground truth also mixes in mitotic
  terms (this large DEG set spans more than one program); the trafficking arm is
  the one grounded here.
