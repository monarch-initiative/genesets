description: >-
  DEG module PMC10851453-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a human Alzheimer disease study. genesets-rs enrichment against
  human GOA recovers a neuronal synapse-organization / neurite-morphogenesis
  program — the synaptic and axon-guidance genes ARC, ABI3, APBB1/APBB2, ADGRB1,
  AUTS2, BAIAP2, the contactins CNTN4/CNTNAP1/CNTNAP2 and AKAP5 — the synaptic
  machinery whose loss is central to Alzheimer pathophysiology.
