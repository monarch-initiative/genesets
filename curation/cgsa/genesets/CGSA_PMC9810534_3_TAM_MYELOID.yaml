description: >-
  DEG module PMC9810534-3 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a mouse study of tumor-associated macrophages (TAMs) under
  myeloid PD-1 ablation. genesets-rs enrichment against mouse MGI GOA recovers a
  coherent myeloid chemotaxis / inflammatory program — the CC chemokines
  Ccl3/Ccl4/Ccl6/Ccl7/Ccl8, the receptors Ccr5/C3ar1/Cnr2, Csf3r, and the
  IL-6-regulating genes Arid5a, Cd36, Cd200r1 — the macrophage recruitment and
  cytokine program of the tumor immune microenvironment. This module also has
  strong ground-truth agreement (the benchmark GT names chemokine/cytokine and
  immune-cell activation, which the membership recovers).
