description: >-
  DEG module PMC10810761-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), from a mouse study of N6-methyladenosine (m6A) modification in
  nucleus pulposus (intervertebral disc) cells. genesets-rs enrichment against
  mouse MGI GOA recovers a centrosome / microtubule-organizing-center program —
  a dense block of centriolar/pericentriolar proteins (Cep131, Cep135, Cep162,
  Cep192, Cep350, C2cd3, Bbs9, Haus6) and the microtubule regulators Akap9,
  Bicd2 and Gas2l1. The centriole here doubles as the ciliary basal body,
  consistent with primary-cilium mechanosensing in disc cells.
