description: >-
  DEG module PMC9178829-2 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a human leukemia study. genesets-rs enrichment against human
  GOA recovers a clean nucleolar ribosome-biogenesis program — the rRNA
  processing helicases and assembly factors BMS1, BYSL, DDX10, DDX54, DHX37,
  EBNA1BP2, ESF1, LAS1L, MAK16, PES1, UTP14A/UTP3. This is the elevated ribosome
  production characteristic of proliferating leukemic blasts, and is distinct
  from the cytoplasmic-translation signature (ribosomal-protein genes) seen in
  other benchmark sets — here the signal is nucleolar rRNA maturation.
