description: >-
  DEG module PMC9750880-1 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), a mouse squamous cell carcinoma study. Curated
  semi-automatically: genesets-rs enrichment against mouse MGI GOA surfaced a
  coherent actin-cytoskeleton / cell-migration / focal-adhesion program with an
  angiogenesis arm — matching the benchmark's own ground truth (Angiogenesis,
  Cell migration). Carriers include the Rho/actin regulators Abl2, Arhgef2,
  Arpc1b and Bcar1, the adhesion components Fermt2 and Fblim1, and the
  angiogenic genes Col4a1, Ackr3 and Ephb1 — the invasive/vascular program of
  carcinoma progression.
