    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      The same Rpl*/Rps* members are structural constituents of the cytosolic
      ribosome — the cellular component underlying the translation process.
  - term:
      id: GO:0006119
      label: oxidative phosphorylation
    aspect: biological_process
    category: false_association
    confidence: medium
    specificity: ubiquitous
    seed_source: enrichment_recovered
    recovery_status: annotation_supported
    insight: confirmatory
    curator_note: >-
      Appears in the ground truth (via KEGG's OXPHOS/neurodegeneration disease
      pathways, which share mitochondrial and ribosomal genes) but is NOT the
      biology of this ribosomal-protein-dominated module. Recorded as a
      false_association to document the KEGG disease-pathway artifact — the same
      artifact that puts "Parkinson disease" and "Huntington disease" in the
      ground truth for a NASH liver gene set.
