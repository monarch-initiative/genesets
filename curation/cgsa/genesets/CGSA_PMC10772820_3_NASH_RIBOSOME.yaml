description: >-
  DEG module PMC10772820-3 from the cGSA benchmark (Wang et al., Bioinformatics
  2026, btag214), mouse NASH liver, KEGG-annotated. The membership is a dense
  block of cytoplasmic ribosomal-protein genes (Rpl3, Rpl4, Rpl7, Rpl11, Rpl13,
  Rpl23, Rplp0, Rps3, Rps6, Rps8, Rps15, Rps19 …), so the real biology is
  translation / ribosome biogenesis. This set is a useful benchmark stress-test:
  the ground truth lists "Ribosome" (correct) but also "Oxidative
  phosphorylation", "Parkinson disease", "Huntington disease" and "Coronavirus
  disease" — these are KEGG DISEASE pathways that merely re-list ribosomal (and
  mitochondrial) genes, so they are annotation artifacts of the ribosomal-protein
  membership, not disease biology present in a NASH liver DEG set. They are
  recorded as false associations below, not curated as real processes.
