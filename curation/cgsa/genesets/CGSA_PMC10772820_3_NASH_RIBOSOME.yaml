    curator_note: >-
      The dominant, densely-carried signal: dozens of large- and small-subunit
      cytoplasmic ribosomal-protein genes (Rpl*, Rps*, Rplp0) are present and
      annotated to cytoplasmic translation. This is the true identity of the
      module regardless of the disease-pathway names in the ground truth.
