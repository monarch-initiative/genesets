description: >-
  One of the differentially-expressed-gene (DEG) modules from the cGSA benchmark
  (Wang et al., Bioinformatics 2026, btag214), gene set PMC10202813-3, derived
  from a human melanoma study and annotated in the benchmark against GO
  Biological Process. This module is a textbook interferon-stimulated gene (ISG)
  signature: its 50 members are dominated by canonical type I/II interferon
  effectors — the 2'-5'-oligoadenylate synthetases (OAS1, OAS3, OASL), the MX
  GTPase MX1, the IFIT family (IFIT1, IFIT2, IFIT3), the ISG15 conjugation/
  effector arm (ISG15, HERC5), the IFI/IFI44 family (IFI6, IFI44, IFI44L),
  DDX60, CMPK2, EPSTI1, SAMD9L, and the IFN-gamma-associated GBP1/C1QB/CD86. The
  remaining members are a melanoma-derived tail of non-immune genes (ion
  channels, developmental TFs) that ride along in the DEG contrast. Because the
  ISG members literally carry the GO annotations for the processes an engaged
  interferon program executes, enrichment recovers those processes
  (annotation_supported). This is a confirmatory signature — an ISG panel
  restates its own construction — included to exercise the curation workflow on
  a third-party DEG benchmark rather than to surface novel mechanism.
contexts:
