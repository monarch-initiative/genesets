[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genesets-workflows"
version = "0.1.0"
description = "Convenience workflows, source preparation, and reports for genesets-rs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "genesets-rs contributors" },
]
dependencies = [
  "PyYAML>=6.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
reports = [
  "duckdb>=1.0",
  "pandas>=2.0",
]
explorer = [
  "duckdb>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
notebooks = [
  "duckdb>=1.0",
  "ipython>=8.0",
  "jupyter>=1.0",
  "nbconvert>=7.0",
  "pandas>=2.0",
]
curation = [
  "typer>=0.12",
  "linkml>=1.8",
  "linkml-term-validator>=0.4.5",
  "linkml-reference-validator>=0.2.1",
  # oaklib eagerly imports eutils; only eutils >= 0.6.1 dropped pkg_resources
  # (removed in setuptools 81), and that release requires Python >= 3.12 —
  # which is why requires-python is >= 3.12 rather than a setuptools pin.
  "oaklib>=0.7.4",
]

[project.scripts]
genesets-workflows = "genesets_workflows.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genesets_workflows"]
include = [
  "src/genesets_workflows/explorer/static/**",
]

[tool.uv]
package = true
