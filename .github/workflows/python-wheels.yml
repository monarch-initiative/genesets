name: Python wheels

# Builds abi3 wheels (one per platform, any Python >= 3.10) for the `genesets`
# bindings in python/genesets-py. Publishing a GitHub release uploads them to
# PyPI through trusted publishing (environment `pypi`). The package version is
# the release tag (`v0.2.0` or `0.2.0`), so nothing needs bumping beforehand.
on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "python/genesets-py/**"
      - ".github/workflows/python-wheels.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Version from the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.?[0-9]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version like v0.2.0 or v0.2.0-rc.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build and test
        working-directory: python/genesets-py
        run: |
          uv venv
          uv pip install pytest ./
          uv run --no-project pytest tests

  wheels:
    needs: [version, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-14
            target: aarch64
          # Intel macOS is cross-compiled; GitHub has retired the macos-13 runners.
          - os: macos-14
            target: x86_64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set the package version
        if: needs.version.outputs.version != ''
        shell: bash
        # Only the first `version =` line, the [package] one, is rewritten; the
        # backup is removed so the sdist does not ship it.
        run: perl -pi.bak -e '$done ||= s/^version = "[^"]*"/version = "${{ needs.version.outputs.version }}"/' python/genesets-py/Cargo.toml && rm python/genesets-py/Cargo.toml.bak
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python/genesets-py
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/genesets-py/dist

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the package version
        if: needs.version.outputs.version != ''
        shell: bash
        # Only the first `version =` line, the [package] one, is rewritten; the
        # backup is removed so the sdist does not ship it.
        run: perl -pi.bak -e '$done ||= s/^version = "[^"]*"/version = "${{ needs.version.outputs.version }}"/' python/genesets-py/Cargo.toml && rm python/genesets-py/Cargo.toml.bak
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python/genesets-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/genesets-py/dist

  publish:
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/genesets
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
